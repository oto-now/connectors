# yaml-language-server: $schema=../connector.schema.json
# Demodesk Public API v2: the OpenAPI 3.1.0 reference published by Demodesk
# (https://api-docs.demodesk.com/api/docs/v2/generated.yaml, read on 2026-11-16). Base https://demodesk.com/api/v2.
#
# Qualification
# - Who holds the access: a person of the customer's Demodesk company. The key inherits the rights of the user who
#   created it: it sees the meetings and recordings that user sees in the app, restricted groups included. To read
#   the whole company, the key must be an admin's who is a member of every restricted group; a recording set to
#   `only_me` stays visible to its host alone, whatever the key. Modes byo_user and byo_org, never a platform key
#   (these are the customer's own recorded calls).
# - How it authenticates: the key as a Bearer token in the Authorization header (the older `api-key` header is still
#   accepted, not used here). Created in Demodesk under Settings > Integrations > Other.
# - What a key allows: the creator's rights, read and write alike; the reference names no read-only key. Only reads
#   are described here.
# - What a call costs: nothing per call (Demodesk is a subscription), so no function declares a cost. No balance.
# - Does it engage: no. Every function described is a read.
# - What an agent must not see: `temporaryDirectUrl`, the direct link to a recording's video file, signed with a
#   temporary access token (it opens the video without a login), is stripped from the recordings list and from a
#   recording's detail. The HTML copy of a summary (`htmlContent`) is stripped too: it repeats `content`.
# - What a list returns: list_users and list_meetings keep a short projection of each item (1.0.1: a paginated list
#   cuts its answer down); list_recordings strips the video link only.
# - Limits: 120 requests per minute per key, every endpoint counted together (declared); the meetings and recordings
#   lists also count against 60 per minute per key, a per-route rate the format does not say. Above it, 429 with
#   Retry-After. Lists page by an opaque cursor (meta.nextCursor while meta.hasNext), 1 to 100 per page, 100 by
#   default.
# - Per-customer address: none.
# - Owner of the access: a commercial product sold to many companies.
#
# Errors. Every refusal answers {error: {code, message, requestId}}. The reference documents 400 (validation), 401
# (missing or invalid key), 403 (the user may not access the resource, e.g. not assigned to a company), 404 and 429.
# It names no error codes, so no entry reads the body. 403 is not a refused key: it does not mark the account.
#
# Transcripts. GET /recordings/{token}/transcript answers 200 with the transcript, 202 while it is still being
# processed (an error body, read by the agent as is: the format requires a body condition to name a refusal under a
# success status, and the reference gives no code to match), 204 when it exists but is empty or too short (no body:
# the agent receives an empty answer). Only the JSON format is described on that route: its plain-text format answers
# text/plain, which the format does not read. The batch route answers JSON in both formats, plain text included, with
# a status per recording (ready, processing, not_requested, empty, not_found): get_transcripts serves plain text
# there. Its batch is capped at 25 recordings here (100 by the reference) so that one answer stays readable: an hour
# of call is tens of thousands of characters.
#
# Choices
# - The recording filters are the reference's Ransack keys in a deep object (`filter[host_in][]=…`), sent with
#   query_arrays brackets. Only the `_in` form of a multi-valued filter is described (a list of one is one value), and
#   date bounds as `_gteq` (from, inclusive) and `_lt` (before, exclusive). The duration filter is left out: the
#   reference does not say its unit.
# - The meetings list is ordered oldest first: its description tells the agent to bound it by date.
# - No live call has been made against Demodesk for this description.
#
# Left out, and why
# - DELETE /recordings/{token}: deletes a recording for good; no write is described.
# - Settings (personal, other users', company: keyword lists), groups and their members, feedback submissions:
#   administration of the Demodesk account, and their writes.
# - The v1 API (users creation, older demo and recording routes): the reference sends new use to v2.
# - Webhooks: enabled by Demodesk support on request, not through the API.
connector:
  name: demodesk
  label: Demodesk
  namespace: demodesk
  version: 1.0.2
  api_version: v2
  base_url: https://demodesk.com/api/v2
  auth: { kind: bearer, token: api_key }
  credential:
    - { name: api_key, label: Demodesk API key, secret: true }
  modes: [byo_user, byo_org]
  timeout_s: 60
  query_arrays: brackets
  rate_limit: { requests: 120, seconds: 60 }
  probe: { function: get_current_user }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Demodesk rejected the request: a filter, a cursor, a limit or a language is invalid (error.message says which)." }
    - { status: 401, code: key_refused, retryable: false, marks_account: credential_rejected,
        message: "Demodesk refused the API key: missing, invalid or revoked. A key is created in Demodesk under Settings > Integrations > Other." }
    - { status: 403, code: forbidden, retryable: false,
        message: "Demodesk refused this call for this key: its user may not access this resource (for instance, not assigned to a company)." }
    - { status: 404, code: not_found, retryable: false,
        message: "Not found in Demodesk, or not visible to the key's user: a host-only or only-me recording, or one of a restricted group the user is not in, answers 404 like a missing one." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Demodesk rate limit reached (120 requests per minute per key, 60 for the meetings and recordings lists): wait, then retry." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Demodesk is temporarily unavailable: retry later." }

functions:
  # --- Users ----------------------------------------------------------------

  - name: get_current_user
    class: read
    description: >-
      Who the API key belongs to: id, firstName, lastName, email, role, locale,
      timeZone and groups. Every list answers what this user sees in Demodesk,
      so this says whose meetings "my meetings" are, and whether the key can
      see the whole company (an admin in every restricted group) or only part
      of it. In French: utilisateur de la clé demodesk, mon compte demodesk.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: Whose key is this, input: {} }
    call: { method: GET, path: /me }

  - name: list_users
    class: read
    description: >-
      The active users of the company visible to the key's user, one page of
      items {id, firstName, lastName, email, role, locale, timeZone}. search
      matches part of a name or an email,
      case-insensitive. Use it to resolve a teammate before filtering meetings
      or recordings by host; those filters also take an email directly. Next
      page: pass next_cursor back as cursor (null on the last page). In French:
      lister les utilisateurs demodesk, trouver un collègue, équipe commerciale
      demodesk.
    input:
      type: object
      additionalProperties: false
      properties:
        search: { type: string, minLength: 1, personal: true, description: "Part of a full name or an email, case-insensitive." }
        cursor: &cursor { type: string, minLength: 1, description: "meta.nextCursor of the previous page, as given." }
        limit: &limit { type: integer, minimum: 1, maximum: 100, description: "Items per page, 1 to 100 (default 100)." }
    examples:
      - { title: The users, input: {} }
      - { title: Find a teammate, input: { search: jane } }
    call:
      method: GET
      path: /users
      query: { search: search, cursor: cursor, limit: limit }
    pagination: &pages { kind: cursor, request_param: cursor, next: meta.nextCursor, more: meta.hasNext, max_pages: 10 }
    # An assistant resolves a teammate from these: locale and timeZone stay out.
    output: { items: data, projection: [id, firstName, lastName, email, role] }

  # --- Meetings -------------------------------------------------------------

  - name: list_meetings
    class: read
    description: >-
      Meetings visible to the key's user, recorded or not, ordered by start
      date OLDEST FIRST: bound them with starts_from (and starts_before) to get
      recent ones. Items {demoId, name, status (scheduled, in_progress, ended,
      canceled), host {userId, displayName, email}, startDate, endDate (both
      scheduled), access, recordingTokens}: recordingTokens are the tokens to
      read with get_recording, get_transcript and list_summaries ([] = not
      recorded, or not visible). Zoom, Teams and Meet calls stay scheduled
      while they run; ended does not mean the attendees came. Next page: pass
      next_cursor back as cursor. In French: lister les rendez-vous, réunions
      demodesk, démos planifiées, rendez-vous de la semaine.
    input:
      type: object
      additionalProperties: false
      properties:
        starts_from: { type: string, format: date-time, description: "Meetings starting at or after this ISO 8601 date-time." }
        starts_before: { type: string, format: date-time, description: "Meetings starting before this ISO 8601 date-time." }
        hosts: &hosts
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
          personal: true
          description: "Only these hosts: each an email address, or me for the key's user."
        statuses:
          type: array
          minItems: 1
          items: { type: string, enum: [scheduled, in_progress, ended, canceled] }
          description: "Only meetings in one of these statuses."
        cursor: *cursor
        limit: *limit
    examples:
      - { title: My meetings in October, input: { hosts: [me], starts_from: "2026-10-01T00:00:00Z", starts_before: "2026-11-01T00:00:00Z" } }
      - { title: Canceled meetings since Monday, input: { statuses: [canceled], starts_from: "2026-11-09T00:00:00Z" } }
    call:
      method: GET
      path: /meetings
      query:
        "filter[start_date_gteq]": starts_from
        "filter[start_date_lt]": starts_before
        "filter[host_in]": hosts
        "filter[status_in]": statuses
        cursor: cursor
        limit: limit
    pagination: *pages
    # The host is already a summary {userId, displayName, email}; the rest of the meeting stays out.
    output: { items: data, projection: [demoId, name, status, host, startDate, endDate, access, recordingTokens] }

  # --- Recordings -----------------------------------------------------------

  - name: list_recordings
    class: read
    description: >-
      Recorded calls visible to the key's user, one page of items
      {recordingToken, demoId, userId (the host), name, recordingWebUrl (the
      call in Demodesk), status, postprocessingStatus, demoStartDate,
      durationMs, access, crmLinks, groupIds}. postprocessing_statuses [done]
      keeps the calls whose
      transcript and summaries are ready. To find the calls with a company,
      filter by its attendees' email domains (all of them), not by title. hosts
      and attendees take emails or me. The video link is never given. Next
      page: pass next_cursor back as cursor. In French: enregistrements
      d'appels, appels enregistrés, démos enregistrées.
    input:
      type: object
      additionalProperties: false
      properties:
        meeting_from: { type: string, format: date-time, description: "Calls whose meeting started at or after this ISO 8601 date-time." }
        meeting_before: { type: string, format: date-time, description: "Calls whose meeting started before this ISO 8601 date-time." }
        created_from: { type: string, format: date-time, description: "Recordings created at or after this ISO 8601 date-time." }
        created_before: { type: string, format: date-time, description: "Recordings created before this ISO 8601 date-time." }
        hosts: *hosts
        attendees:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
          personal: true
          description: "Only calls one of these attendees joined: each an email address, or me."
        attendee_domains:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
          description: "Only calls with an attendee at one of these exact email domains (example.com), every domain the company uses."
        meeting_id: { type: string, minLength: 1, description: "Only the recordings of this meeting (demoId of list_meetings)." }
        group_ids:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
          description: "Only calls of one of these Demodesk groups (ids from the user's groups in get_current_user)."
        statuses:
          type: array
          minItems: 1
          items: { type: string, enum: [pending, ready, failure, cancelled, expired] }
          description: "Recording status: pending (running or processing), ready, failure, cancelled (never started), expired."
        postprocessing_statuses:
          type: array
          minItems: 1
          items: { type: string, enum: [pending, done, failed, too_short] }
          description: "Post-processing (transcript, summaries, statistics) status; done when they are ready."
        access:
          type: array
          minItems: 1
          items: { type: string, enum: [company_wide, selected_groups, host_only] }
          description: "Only recordings with one of these access levels."
        cursor: *cursor
        limit: *limit
    examples:
      - { title: My processed calls this month, input: { hosts: [me], postprocessing_statuses: [done], meeting_from: "2026-11-01T00:00:00Z" } }
      - { title: Calls with one company, input: { attendee_domains: [example.com, example.de] } }
      - { title: The recordings of one meeting, input: { meeting_id: "123" } }
    call:
      method: GET
      path: /recordings
      query:
        "filter[demo_start_date_gteq]": meeting_from
        "filter[demo_start_date_lt]": meeting_before
        "filter[created_at_gteq]": created_from
        "filter[created_at_lt]": created_before
        "filter[host_in]": hosts
        "filter[attendee_in]": attendees
        "filter[attendee_domain_in]": attendee_domains
        "filter[demo_id_eq]": meeting_id
        "filter[group_id_in]": group_ids
        "filter[status_in]": statuses
        "filter[postprocessing_status_in]": postprocessing_statuses
        "filter[access_in]": access
        cursor: cursor
        limit: limit
    pagination: *pages
    # The signed link to the video file opens it without a login: it never reaches the agent.
    output: { items: data, strip: [temporaryDirectUrl] }

  - name: get_recording
    class: read
    description: >-
      One recorded call by its token: name, recordingWebUrl, status,
      postprocessingStatus, demoStartDate, durationMs, access, host, groups,
      crmLinks, meetingLocation, audioOnly, attendeeClassification (internal
      or external meeting), participants [{displayName, email, permission,
      attended, crmLinks}] and statistics {engagementScore, feedbackScore}. The
      transcript, the AI
      summaries and the scorecards are read with get_transcript,
      list_summaries and list_scorecards. The video link is never given. In
      French: détail d'un enregistrement, infos d'un appel enregistré.
    input:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: &token { type: string, minLength: 1, description: "The recording token (recordingToken of list_recordings, or one of a meeting's recordingTokens)." }
    examples:
      - { title: One call, input: { token: d0584dc4e31be4a0 } }
    call: { method: GET, path: "/recordings/{token}" }
    output:
      strip: [data.temporaryDirectUrl]
      sample:
        data: { recordingToken: d0584dc4e31be4a0, name: Discovery call, status: ready, temporaryDirectUrl: "https://media.example.test/video.mp4?token=t" }

  - name: get_transcript
    class: read
    description: >-
      The transcript of one recorded call, structured: data {language,
      paragraphs [{speaker {displayName}, startInSeconds, endInSeconds,
      sentences [{text, startInSeconds, endInSeconds}]}]}. lang translates it
      on the fly (de, fr, en-US). An answer holding error instead of data means
      the transcript is still being processed: retry later. An empty answer
      means it exists but is empty or too short. Heavy for a long call: list_summaries
      is shorter, and get_transcripts gives plain text. In French: transcription d'un
      appel, verbatim d'une démo, ce qui a été dit en rendez-vous.
    input:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: *token
        lang: &lang { type: string, pattern: "^[a-z]{2}(-[A-Z]{2})?$", description: "Translate to this language: two lowercase letters, optionally a region (de, fr, en-US)." }
    examples:
      - { title: The transcript of a call, input: { token: d0584dc4e31be4a0 } }
      - { title: Translated to French, input: { token: d0584dc4e31be4a0, lang: fr } }
    call:
      method: GET
      path: "/recordings/{token}/transcript"
      query: { lang: lang }

  - name: get_transcripts
    class: read
    description: >-
      The transcripts of up to 25 recorded calls in one request, each with its
      own status: data [{recordingToken, status (ready, processing,
      not_requested, empty, not_found), transcript}]. format plaintext (the
      compact one) gives transcript {language, text} with speaker-prefixed
      lines; json gives paragraphs and sentences as get_transcript. lang
      translates them. A token that is not visible to the key's user comes back
      not_found, the others still answer. In French: transcriptions de plusieurs
      appels, transcriptions en lot.
    input:
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens:
          type: array
          minItems: 1
          maxItems: 25
          uniqueItems: true
          items: { type: string, minLength: 1 }
          description: "Recording tokens, 1 to 25, from list_recordings or a meeting's recordingTokens."
        format: { type: string, enum: [json, plaintext], description: "plaintext: one text per call; json (default): paragraphs and sentences." }
        lang: *lang
    examples:
      - { title: Three calls as plain text, input: { tokens: [d0584dc4e31be4a0, a1b2c3d4e5f60718, 0f1e2d3c4b5a6978], format: plaintext } }
    call:
      method: POST
      path: /transcripts/batch
      body: { recordingTokens: tokens, format: format, lang: lang }

  - name: list_summaries
    class: read
    description: >-
      The AI-generated notes of one recorded call: data [{summaryId, promptName
      (the summary template), languageCode, content, createdAt, updatedAt}],
      one per template the company runs (recap, next steps, CRM notes...).
      Shorter than the transcript: read it first for what was decided. []
      while post-processing is not done. In French: compte rendu d'un appel,
      résumé d'une démo, prochaines étapes d'un rendez-vous.
    input:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: *token
    examples:
      - { title: The summaries of a call, input: { token: d0584dc4e31be4a0 } }
    call: { method: GET, path: "/recordings/{token}/summaries" }
    # The HTML copy repeats `content`: left out so the answer stays light.
    output:
      strip: [data.htmlContent]
      sample:
        data:
          - { summaryId: "1", promptName: Recap, languageCode: en, content: "Next steps: send the quote.", htmlContent: "<p>Next steps: send the quote.</p>" }

  - name: list_scorecards
    class: read
    description: >-
      The coaching scorecards of one recorded call (deleted ones left out):
      data [{scorecardId, templateName, score, comment, giverUserId,
      receiverUserId, questions [{name, text, criteria, weight, score,
      comment}], createdAt}]. [] when nobody scored the call. In French: grilles
      d'évaluation d'un appel, notes de coaching, scorecard d'un commercial.
    input:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: *token
    examples:
      - { title: The scorecards of a call, input: { token: d0584dc4e31be4a0 } }
    call: { method: GET, path: "/recordings/{token}/scorecards" }
