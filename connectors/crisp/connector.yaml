# yaml-language-server: $schema=../connector.schema.json
# Crisp REST API reference (V1): https://docs.crisp.chat/references/rest-api/v1/
# Authentication: https://docs.crisp.chat/guides/rest-api/authentication/
# Rate limits: https://docs.crisp.chat/guides/rest-api/rate-limits/
#
# Reads (GET) and, since 1.1.0, a few writes on conversations and contacts:
# an internal note, the state of a conversation, the contact details a
# conversation carries, a contact's profile and custom data, the segments of a
# conversation or of a contact, and a text message sent to the contact. Nothing
# deletes, nothing touches the knowledge base, nothing moves a conversation to
# another inbox. Every write acts on real conversations of real people.
#
# What the reference says about the writes (read 2026-11-21):
#
# - A message: POST /conversation/{session_id}/message, {type, from, origin,
#   content}. A note is type note (the team sees it, the contact does not); a
#   text is type text and reaches the contact. Both are sent here from
#   operator with origin chat, as in the reference's examples; the reference
#   does not say how an operator message reaches the conversation's channel
#   (WhatsApp, Instagram...) nor whether origin must name that channel. The
#   answer is 202 {data: {fingerprint}}; 406 (message_rule_spammy or
#   message_rule_blocked) and 409 (too_many_messages) refuse a message.
# - Messaging window of a channel (WhatsApp's 24 hours): the reference says
#   nothing, neither a refusal code nor a template to use when it is closed.
#   It documents no WhatsApp template at all (only campaign templates, which
#   are email campaigns).
# - State: PATCH /conversation/{session_id}/state, {state: pending,
#   unresolved or resolved}.
# - Contact details of a conversation: PATCH /conversation/{session_id}/meta
#   (nickname, email, phone, address, segments...). Contact profile: PATCH
#   /people/profile/{people_id}, which "saves only changed fields" (email,
#   person {nickname, phone, address...}, segments). Custom data: PATCH
#   /people/data/{people_id} "merges the new data keys with already-set data"
#   (PUT, which replaces, is not used).
# - Segments: both PATCH routes take segments as a list; the reference does
#   not say whether the list given replaces the current one or is added to
#   it. set_conversation_segments and set_person_segments send the WHOLE list,
#   and are declared as replacing it (sensitive, destroy): a caller that adds
#   or removes one segment reads the current list first and sends the result.
#
# Account. A website token is a keypair (identifier and key) that a workspace
# owner generates in Settings > Workspace Settings > Advanced configuration
# (API Token, shown once). It is sent as HTTP Basic identifier:key with the
# header X-Crisp-Tier: website, reaches only the workspace it was generated
# for, and is limited to 10,000 requests per day. The website_id is not part
# of the token: it is read in Settings > Workspace Settings > Setup
# Instructions and kept as a setting of the account, cited by base_url.
#
# What the reference says, for a consumer that calls the REST API directly:
#
# 1. Incremental reading of conversations. GET /conversations/{page_number}
#    takes filter_date_start and filter_date_end (ISO 8601), both "relative to
#    conversation update date", and order_date_updated=1 to order by update
#    date. Paging is by page number in the path (from 1), per_page between 20
#    and 50 (default 20). The reference does not say the sort direction, nor
#    how the last page is marked (no total, no next page in the response). The
#    messages of one conversation are paged by timestamp: no parameter gives
#    the last batch, timestamp_before pages towards older messages,
#    timestamp_after towards newer ones, timestamp_around centers on one; the
#    reference gives no page size. People profiles take filter_date_start and
#    filter_date_end relative to their CREATION date.
#
# 2. Messaging window of a channel (such as the 24-hour window of WhatsApp).
#    The reference says nothing about it: no field of a conversation tells that
#    a window is open or closed. What it does give: each message carries from
#    (user = the contact, operator = the team), origin (chat, email or urn:*)
#    and timestamp; the latest batch of messages is what GET
#    /conversation/{session_id}/messages returns without parameter, so the
#    last inbound message is the latest one with from = user (if that batch
#    has none, page back with timestamp_before). The conversation
#    itself has last_message (excerpt of the visitor's last message, without
#    its date), updated_at, waiting_since, active.last and unread counters.
#
# 3. Fields. A people profile: people_id, email, person {nickname (first and
#    last name), avatar, gender, phone, address, description, website,
#    timezone, profiles [{type, handle, url}], employment, geolocation,
#    locales}, company, segments, notepad, active {now, last}, score,
#    created_at, updated_at. Its custom data is a separate resource, GET
#    /people/data/{people_id}, {data: {...}}. A conversation: session_id,
#    website_id, inbox_id, people_id, state (pending, unresolved, resolved),
#    status (0, 1, 2, alias of state), is_verified, is_blocked, availability,
#    active, last_message, preview_message, topic, verifications,
#    participants, mentions, scheduled_messages, created_at, updated_at,
#    waiting_since, compose, unread, assigned {user_id}, segments, and meta
#    {nickname, email, phone, address, subject, origin, ip, connection, data,
#    avatar, device, useragent, timezone, locales, segments}. The channel is
#    meta.origin: chat, email or urn:*; the reference does not list the URN of
#    each channel (WhatsApp, Instagram, Messenger...).
#
# Filtering by channel: the list of conversations has no origin or channel
# parameter. It filters by inbox (filter_inbox_id); an inbox carries
# conditions {model: session, criterion, operator, query}, but the reference
# does not list the criteria. search_type=filter takes a filter in
# search_query whose syntax the reference does not document.
#
# Timestamps are numbers; the reference gives message timestamps in
# milliseconds.
connector:
  name: crisp
  label: Crisp
  logo_domain: crisp.chat
  namespace: crisp
  version: 1.1.0
  api_version: REST API V1
  base_url: https://api.crisp.chat/v1/website/{website_id}
  auth:
    kind: basic
    username: token_identifier
    password: token_key
  credential:
    - { name: token_identifier, label: Website token identifier, secret: false }
    - { name: token_key, label: Website token key, secret: true }
  settings:
    - { name: website_id, label: Website ID, type: text, pattern: "^[A-Za-z0-9-]+$" }
  modes: [byo_user, byo_org]
  headers: { X-Crisp-Tier: website }
  probe: { function: get_website, non_empty: [data.website_id] }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Crisp rejected the request as invalid: check the arguments." }
    - { status: 401, code: access_rejected, retryable: false, marks_account: credential_rejected,
        message: "Crisp rejected the website token: unknown, or rolled since (rolling a token revokes the previous one)." }
    - { status: 402, code: plan_required, retryable: false,
        message: "Crisp answered 402 Payment Required: the workspace's Crisp plan does not give access to this resource." }
    - { status: 403, code: forbidden, retryable: false,
        message: "Crisp refused the access: the token does not reach this workspace or this resource; check the website ID of the account." }
    - { status: 404, code: not_found, retryable: false,
        message: "Crisp object not found: check the id." }
    - { status: 416, code: page_out_of_range, retryable: false,
        message: "Crisp answered 416 Requested Range Not Satisfiable: this page is out of range." }
    - { status: 423, code: locked, retryable: false,
        message: "Crisp answered 423 Locked for this resource." }
    - { status: [420, 429], code: rate_limited, retryable: true,
        message: "Crisp rate limit reached (a website token is limited to 10,000 requests per day): retry later." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Crisp is temporarily unavailable: retry later." }

functions:
  - name: get_website
    class: read
    description: >-
      Get the Crisp workspace (website) the account reads: {error, reason,
      data: {website_id, name, domain, logo, verified, institutional}}.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The workspace of the account
        input: {}
    call: { method: GET, path: / }
    cost: { per: request }

  - name: list_inboxes
    class: read
    description: >-
      List the inboxes of the Crisp workspace, by page: [{inbox_id, name,
      emoji, order, operators, teams, team_operators, operator, conditions:
      [{model, criterion, operator, query}], created_at, updated_at}]. An
      inbox_id filters list_conversations; an inbox's conditions say which
      conversations it gathers (a channel, for instance).
    input:
      type: object
      additionalProperties: false
      required: [page_number]
      properties:
        page_number: &page_number { type: integer, minimum: 1, default: 1, description: "Page number, from 1." }
    examples:
      - title: First page of inboxes
        input: { page_number: 1 }
    call: { method: GET, path: "/inboxes/list/{page_number}" }
    output: { items: data }
    cost: { per: request }

  - name: get_inbox
    class: read
    description: >-
      Get one inbox of the Crisp workspace: {error, reason, data: {inbox_id,
      name, emoji, order, operators, teams, team_operators, operator,
      conditions, created_at, updated_at}}.
    input:
      type: object
      additionalProperties: false
      required: [inbox_id]
      properties:
        inbox_id: { type: string, minLength: 1, not: { enum: [".", ".."] }, description: "The inbox id, from list_inboxes." }
    examples:
      - title: One inbox
        input: { inbox_id: "0b0c3d6e-1f2a-4b5c-8d9e-0f1a2b3c4d5e" }
    refusals:
      - { code: inbox_not_found, when: 404, message: "No inbox with this id in this Crisp workspace." }
    call: { method: GET, path: "/inbox/{inbox_id}" }
    cost: { per: request }

  - name: list_conversations
    class: read
    description: >-
      List the conversations of the Crisp workspace (chat, email and the other
      channels connected to the workspace), by page of
      per_page (20 to 50, default 20): [{session_id, inbox_id, people_id,
      state (pending, unresolved, resolved), is_verified, is_blocked,
      availability, last_message (excerpt of the visitor's last message),
      preview_message, topic, segments, participants, assigned, unread,
      created_at, updated_at, waiting_since, meta: {nickname, email, phone,
      origin, subject, data, segments...}}]. The channel is meta.origin:
      chat, email or a urn: there is no channel parameter; filter_inbox_id
      narrows to one inbox. For incremental reading, filter_date_start and
      filter_date_end (ISO 8601) bound the UPDATE date, and
      order_date_updated orders by it; the response gives neither a total nor
      a next page. Timestamps are numbers. May contain personal or health data: read only what the task needs, and do not look a person up by name or phone number unless the task requires it.
    input:
      type: object
      additionalProperties: false
      required: [page_number]
      properties:
        page_number: *page_number
        per_page: &per_page { type: integer, minimum: 20, maximum: 50, default: 20 }
        include_empty: &c_include_empty { type: integer, enum: [0, 1], description: "1: include the conversations without any message." }
        filter_inbox_id: &c_filter_inbox_id { type: string, minLength: 1, description: "Only the conversations of this inbox (inbox_id), or all." }
        filter_unread: &c_filter_unread { type: integer, enum: [0, 1], description: "1: only conversations with unread messages." }
        filter_resolved: &c_filter_resolved { type: integer, enum: [0, 1], description: "1: only resolved conversations." }
        filter_not_resolved: &c_filter_not_resolved { type: integer, enum: [0, 1], description: "1: only conversations not resolved." }
        filter_assigned: &c_filter_assigned { type: string, minLength: 1, description: "Only the conversations assigned to this operator user id." }
        filter_unassigned: &c_filter_unassigned { type: integer, enum: [0, 1], description: "1: only conversations assigned to nobody." }
        filter_date_start: &c_filter_date_start { type: string, format: date-time, description: "From this update date (ISO 8601, e.g. 2026-03-01T17:00:00.000Z)." }
        filter_date_end: &c_filter_date_end { type: string, format: date-time, description: "Up to this update date (ISO 8601)." }
        order_date_created: &c_order_date_created { type: integer, enum: [0, 1], description: "1: order by creation date." }
        order_date_updated: &c_order_date_updated { type: integer, enum: [0, 1], description: "1: order by update date." }
        order_date_waiting: &c_order_date_waiting { type: integer, enum: [0, 1], description: "1: order by longest waiting, and keep only the waiting conversations." }
    examples:
      - title: Conversations updated since March 1st, by update date
        input: { page_number: 1, per_page: 50, filter_date_start: "2026-03-01T00:00:00.000Z", order_date_updated: 1 }
      - title: Unresolved conversations of one inbox
        input: { page_number: 1, filter_inbox_id: "0b0c3d6e-1f2a-4b5c-8d9e-0f1a2b3c4d5e", filter_not_resolved: 1 }
    call:
      method: GET
      path: "/conversations/{page_number}"
      query: { per_page: per_page, include_empty: include_empty, filter_inbox_id: filter_inbox_id,
               filter_unread: filter_unread, filter_resolved: filter_resolved,
               filter_not_resolved: filter_not_resolved, filter_assigned: filter_assigned,
               filter_unassigned: filter_unassigned, filter_date_start: filter_date_start,
               filter_date_end: filter_date_end, order_date_created: order_date_created,
               order_date_updated: order_date_updated, order_date_waiting: order_date_waiting }
    output: { items: data }
    cost: { per: request }

  - name: search_conversations
    class: read
    description: >-
      Search the conversations of the Crisp workspace: search_type text (the
      default) searches search_query in the conversations, segment returns the
      conversations carrying the segment named by search_query. Same filters,
      paging and items as list_conversations. Search a topic or a segment,
      not a person. May contain personal or health data: read only what the task needs, and do not look a person up by name or phone number unless the task requires it.
    input:
      type: object
      additionalProperties: false
      required: [page_number, search_query]
      properties:
        page_number: *page_number
        per_page: *per_page
        include_empty: *c_include_empty
        filter_inbox_id: *c_filter_inbox_id
        filter_unread: *c_filter_unread
        filter_resolved: *c_filter_resolved
        filter_not_resolved: *c_filter_not_resolved
        filter_assigned: *c_filter_assigned
        filter_unassigned: *c_filter_unassigned
        filter_date_start: *c_filter_date_start
        filter_date_end: *c_filter_date_end
        order_date_created: *c_order_date_created
        order_date_updated: *c_order_date_updated
        order_date_waiting: *c_order_date_waiting
        search_query: { type: string, minLength: 1, personal: true, description: "The text to search, or the segment name." }
        search_type: { type: string, enum: [text, segment], default: text }
    examples:
      - title: Conversations about a delivery delay
        input: { page_number: 1, search_query: "delivery delay" }
      - title: Conversations of the segment vip, updated since March 1st
        input: { page_number: 1, search_query: vip, search_type: segment, filter_date_start: "2026-03-01T00:00:00.000Z" }
    call:
      method: GET
      path: "/conversations/{page_number}"
      query: { search_query: search_query, search_type: search_type,
               per_page: per_page, include_empty: include_empty, filter_inbox_id: filter_inbox_id,
               filter_unread: filter_unread, filter_resolved: filter_resolved,
               filter_not_resolved: filter_not_resolved, filter_assigned: filter_assigned,
               filter_unassigned: filter_unassigned, filter_date_start: filter_date_start,
               filter_date_end: filter_date_end, order_date_created: order_date_created,
               order_date_updated: order_date_updated, order_date_waiting: order_date_waiting }
    output: { items: data }
    cost: { per: request }

  - name: get_conversation
    class: read
    description: >-
      Get one Crisp conversation: {error, reason, data: {session_id, inbox_id,
      people_id, state (pending, unresolved, resolved), status, is_verified,
      is_blocked, availability, active: {now, last}, last_message (excerpt of
      the visitor's last message, without its date), preview_message, topic,
      verifications, participants, mentions, segments, assigned, unread,
      created_at, updated_at, waiting_since, meta: {nickname, email, phone,
      address, subject, origin (chat, email or urn:*), ip, data, device,
      timezone, locales, segments}}}. No field says whether a channel's
      messaging window (such as WhatsApp's 24 hours) is open: read the date
      of the contact's last message in list_conversation_messages. May contain personal or health data: read only what the task needs, and do not look a person up by name or phone number unless the task requires it.
    input:
      type: object
      additionalProperties: false
      required: [session_id]
      properties:
        session_id: &session_id { type: string, minLength: 1, not: { enum: [".", ".."] }, description: "The conversation session_id (session_...)." }
    examples:
      - title: One conversation
        input: { session_id: "session_700c65e1-85e2-465a-b9ac-ecb5ec2c9881" }
    refusals:
      - &conversation_not_found { code: conversation_not_found, when: 404, message: "No conversation with this session_id in this Crisp workspace." }
    call: { method: GET, path: "/conversation/{session_id}" }
    cost: { per: request }

  - name: get_conversation_meta
    class: read
    description: >-
      Get the metadata of one Crisp conversation: {error, reason, data:
      {nickname, email, phone, address, subject, origin (the channel: chat,
      email or urn:*), ip, connection, data (custom data of the
      conversation), avatar, device, useragent, timezone, locales, segments}}.
      May contain personal or health data: read only what the task needs, and do not look a person up by name or phone number unless the task requires it.
    input:
      type: object
      additionalProperties: false
      required: [session_id]
      properties:
        session_id: *session_id
    examples:
      - title: Channel and segments of one conversation
        input: { session_id: "session_700c65e1-85e2-465a-b9ac-ecb5ec2c9881" }
    refusals:
      - *conversation_not_found
    call: { method: GET, path: "/conversation/{session_id}/meta" }
    cost: { per: request }

  - name: list_conversation_messages
    class: read
    description: >-
      List the messages of one Crisp conversation. Without parameter, the
      latest batch; timestamp_before pages towards older messages (pass the
      timestamp of the oldest message received), timestamp_after towards
      newer ones, timestamp_around centers the batch on one timestamp. Items:
      [{fingerprint, type (text, note, file, animation, audio, picker, field,
      carousel, event), from (user = the contact, operator = the team),
      origin (chat, email or urn:*), content, timestamp (milliseconds), user:
      {type, user_id, nickname}, attachments, automated, read, delivered,
      edited, translated}]. type note is an internal note of the team. The
      date of the contact's last message is the latest timestamp with from
      user. May contain personal or health data: read only what the task needs, and do not look a person up by name or phone number unless the task requires it.
    input:
      type: object
      additionalProperties: false
      required: [session_id]
      properties:
        session_id: *session_id
        timestamp_before: { type: integer, minimum: 0, description: "Batch ending before this timestamp (milliseconds): older messages." }
        timestamp_after: { type: integer, minimum: 0, description: "Batch starting after this timestamp (milliseconds): newer messages." }
        timestamp_around: { type: integer, minimum: 0, description: "Batch centered on this timestamp (milliseconds)." }
    examples:
      - title: Latest messages of one conversation
        input: { session_id: "session_700c65e1-85e2-465a-b9ac-ecb5ec2c9881" }
      - title: Older messages
        input: { session_id: "session_700c65e1-85e2-465a-b9ac-ecb5ec2c9881", timestamp_before: 1772380800000 }
    refusals:
      - *conversation_not_found
    call:
      method: GET
      path: "/conversation/{session_id}/messages"
      query: { timestamp_before: timestamp_before, timestamp_after: timestamp_after, timestamp_around: timestamp_around }
    output: { items: data }
    cost: { per: request }

  - name: list_people
    class: read
    description: >-
      List the contacts (people profiles) of the Crisp workspace, by page of
      per_page (20 to 50, default 20): [{people_id, email, person: {nickname
      (first and last name), phone, address, gender, timezone, profiles,
      employment, geolocation, locales}, company, segments, notepad, active,
      score, created_at, updated_at}]. filter_date_start and filter_date_end
      bound the CREATION date of the profile. Custom data is not here: see
      get_person_data. May contain personal or health data: read only what the task needs, and do not look a person up by name or phone number unless the task requires it.
    input:
      type: object
      additionalProperties: false
      required: [page_number]
      properties:
        page_number: *page_number
        per_page: *per_page
        sort_field: &p_sort_field { type: string, minLength: 1, description: "Field to sort on, such as nickname." }
        sort_order: &p_sort_order { type: string, enum: [ascending, descending] }
        filter_date_start: &p_filter_date_start { type: string, format: date-time, description: "From this profile creation date (ISO 8601)." }
        filter_date_end: &p_filter_date_end { type: string, format: date-time, description: "Up to this profile creation date (ISO 8601)." }
    examples:
      - title: Contacts created since March 1st
        input: { page_number: 1, per_page: 50, filter_date_start: "2026-03-01T00:00:00.000Z" }
    call:
      method: GET
      path: "/people/profiles/{page_number}"
      query: { per_page: per_page, sort_field: sort_field, sort_order: sort_order,
               filter_date_start: filter_date_start, filter_date_end: filter_date_end }
    output: { items: data }
    cost: { per: request }

  - name: search_people
    class: read
    description: >-
      Search the contacts of the Crisp workspace with a quick text search
      (search_text); same paging, filters and items as list_people. Prefer
      an id or an email received from the task. May contain personal or health data: read only what the task needs, and do not look a person up by name or phone number unless the task requires it.
    input:
      type: object
      additionalProperties: false
      required: [page_number, search_text]
      properties:
        page_number: *page_number
        per_page: *per_page
        sort_field: *p_sort_field
        sort_order: *p_sort_order
        filter_date_start: *p_filter_date_start
        filter_date_end: *p_filter_date_end
        search_text: { type: string, minLength: 1, personal: true, description: "Text of the quick search." }
    examples:
      - title: Contacts of one email domain
        input: { page_number: 1, search_text: "example.com" }
    call:
      method: GET
      path: "/people/profiles/{page_number}"
      query: { search_text: search_text, per_page: per_page, sort_field: sort_field,
               sort_order: sort_order, filter_date_start: filter_date_start,
               filter_date_end: filter_date_end }
    output: { items: data }
    cost: { per: request }

  - name: get_person
    class: read
    description: >-
      Get one contact (people profile) of the Crisp workspace by its
      people_id, or by its email: {error, reason, data: {people_id, email,
      person: {nickname, avatar, gender, phone, address, description,
      website, timezone, profiles, employment, geolocation, locales}, company,
      segments, notepad, active, score, created_at, updated_at}}. May contain personal or health data: read only what the task needs, and do not look a person up by name or phone number unless the task requires it.
    input:
      type: object
      additionalProperties: false
      required: [people_id]
      properties:
        people_id: &people_id { type: string, minLength: 1, not: { enum: [".", ".."] }, personal: true, description: "The people_id, or the contact's email." }
    examples:
      - title: One contact
        input: { people_id: "c4b4ab32-4c4d-4b6f-9d8a-1f2e3d4c5b6a" }
    refusals:
      - &person_not_found { code: person_not_found, when: 404, message: "No contact with this people_id or email in this Crisp workspace." }
    call: { method: GET, path: "/people/profile/{people_id}" }
    cost: { per: request }

  - name: get_person_data
    class: read
    description: >-
      Get the custom data of one contact of the Crisp workspace: {error,
      reason, data: {data: {<key>: <value>}}}, the keys the workspace defined.
      May contain personal or health data: read only what the task needs, and do not look a person up by name or phone number unless the task requires it.
    input:
      type: object
      additionalProperties: false
      required: [people_id]
      properties:
        people_id: *people_id
    examples:
      - title: Custom data of one contact
        input: { people_id: "c4b4ab32-4c4d-4b6f-9d8a-1f2e3d4c5b6a" }
    refusals:
      - *person_not_found
    call: { method: GET, path: "/people/data/{people_id}" }
    cost: { per: request }

  - name: list_person_conversations
    class: read
    description: >-
      List the conversations of one contact of the Crisp workspace, by page:
      data is a list of session_id, to read with get_conversation. May contain personal or health data: read only what the task needs, and do not look a person up by name or phone number unless the task requires it.
    input:
      type: object
      additionalProperties: false
      required: [people_id, page_number]
      properties:
        people_id: *people_id
        page_number: *page_number
        filter_unread: { type: integer, enum: [0, 1], description: "1: only conversations with unread messages." }
        filter_resolved: { type: integer, enum: [0, 1], description: "1: only resolved conversations." }
        filter_not_resolved: { type: integer, enum: [0, 1], description: "1: only conversations not resolved." }
    examples:
      - title: Conversations of one contact
        input: { people_id: "c4b4ab32-4c4d-4b6f-9d8a-1f2e3d4c5b6a", page_number: 1 }
    refusals:
      - *person_not_found
    call:
      method: GET
      path: "/people/conversations/{people_id}/list/{page_number}"
      query: { filter_unread: filter_unread, filter_resolved: filter_resolved, filter_not_resolved: filter_not_resolved }
    output: { items: data }
    cost: { per: request }

  - name: get_helpdesk
    class: read
    description: >-
      Get the knowledge base (helpdesk) of the Crisp workspace: {error,
      reason, data: {name, url}}.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - title: The knowledge base
        input: {}
    refusals:
      - &helpdesk_not_found { code: helpdesk_not_found, when: 404, message: "This Crisp workspace has no knowledge base, or not this entry." }
    call: { method: GET, path: /helpdesk }
    cost: { per: request }

  - name: list_helpdesk_locales
    class: read
    description: >-
      List the locales of the Crisp knowledge base, by page: [{locale_id,
      locale (ISO 639-1), url, statistics: {articles, guides, references,
      news: {entries, groups}}}]. The locale code is the locale argument of
      the other helpdesk functions.
    input:
      type: object
      additionalProperties: false
      required: [page_number]
      properties:
        page_number: *page_number
    examples:
      - title: Locales of the knowledge base
        input: { page_number: 1 }
    refusals:
      - *helpdesk_not_found
    call: { method: GET, path: "/helpdesk/locales/{page_number}" }
    output: { items: data }
    cost: { per: request }

  - name: list_helpdesk_pages
    class: read
    description: >-
      List the published pages of the Crisp knowledge base for one locale and
      content type, by page: [{entity_id, title, tree_path, url}]. tree_path
      reads the page with get_helpdesk_content.
    input:
      type: object
      additionalProperties: false
      required: [locale, content_type, page_number]
      properties:
        locale: &locale { type: string, minLength: 1, not: { enum: [".", ".."] }, description: "Locale code, such as en or fr." }
        content_type: &content_type { type: string, enum: [articles, guides, references, news] }
        page_number: *page_number
    examples:
      - title: Published articles in French
        input: { locale: fr, content_type: articles, page_number: 1 }
    refusals:
      - *helpdesk_not_found
    call: { method: GET, path: "/helpdesk/page/list/{locale}/{content_type}/{page_number}" }
    output: { items: data }
    cost: { per: request }

  - name: list_helpdesk_tree
    class: read
    description: >-
      List the entries of the Crisp knowledge base tree for one locale and
      content type, drafts and hidden entries included, by page: [{type (file
      or directory), slug, title, state, children}]. sub_path lists from a
      directory; search_title searches the titles; search_filter_status keeps
      one status; filter_date_start and filter_date_end bound the update date
      of an entry.
    input:
      type: object
      additionalProperties: false
      required: [locale, content_type, page_number]
      properties:
        locale: *locale
        content_type: *content_type
        page_number: *page_number
        sub_path: { type: string, minLength: 1, description: "Directory of the tree to list from (default /)." }
        search_title: { type: string, minLength: 1, description: "Text searched in the titles." }
        search_filter_status: { type: string, enum: [visible, hidden, draft, featured] }
        filter_date_start: { type: string, format: date-time, description: "From this entry update date (ISO 8601)." }
        filter_date_end: { type: string, format: date-time, description: "Up to this entry update date (ISO 8601)." }
    examples:
      - title: English articles whose title mentions refund
        input: { locale: en, content_type: articles, page_number: 1, search_title: refund }
    refusals:
      - *helpdesk_not_found
    call:
      method: GET
      path: "/helpdesk/tree/list/{locale}/{content_type}/{page_number}"
      query: { sub_path: sub_path, search_title: search_title, search_filter_status: search_filter_status,
               filter_date_start: filter_date_start, filter_date_end: filter_date_end }
    output: { items: data }
    cost: { per: request }

  - name: get_helpdesk_entry
    class: read
    description: >-
      Get one entry of the Crisp knowledge base tree (a file or a directory)
      by its tree path: {error, reason, data: {type, slug, title, state,
      children}}.
    input: &tree_entry_input
      type: object
      additionalProperties: false
      required: [locale, content_type, tree_path]
      properties:
        locale: *locale
        content_type: *content_type
        tree_path: { type: string, minLength: 1, not: { enum: [".", ".."] }, description: "The tree path of the entry, as list_helpdesk_pages returns it." }
    examples:
      - &tree_entry_example
        title: One article entry
        input: { locale: en, content_type: articles, tree_path: "getting-started/install" }
    refusals:
      - *helpdesk_not_found
    call: { method: GET, path: "/helpdesk/tree/path/{locale}/{content_type}/{tree_path}" }
    cost: { per: request }

  - name: get_helpdesk_content
    class: read
    description: >-
      Get the body of one file of the Crisp knowledge base tree: {error,
      reason, data: {content}}.
    input: *tree_entry_input
    examples:
      - *tree_entry_example
    refusals:
      - *helpdesk_not_found
    call: { method: GET, path: "/helpdesk/tree/content/{locale}/{content_type}/{tree_path}" }
    cost: { per: request }

  - name: get_helpdesk_metadata
    class: read
    description: >-
      Get the metadata of one file or directory of the Crisp knowledge base
      tree: {error, reason, data: {format (articles, categories, sections),
      title, description, state: {published, hidden, featured}, author:
      {user_id}, color, image}}.
    input: *tree_entry_input
    examples:
      - *tree_entry_example
    refusals:
      - *helpdesk_not_found
    call: { method: GET, path: "/helpdesk/tree/metadata/{locale}/{content_type}/{tree_path}" }
    cost: { per: request }

  # --- Writing: conversations -------------------------------------------------

  - name: add_conversation_note
    class: write
    description: >-
      Post an internal note in one Crisp conversation: a message of type note,
      from the team, that the team sees in the conversation and the contact
      never receives. It stays in the conversation's history (nothing here
      deletes it). Answers {error, reason, data: {fingerprint}}. The
      conversation is a real one: write only what the task needs.
    input:
      type: object
      additionalProperties: false
      required: [session_id, content]
      properties:
        session_id: *session_id
        content: &message_content { type: string, minLength: 1, personal: true, description: "The text." }
    examples:
      - title: A note for the team
        input: { session_id: "session_700c65e1-85e2-465a-b9ac-ecb5ec2c9881", content: "Called back, waiting for the documents." }
    refusals:
      - *conversation_not_found
    call:
      method: POST
      path: "/conversation/{session_id}/message"
      body: { content: content }
      constants: { body: { type: note, from: operator, origin: chat } }
    cost: { per: request }

  - name: change_conversation_state
    class: write
    description: >-
      Change the state of one Crisp conversation: pending, unresolved or
      resolved (the team sees it; the reference does not say that the contact
      is told). Answers {error, reason, data: {}}.
    input:
      type: object
      additionalProperties: false
      required: [session_id, state]
      properties:
        session_id: *session_id
        state: { type: string, enum: [pending, unresolved, resolved] }
    examples:
      - title: Resolve a conversation
        input: { session_id: "session_700c65e1-85e2-465a-b9ac-ecb5ec2c9881", state: resolved }
    refusals:
      - *conversation_not_found
    call:
      method: PATCH
      path: "/conversation/{session_id}/state"
      body: { state: state }
    cost: { per: request }

  - name: update_conversation_meta
    class: write
    description: >-
      Change the contact details one Crisp conversation carries (its meta):
      nickname, email, phone, address. Only the fields given are sent. The
      contact profile is a separate record: see update_person. Answers {error,
      reason, data: {}}.
    input:
      type: object
      additionalProperties: false
      required: [session_id]
      minProperties: 2
      properties:
        session_id: *session_id
        nickname: &nickname { type: string, minLength: 1, personal: true, description: "First and last name." }
        email: &email { type: string, minLength: 3, personal: true }
        phone: &phone { type: string, minLength: 1, personal: true, description: "Phone number, international format (+33...)." }
        address: &address { type: string, minLength: 1, personal: true }
    examples:
      - title: The email of a conversation's contact
        input: { session_id: "session_700c65e1-85e2-465a-b9ac-ecb5ec2c9881", email: "jane.doe@example.test" }
    refusals:
      - *conversation_not_found
    call:
      method: PATCH
      path: "/conversation/{session_id}/meta"
      body: { nickname: nickname, email: email, phone: phone, address: address }
    cost: { per: request }

  - name: set_conversation_segments
    class: sensitive
    effect: destroy
    description: >-
      Set the segments (tags) of one Crisp conversation to the list given: it
      is sent whole, and a segment that is not in it may be lost. To add or
      remove one segment, read the current list (get_conversation_meta,
      data.segments) and send it changed. Answers {error, reason, data: {}}.
    input:
      type: object
      additionalProperties: false
      required: [session_id, segments]
      properties:
        session_id: *session_id
        segments: &segments { type: array, uniqueItems: true, maxItems: 100, items: { type: string, minLength: 1, maxLength: 100 }, description: "The whole list of segments." }
    examples:
      - title: Two segments on a conversation
        input: { session_id: "session_700c65e1-85e2-465a-b9ac-ecb5ec2c9881", segments: [callback, documents] }
    refusals:
      - *conversation_not_found
    call:
      method: PATCH
      path: "/conversation/{session_id}/meta"
      body: { segments: segments }
    confirm:
      summary: "Set the segments of Crisp conversation {session_id} to the list given: a segment not in the list may be removed."
    cost: { per: request }

  - name: send_message
    class: sensitive
    effect: send
    description: >-
      Send a text message to the contact of one Crisp conversation, from the
      team (type text, from operator, origin chat). It reaches a real person and
      cannot be taken back. The reference does not say how the message reaches
      the conversation's channel, nor what happens when a channel's messaging
      window (such as WhatsApp's 24 hours) is closed. Answers 202 {error,
      reason, data: {fingerprint}}.
    input:
      type: object
      additionalProperties: false
      required: [session_id, content]
      properties:
        session_id: *session_id
        content: *message_content
    examples:
      - title: A reply to the contact
        input: { session_id: "session_700c65e1-85e2-465a-b9ac-ecb5ec2c9881", content: "Your appointment is confirmed for Tuesday at 10am." }
    refusals:
      - *conversation_not_found
      - { code: message_refused, when: 406, message: "Crisp refused the message under a messaging rule (spam or blocked): nothing was sent." }
      - { code: too_many_messages, when: 409, message: "Crisp refused the message: too many messages in this conversation; nothing was sent." }
    call:
      method: POST
      path: "/conversation/{session_id}/message"
      body: { content: content }
      constants: { body: { type: text, from: operator, origin: chat } }
    confirm:
      summary: "Send this text to the contact of Crisp conversation {session_id}: it reaches a real person and cannot be taken back."
    cost: { per: request }

  # --- Writing: contacts --------------------------------------------------------

  - name: update_person
    class: write
    description: >-
      Change one contact (people profile) of the Crisp workspace: its email,
      and its nickname, phone and address. Only the fields given are sent; Crisp
      keeps the others. 409 when the email is another contact's. Answers
      {error, reason, data: {}}.
    input:
      type: object
      additionalProperties: false
      required: [people_id]
      minProperties: 2
      properties:
        people_id: *people_id
        email: *email
        nickname: *nickname
        phone: *phone
        address: *address
    examples:
      - title: The phone of a contact
        input: { people_id: "c4b4ab32-4c4d-4b6f-9d8a-1f2e3d4c5b6a", phone: "+33612345678" }
    refusals:
      - *person_not_found
      - { code: email_taken, when: 409, message: "Another contact of this Crisp workspace already has this email." }
    call:
      method: PATCH
      path: "/people/profile/{people_id}"
      body: { email: email, person: { nickname: nickname, phone: phone, address: address } }
    cost: { per: request }

  - name: update_person_data
    class: write
    description: >-
      Change the custom data of one contact of the Crisp workspace: the keys
      given are merged with the data already set (a key given replaces its
      value, the other keys stay). Values are texts, numbers or booleans.
      Answers {error, reason, data: {}}.
    input:
      type: object
      additionalProperties: false
      required: [people_id, data]
      properties:
        people_id: *people_id
        data: { type: object, minProperties: 1, additionalProperties: { type: [string, number, boolean], personal: true }, description: "Keys and values to set." }
    examples:
      - title: One custom data key of a contact
        input: { people_id: "c4b4ab32-4c4d-4b6f-9d8a-1f2e3d4c5b6a", data: { followup: "to call back" } }
    refusals:
      - *person_not_found
    call:
      method: PATCH
      path: "/people/data/{people_id}"
      body: { data: data }
    cost: { per: request }

  - name: set_person_segments
    class: sensitive
    effect: destroy
    description: >-
      Set the segments (tags) of one contact of the Crisp workspace to the list
      given: it is sent whole, and a segment that is not in it may be lost. To
      add or remove one segment, read the current list (get_person,
      data.segments) and send it changed. Answers {error, reason, data: {}}.
    input:
      type: object
      additionalProperties: false
      required: [people_id, segments]
      properties:
        people_id: *people_id
        segments: *segments
    examples:
      - title: Two segments on a contact
        input: { people_id: "c4b4ab32-4c4d-4b6f-9d8a-1f2e3d4c5b6a", segments: [patient, followup] }
    refusals:
      - *person_not_found
    call:
      method: PATCH
      path: "/people/profile/{people_id}"
      body: { segments: segments }
    confirm:
      summary: "Set the segments of Crisp contact {people_id} to the list given: a segment not in the list may be removed."
    cost: { per: request }
