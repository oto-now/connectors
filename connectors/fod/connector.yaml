# yaml-language-server: $schema=../connector.schema.json
# France Open Data (FOD), Otomata's service over French public data:
#   https://data.oto.zone/openapi.json
# Every /api/* route needs Authorization: Bearer <key>, one key per consumer,
# or the OAuth access token of a person (two accesses, below).
# FOD holds no third-party credential for the routes described here.
#
# Read only. urban_start_regulation_ingestion starts a background job that fills
# FOD's own cache of local-plan regulations and changes nothing elsewhere; it is
# a read. Ten families,
# prefixed in the function names: company_ (company registers, BODACC, INPI
# accounts, gender equality index, company agreements, the SIRENE stock of
# establishments and legal units), procurement_ (public
# tender notices and awarded contracts), funding_ (public funding schemes for
# companies), property_ (address, cadastre, buildings and their owners, DPE,
# DVF, building permits, solar yield, travel-time areas, electricity
# consumption, declared emissions, OpenStreetMap points of interest), urban_
# (zoning, written regulation of a local plan and the plans FOD holds, natural
# and technological risks, classified facilities, public services, priority
# districts, the Île-de-France land agency, commune and IRIS statistics, mayors
# and intercommunal presidents), law_ (consolidated codes, case law and
# collective agreements of a branch), tax_ (BOFiP tax doctrine: the administration's reading, kept apart from
# the law), compliance_ (checks before an act: asset-freeze screening, mutual
# termination before filing; POSTs that read, the name kept out of the URL),
# health_ (medicines, clinical trials, biomedical literature, declared links of
# interest, health and social-care establishments and their quality
# evaluations), ecosystem_ (the start-up ecosystem of French Tech
# Aix-Marseille: directory, members, events, calls, funding, appointments).
#
# Several lookups answer 200 with null, or with {"error": ...}, when nothing
# matches; expect turns them into named refusals. A 500 comes back when a
# required combination of filters is missing: the input schemas require it.
#
# Values checked on 2026-10-16 against the OpenAPI published by the service and
# by real calls. A 503 from the asset-freeze register (not loaded, truncated or
# too old) becomes the refusal register_inconclusive, which forbids concluding
# that a name is absent from the register.
#
# The mutual-termination check was read on 2026-11-05 against the service
# source at 3aa4d5d. Its 422s (months twice, dates out of order, a bonus above
# the gross pay of its month) are the common invalid_arguments.
#
# The health_ functions were read on 2026-11-21 against the service source at
# 67ed5e3 (app/sante.py), its published OpenAPI, and the france-opendata client
# 0.54.0 for the shape of each answer. Medicines come from the public medicines
# database (BDPM: ANSM, HAS, Assurance maladie), loaded in FOD's memory; the
# other health routes pass the criteria through to ClinicalTrials.gov, the EU
# CTIS portal, PubMed, Europe PMC and the Transparence Santé portal, and FOD
# keeps nothing of them. Each answer carries source (producer, licence or
# credit line). Transparence Santé data name persons and are under CC BY-NC-SA
# 4.0, restricted to the purpose of transparency of links of interest: both
# functions say it, with the credit line the source requires (validated by the
# maintainer). A 502 whose detail says the upstream answer is unreadable (a
# query PubMed did not process, a CTIS answer out of shape) is a named refusal,
# not a retryable outage. Offset and page-number paging (PubMed, CTIS,
# Transparence Santé) is not declared as pagination: the argument says how.
#
# On 2026-11-22, the company routes FOD served and this file did not describe
# were read against the service source at a7cb702 (app/fr.py,
# app/entreprise_index.py, app/aides.py, app/main.py) and the france-opendata
# client 0.54.0 for the shape of each answer: BODACC by batch, the gender
# equality index (Egapro), company agreements (ACCO, and their text read from
# Légifrance), public tender notices (BOAMP), awarded contracts (DECP) and
# public funding schemes. Tenders and funding take their own families: they
# are searched by subject and place, not by company. The two INSEE routes
# (/api/fr/insee/siret, /api/fr/insee/headquarters) are left out: FOD holds no
# INSEE key, the caller passes its own in the X-Sirene-Key header, and the
# format has no per-function credential; company_get covers the head office
# without a key. Left out of the arguments: chunk_size of the BODACC batch
# (tuning of the upstream requests), raw of a funding scheme (the raw record,
# for debugging). Bounds this file adds, the service having none: 1,000 SIRENs
# per BODACC batch, 100 funding schemes per page, 60,000 characters per slice
# of an agreement text. The text of an agreement says its next slice
# (next_offset) but is not declared as pagination: slices are text, not items.
#
# On 2026-11-22 too, the property routes FOD served and this file did not
# describe were read against the service source at a7cb702 (app/foncier.py,
# app/osm.py, app/main.py) and the france-opendata client 0.54.0 for the
# shape of each answer: buildings of a parcel (BDTOPO), solar yield (PVGIS),
# travel-time areas (IGN), electricity consumption on the distribution grid
# (Enedis, by row and by site) and on the transmission grid (ODRÉ, and its
# years), sales of a commune (DVF), energy labels of a commune and of
# non-residential buildings (DPE), greenhouse gas reports (BEGES), buildings
# and their legal-entity owners (BDNB), pollutant emitters (IREP) and
# OpenStreetMap points of interest. All stay in property_: they describe a
# site, and FOD files the OpenStreetMap route with them. The ERP sectors of
# the non-residential DPE are an enum: the source matches the whole label, a
# loose word returns nothing (32 labels read from ADEME on 2026-11-22); the
# IREP media likewise (Air, Eau (direct), Eau (indirect), Sol, read from the
# 2024 registry). The service answers 500 to a missing area, perimeter or
# travel budget; the input schemas require them: exactly one of minutes and
# metres, exactly one OpenStreetMap area, a perimeter for Enedis sites and
# BDNB. Bounds this file adds, the service having none: a perimeter for
# Enedis rows and for the non-residential DPE (a national read is the whole
# dataset), 5,000 OpenStreetMap objects. A 500 on OpenStreetMap is Overpass,
# the public query service, refusing or not answering: a named refusal.
# raw, the BDNB row a record is built from, is stripped: every column it
# holds is in the record. The raw rows of Enedis, ODRÉ, the non-residential
# DPE and BEGES stay: they carry what the record leaves out (IRIS, gas,
# position, the emission posts one by one).
#
# On 2026-11-23, the town-planning and collective-agreement routes FOD served
# and this file did not describe were read against the service source at
# a7cb702 (app/urba.py, app/main.py, app/ccn.py) and the france-opendata
# client 0.54.0 for the shape of each answer: priority districts of urban
# policy (QPV, by commune and near a point), the Île-de-France land agency
# (EPFIF), commune statistics from INSEE Mélodi (one block per call, the five
# blocks an enum), the census by IRIS, mayors and EPCI presidents (national
# register of elected officials), the list of regulations FOD holds and the
# whole text of one, and collective agreements (KALI). Collective agreements
# go to law_: like the codes they come from DILA, and they are the law of a
# sector; company agreements (ACCO) stay in company_. The two regulation
# routes, written for services, serve an agent too: the list says which plans
# read at once (it is shared by every consumer, and small); the whole text,
# plain text and not JSON, comes back as a text file, never in the answer.
# The service answers 500 to a mayor lookup without a commune or a
# department: the input schema requires one. Bounds this file adds, the
# service having none: a QPV radius of 1 to 10,000 metres, 1,000 elected
# officials. Named refusals: EPFIF source unreadable (secteur_epfif null), an
# unknown IRIS (null), a commune code with no IRIS (an unknown code, or the
# whole-city code of Paris, Lyon or Marseille, read by arrondissement), a
# regulation not held (404), an unknown collective-agreement article. zones of
# the regulation list, always empty, is stripped. QPV lists stop at 20
# districts, nb_qpv counting them all; a commune's IRIS at 200.
#
# On 2026-11-23 too, the last routes FOD served and this file did not describe
# were read against the service source at a7cb702 (app/sante.py,
# app/frenchtech.py, app/sirene.py, app/main.py, app/duckdb_guard.py) and the
# france-opendata client 0.54.0 (finess, has_essms, frenchtech, sirene_stock)
# for the shape of each answer; all twenty are in the OpenAPI that
# data.oto.zone published that day. The FINESS directory and the HAS quality
# evaluations of social and medico-social establishments (ESSMS) join
# health_. The French Tech routes take a family of their own, ecosystem_: they
# read one capital's site (Aix-Marseille, fixed by FOD) and its booking page
# for French Tech Central, a start-up ecosystem, neither a register nor
# public funding of the State base; the directory and the member pages name
# persons with their contacts, said in each function. The SIRENE stock (the
# INSEE monthly files of establishments and legal units, held by FOD as
# parquet) joins company_: it answers on the same SIREN and SIRET as the
# registers, as of a monthly vintage that company_get_stock_info gives. FOD
# mounts its router only on an instance that holds the parquet
# (SIRENE_STOCK_PARQUET_PATH): data.oto.zone does; elsewhere the nine routes
# answer 404. The legal-unit stock is a second parquet: without it, the
# legal-unit route answers 501, a named refusal that says nothing of the
# companies. Every read of the stock waits at most 30 s for a slot (503 when
# saturated, retryable) and is stopped after 90 s (504): a named refusal,
# not retryable unchanged, that asks to narrow the scan; the scanning
# functions take 150 s. A search needs a filter (naf, commune, postal code,
# department, usual name or sign): without one the service scans the whole
# stock to the stop. Its department is the start of the postal code (20 for
# Corsica, 971 overseas), as the service filters it, unlike the FINESS
# department (2A, 9A). Stock search pages by offset and says only count, the
# number returned: not declared as pagination. Bounds this file adds, the
# service having none: 1,000 SIRENs per batch (head offices, their
# addresses, legal units; the service bounds SIRETs at 1,000 and answers 400
# beyond), 100 FINESS results, 500 ESSMS evaluations. The service answers
# 500 to an unknown French Tech sector or directory type, and when the
# French Tech Central page lists no appointment: named refusals. Lookups
# that answer null (a FINESS code, a directory slug, a head office, a SIRET)
# are named refusals. path of the stock information, a location on FOD's
# machine, is stripped. The FINESS file was read on 2026-11-23 from
# data.gouv.fr (about 103,000 establishments; department codes 2A, 2B, 9A to
# 9F, 9J; category labels without acronyms, EHPAD being "Etablissement
# d'hébergement pour personnes âgées dépendantes"); the French Tech
# directory types and the French Tech Central appointments were read live
# the same day.
#
# On 2026-11-24, two accesses (docs/conception/compte.md, "Plusieurs accès"),
# the functions, the address and the error table shared, no access levels:
# - key: the organization's FOD API key, as before, a Bearer header.
# - oauth: a person signs in to France Open Data (oauth2_user, authorization
#   code with PKCE S256). The issuer is https://auth.data.oto.zone/oidc; its
#   discovery document, read the same day, gives the authorize and token
#   endpoints, S256 and client_secret_post. A real trial on 2026-11-24 showed
#   that without resource at the token request the issuer returns an opaque
#   token, which FOD refuses; with resource at renewal it returns a JWT whose
#   aud is https://data.oto.zone/api and whose scope is read, and the refresh
#   token rotates. The exchange of the code through a platform is still to be
#   checked. The access therefore sets auth.resource.
#   FOD's only scope is read; openid and
#   offline_access bring the subject and a refresh token, which the issuer
#   rotates. Without a valid token or key, FOD answers 401 with a
#   WWW-Authenticate header pointing to /.well-known/oauth-protected-resource.
# account_get (GET /api/moi), outside the ten families, says the account FOD
# recognises: for a token {type: oauth, sub, email} (email only when the
# token carries it), for a key {type: cle, consommateur: "cle:<fingerprint>"};
# sub is the identity of a signed-in account. Read against the service
# source at 4d9f735 (app/compte.py). The real trial above settles the audience
# and the scope; the exchange of the code through a platform remains to be
# checked.
connector:
  name: fod
  label: France Open Data
  namespace: fod
  version: 2.0.1
  api_version: "france-opendata-service 4d9f735 (routes unversioned)"
  base_url: https://data.oto.zone
  accesses:
    - name: key
      label: FOD API key of the organization
      auth:
        kind: bearer
        token: api_key
      credential:
        - { name: api_key, label: FOD API key, secret: true }
      modes: [platform, byo_org]
    - name: oauth
      label: Sign-in of a person to France Open Data
      auth:
        kind: oauth2_user
        authorize_url: https://auth.data.oto.zone/oidc/auth
        token_url: https://auth.data.oto.zone/oidc/token
        client_auth: body
        scopes: [openid, offline_access, read]
        resource: https://data.oto.zone/api
        authorize_params: { prompt: consent }
        pkce: S256
        refresh: refresh_token
        rotates: true
        identity: { function: account_get, path: sub }
      modes: [byo_user]
  timeout_s: 60
  query_arrays: repeat
  probe: { function: law_list_codes, non_empty: [codes] }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "FOD or its upstream source rejected an argument as invalid; the message names the accepted values when there is a closed list." }
    - { status: 401, code: access_rejected, retryable: false, marks_account: credential_rejected,
        message: "FOD refused the key or the sign-in token: unknown, revoked, expired or missing. Retrying unchanged fails the same way." }
    - { status: 404, code: not_found, retryable: false,
        message: "Not found in FOD: check the identifier." }
    - { status: 422, code: invalid_arguments, retryable: false,
        message: "FOD rejected the arguments: a value has the wrong type or is out of bounds." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "The upstream public source behind FOD reached its quota: retry in a moment." }
    - { status: 500, code: service_error, retryable: false,
        message: "FOD failed on this request, most often an argument combination it does not handle; retrying unchanged usually fails the same way." }
    - { status: [502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "FOD or the public source behind it is temporarily unavailable or busy: retry later." }

functions:
  # --- The account ----------------------------------------------------------
  - name: account_get
    class: read
    description: >-
      Get the account FOD recognises for this call. For a person signed in:
      {type: "oauth", sub, email}, email only when the sign-in token carries
      it. For an organization key: {type: "cle", consommateur:
      "cle:<fingerprint>"}, the fingerprint naming the key, never the key.
      Nothing of the data is read. In French: compte france open data, identité
      du compte fod.
    input: { type: object, additionalProperties: false, properties: {} }
    examples:
      - { title: Who the call acts as, input: {} }
    call: { method: GET, path: /api/moi }
    cost: { per: request }

  # --- Companies: identity, officers, legal notices, accounts --------------
  - name: company_search
    class: read
    description: >-
      Search French companies (all legal units, from the national company
      register open data) by cumulative criteria: name, activity, place, size,
      legal form, collective agreement. Use it to identify a contract party
      when its SIREN is unknown, or to find the companies of a person's group.
      The name goes in query; a legal form spoken with the name ("SCI Les
      Tilleuls") does not belong there: put the name alone in query and the
      form in nature_juridique (6540 = SCI, 5710 = SAS, 5499 = SARL). Returns
      {results: [{siren, nom_complet, siege, dirigeants, finances, ...}],
      total_results, page, per_page, total_pages}. At least one criterion is
      required. In French: chercher une entreprise française, trouver des
      sociétés par activité, entreprises d'une commune.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [query] }
        - { required: [naf] }
        - { required: [departement] }
        - { required: [code_postal] }
        - { required: [commune] }
        - { required: [employees] }
        - { required: [categorie_entreprise] }
        - { required: [ca_min] }
        - { required: [ca_max] }
        - { required: [idcc] }
        - { required: [nature_juridique] }
      properties:
        query: { type: string, minLength: 1, personal: true, description: "Name, brand or acronym; also accepts a SIREN or SIRET." }
        naf:
          type: array
          minItems: 1
          items: { type: string, pattern: "^[0-9]{2}\\.[0-9]{2}[A-Z]$" }
          description: "Main activity codes (NAF rev. 2, such as 69.10Z for legal activities, 68.20B for letting of non-residential property)."
        departement: &departement { type: string, pattern: "^([0-9]{2}|2A|2B|97[1-6])$", description: "Department code, such as 33, 2A or 974." }
        code_postal: { type: string, pattern: "^[0-9]{5}$", description: "Postal code of an establishment." }
        commune: { type: string, pattern: "^([0-9]{2}|2A|2B)[0-9]{3}$", description: "INSEE code of the commune of an establishment (not its name, not its postal code)." }
        employees:
          type: array
          minItems: 1
          items: &tranche_effectif { type: string, enum: ["NN", "00", "01", "02", "03", "11", "12", "21", "22", "31", "32", "41", "42", "51", "52", "53"] }
          description: "INSEE headcount bands of the establishment (00 = none, 01 = 1-2, 02 = 3-5, 03 = 6-9, 11 = 10-19, 12 = 20-49 ... 53 = 10,000 and more; NN = not filled)."
        categorie_entreprise: { type: string, enum: [PME, ETI, GE], description: "INSEE size category." }
        ca_min: { type: integer, minimum: 1, description: "Minimum turnover, in euros." }
        ca_max: { type: integer, minimum: 1, description: "Maximum turnover, in euros." }
        idcc:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, pattern: "^[0-9]{1,4}$" }
          description: "One collective agreement code (IDCC), such as 1486 for engineering and consulting firms (Syntec). One code per call."
        nature_juridique:
          type: array
          minItems: 1
          items: { type: string, pattern: "^[0-9]{4}$" }
          description: "INSEE legal-form codes, level III (6540 = SCI, 5710 = SAS, 5499 = SARL, 5485 = SELARL)."
        page: { type: integer, minimum: 1, default: 1 }
        per_page: { type: integer, minimum: 1, maximum: 25, default: 25 }
    examples:
      - title: An SCI by its name in Gironde
        input: { query: Les Tilleuls, nature_juridique: ["6540"], departement: "33" }
      - title: SELARLs in legal activities in Bordeaux
        input: { naf: ["69.10Z"], commune: "33063", nature_juridique: ["5485"], per_page: 10 }
    call:
      method: POST
      path: /api/fr/entreprises/search
      body: { query: query, naf: naf, departement: departement, code_postal: code_postal,
              commune: commune, employees: employees, categorie_entreprise: categorie_entreprise,
              ca_min: ca_min, ca_max: ca_max, idcc: idcc, nature_juridique: nature_juridique,
              page: page, per_page: per_page }
    cost: { per: request }

  - name: company_get
    class: read
    description: >-
      Get the full record of one French company by its SIREN: identity, legal
      form, registered office, activity, headcount band, VAT number, closure
      status (etat_administratif, date_fermeture), latest summary accounts,
      officers, collective agreements and some thirty labels. Use it to check
      that a contract party exists, is active, and is what the contract says
      it is. In French: fiche d'une entreprise par siren, infos légales d'une
      société, entreprise active ou fermée.
    input:
      type: object
      additionalProperties: false
      required: [siren]
      properties:
        siren: &siren { type: string, pattern: "^[0-9]{9}$", description: "SIREN, 9 digits without spaces." }
    examples:
      - title: Record of Danone
        input: { siren: "552032534" }
    refusals:
      - &company_not_found { code: company_not_found, when: "the response is null", message: "No French company with this SIREN in the register." }
    expect:
      - { kind: non_empty, refusal: company_not_found, path: siren }
    call: { method: GET, path: "/api/fr/entreprises/{siren}" }
    cost: { per: request }

  - name: company_list_directors
    class: read
    description: >-
      List the officers of a French company as declared in the national
      register (RNE): [{nom, prenoms, date_de_naissance, qualite,
      type_dirigeant}]. An officer is a natural person or a legal person
      (type_dirigeant "personne morale", with its own siren): a subsidiary is
      often chaired by a company. Use it to check who has power to sign for a
      company that is a contract party. Empty list when none is declared or the SIREN is
      unknown. In French: dirigeants d'une entreprise, gérant d'une société, mandataires
      sociaux.
    input:
      type: object
      additionalProperties: false
      required: [siren]
      properties:
        siren: *siren
    examples:
      - title: Officers of Danone
        input: { siren: "552032534" }
    call: { method: GET, path: "/api/fr/entreprises/{siren}/directors" }
    cost: { per: request }

  - name: company_list_bodacc_notices
    class: read
    description: >-
      List the BODACC legal notices of a French company, newest first:
      insolvency proceedings, changes, filing of accounts, sales and transfers
      of a business, registrations and deregistrations. Returns {results:
      [{dateparution, familleavis, familleavis_lib, tribunal, texte, ...}],
      total_count}. Use it before contracting with a company: an insolvency
      proceeding (famille collective) is the strongest signal read here, and
      the publication date is not the date of the judgment. In French: annonces
      bodacc d'une entreprise, procédure collective, redressement judiciaire.
    input:
      type: object
      additionalProperties: false
      required: [siren]
      properties:
        siren: *siren
        famille: &bodacc_famille
          type: string
          enum: [collective, conciliation, creation, divers, dpc, immatriculation, modification, radiation, retablissement_professionnel, vente]
          description: "Only one family, by its code: collective (insolvency proceedings), dpc (filing of accounts), vente (sale or transfer of a business)... Not the label the output shows."
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
    examples:
      - title: Insolvency proceedings of a company
        input: { siren: "552032534", famille: collective }
      - title: Latest notices of any kind
        input: { siren: "552032534", limit: 10 }
    call:
      method: GET
      path: "/api/fr/bodacc/{siren}"
      query: { famille: famille, limit: limit }
    cost: { per: request }

  - name: company_list_fiscal_years
    class: read
    description: >-
      List the fiscal years of a French company for which annual accounts were
      filed with INPI, newest first: [{date_cloture_exercice, type_bilan,
      confidentiality, chiffre_d_affaires, ...}]. A confidential filing has no
      figures. Gives the exact closing date a balance sheet is read by. The
      first call after a restart of the service is slow. In French: exercices
      comptables déposés, comptes annuels disponibles.
    input:
      type: object
      additionalProperties: false
      required: [siren]
      properties:
        siren: *siren
    examples:
      - title: Filed fiscal years of Danone
        input: { siren: "552032534" }
    call: { method: GET, path: "/api/fr/inpi/{siren}/exercises" }
    cost: { per: request }

  - name: company_get_balance_sheet
    class: read
    description: >-
      Get the balance sheet of one fiscal year of a French company, as filed
      with INPI: the raw items of the tax return (CERFA 2050-2053 or 2033,
      under liasse, keyed by item code), with turnover and net result derived
      from them. Use it to assess the financial standing of a contract party,
      such as a customer, a supplier or a guarantor. date_cloture must be exactly one of the
      closing dates of this company's filed fiscal years. In French: bilan d'une entreprise,
      chiffre d'affaires d'une société, comptes annuels.
    input:
      type: object
      additionalProperties: false
      required: [siren, date_cloture]
      properties:
        siren: *siren
        date_cloture: &date { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "YYYY-MM-DD." }
    examples:
      - title: Danone's 2024 balance sheet
        input: { siren: "552032534", date_cloture: "2024-12-31" }
    refusals:
      - { code: balance_sheet_not_found, when: "the response is null",
          message: "No balance sheet filed for this SIREN at this closing date: the date must match a filed fiscal year exactly." }
    expect:
      - { kind: non_empty, refusal: balance_sheet_not_found, path: siren }
    call:
      method: GET
      path: "/api/fr/inpi/{siren}/bilan"
      query: { date_cloture: date_cloture }
    cost: { per: request }

  - name: company_screen_bodacc_notices
    class: read
    description: >-
      Screen the BODACC legal notices of many French companies at once (up to
      1,000 SIRENs, grouped into a few upstream requests), newest first.
      Returns {annonces: [{siren, partie, date_parution, date_jugement,
      famille, famille_code, type_avis, jugement_famille, jugement_nature,
      texte, texte_source, tribunal, commercant, bodacc_id}], synthese:
      {sirens_avec_annonce, sirens_sans_annonce, annonces_total,
      lignes_total, par_famille, ..., periode}}. One row per notice and per
      requested SIREN it names (a sale names both parties); partie is that
      SIREN's role, indeterminee when the notice does not say. The counts are
      not a verdict: whether a company is in insolvency proceedings is read in
      texte, SIREN by SIREN. Without famille, every family comes back. In
      French: surveiller les annonces bodacc, procédures collectives d'un
      portefeuille.
    input:
      type: object
      additionalProperties: false
      required: [sirens]
      properties:
        sirens:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, pattern: "^[0-9]{9}$" }
          description: "SIRENs, 9 digits each."
        famille: *bodacc_famille
        date_from: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Earliest publication date, inclusive, YYYY-MM-DD (not the judgment date)." }
        date_to: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Latest publication date, inclusive, YYYY-MM-DD." }
    examples:
      - title: Insolvency proceedings among three suppliers since 2025
        input: { sirens: ["552032534", "441639465", "855200887"], famille: collective, date_from: "2025-01-01" }
    call:
      method: POST
      path: /api/fr/bodacc/batch
      body: { sirens: sirens, famille: famille, date_from: date_from, date_to: date_to }
    timeout_s: 120
    cost: { per: request }

  - name: company_get_equality_index
    class: read
    description: >-
      Get the gender equality index (Egapro) a French company declared for one
      year: {annee, entreprise: {siren, raison_sociale, code_naf, effectif:
      {total, tranche}, ...}, indicateurs, declaration}. entreprise.effectif.total
      is the exact headcount declared, where the company register only gives a
      band. Only companies of 50 employees or more must declare: no declaration
      is not a bad score. When the latest year is unknown, use the latest
      declaration instead. In French: index égalité femmes hommes, index egapro
      d'une année.
    input:
      type: object
      additionalProperties: false
      required: [siren, year]
      properties:
        siren: *siren
        year: { type: integer, minimum: 2018, description: "Year of the indicators declared." }
    examples:
      - title: Danone's 2024 index
        input: { siren: "552032534", year: 2024 }
    refusals:
      - &equality_index_not_found { code: equality_index_not_found, when: "the response is null",
          message: "No Egapro declaration for this SIREN: the company may have fewer than 50 employees or not have declared." }
    expect:
      - { kind: non_empty, refusal: equality_index_not_found, path: entreprise }
    call:
      method: GET
      path: "/api/fr/egapro/{siren}/declaration"
      query: { year: year }
    cost: { per: request }

  - name: company_get_latest_equality_index
    class: read
    description: >-
      Get the most recent gender equality index (Egapro) of a French company,
      looking back up to five years from the current one: same shape as one
      year's declaration, annee saying which. Use it to qualify a company's
      exact headcount (entreprise.effectif.total) and to confirm it employs 50
      people or more. In French: dernier index égalité, dernier index egapro.
    input:
      type: object
      additionalProperties: false
      required: [siren]
      properties:
        siren: *siren
    examples:
      - title: Latest index of Danone
        input: { siren: "552032534" }
    refusals:
      - *equality_index_not_found
    expect:
      - { kind: non_empty, refusal: equality_index_not_found, path: entreprise }
    call: { method: GET, path: "/api/fr/egapro/{siren}/latest" }
    cost: { per: request }

  # --- Company agreements (ACCO): who negotiated what, and when ------------
  - name: company_search_agreements
    class: read
    description: >-
      Search the French company agreements filed since 2017-09-01 (ACCO,
      metadata only), by cumulative filters. Returns {results: [{id, nature,
      numero, siret, raison_sociale, code_idcc, date_texte, date_depot,
      conforme_version_integrale, theme_codes, themes_libelle,
      syndicats_libelle, titre, permalien, ...}], total_count,
      effectifs_filter}. Theme codes prove presence, never absence: the
      indexing is declarative and misses clauses (a health clause often sits
      in an agreement coded otherwise), so confirm by reading the text. To
      check one company, search by siren without themes: an agreement is
      filed under the establishment that deposits it. When
      effectifs_filter.truncated is true, the answer is not exhaustive: raise
      scan_cap. In French: accords d'entreprise, chercher un accord collectif
      d'entreprise.
    input:
      type: object
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, maxLength: 200, description: "Text in the agreement title only, not in its body." }
        themes:
          type: array
          minItems: 1
          items: { type: string, pattern: "^[0-9]{3}$" }
          description: "Theme codes, any of them: 111 = health cover, 112 = provident scheme, 113 = supplementary pension. The full list comes with its own function."
        nature: { type: string, minLength: 1, maxLength: 40, description: "Kind of act, as filed: ACCORD (initial agreement), AVENANT (amendment, a renegotiation)..." }
        siren: *siren
        siret: &siret { type: string, pattern: "^[0-9]{14}$", description: "SIRET, 14 digits without spaces." }
        idcc: { type: string, pattern: "^[0-9]{1,4}$", description: "Collective agreement code of the branch, with or without leading zeros." }
        departement: { type: string, pattern: "^[0-9]{2,5}$", description: "Start of the postal code of the filing establishment: 33, or a full postal code." }
        date_from: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Earliest signature date, YYYY-MM-DD." }
        date_to: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Latest signature date, YYYY-MM-DD." }
        latest_per_siret: { type: boolean, default: false, description: "Keep only the latest act of each establishment, before the dates filter: with date_to, finds establishments whose last act is old." }
        sort_by: { type: string, enum: [date, date_depot, date_diffusion, date_maj], default: date, description: "date = signature date." }
        sort_dir: { type: string, enum: [asc, desc], default: desc }
        tranche_effectifs:
          type: array
          minItems: 1
          items: *tranche_effectif
          description: "INSEE headcount bands of the company's head office (11 = 10-19, 12 = 20-49, 21 = 50-99...), read from the company register: agreements carry no size."
        exclude_categories:
          type: array
          minItems: 1
          items: { type: string, enum: [PME, ETI, GE] }
          description: "Drop companies of these INSEE categories, computed over the whole group: [GE] drops subsidiaries of large groups, even small ones. Companies without a category are kept."
        categories_entreprise:
          type: array
          minItems: 1
          items: { type: string, enum: [PME, ETI, GE] }
          description: "Keep only these INSEE categories; companies without a category are dropped (about 4%): to target independent SMEs, prefer exclude_categories [GE]."
        scan_cap: { type: integer, minimum: 1, maximum: 25000, default: 5000, description: "Agreements examined by the size and category filters before paging." }
        limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
        offset: { type: integer, minimum: 0, default: 0, description: "Results skipped: page n is offset (n-1) x limit; total_count gives the volume." }
    examples:
      - title: Recent health or provident amendments of independent companies
        input: { themes: ["111", "112"], nature: AVENANT, exclude_categories: [GE], limit: 20 }
      - title: Every agreement of one company, newest first
        input: { siren: "552032534" }
    refusals:
      - { code: category_filter_unavailable, when: 501,
          message: "The category filter is not available on this FOD instance: search without categories_entreprise and exclude_categories." }
    call:
      method: POST
      path: /api/fr/accords/search
      body: { query: query, themes: themes, nature: nature, siren: siren, siret: siret, idcc: idcc,
              departement: departement, date_from: date_from, date_to: date_to,
              latest_per_siret: latest_per_siret, sort_by: sort_by, sort_dir: sort_dir,
              tranche_effectifs: tranche_effectifs, exclude_categories: exclude_categories,
              categories_entreprise: categories_entreprise, scan_cap: scan_cap,
              limit: limit, offset: offset }
    output: { projection: [results, total_count, effectifs_filter] }
    cost: { per: request }

  - name: company_get_agreement
    class: read
    description: >-
      Get the metadata of one French company agreement by its DILA id
      (ACCOTEXT...) or its filing number (T...): who signed it (siret,
      raison_sociale, syndicats_libelle), when (date_texte, date_effet,
      date_fin), its branch, themes and title, and permalien. The body is not
      here: it is read with the agreement text, by the DILA id. In French:
      détail d'un accord d'entreprise, signataires d'un accord.
    input:
      type: object
      additionalProperties: false
      required: [id_or_numero]
      properties:
        id_or_numero: { type: string, pattern: "^(ACCOTEXT[0-9]{12}|T[0-9A-Z]{5,20})$", description: "DILA id (ACCOTEXT followed by 12 digits) or filing number (T followed by digits)." }
    examples:
      - title: One agreement by its DILA id
        input: { id_or_numero: ACCOTEXT000049966020 }
      - title: The same agreement by its filing number
        input: { id_or_numero: T09224066869 }
    refusals:
      - { code: agreement_not_found, when: "the response is null", message: "No company agreement with this id or filing number." }
    expect:
      - { kind: non_empty, refusal: agreement_not_found, path: id }
    call: { method: GET, path: "/api/fr/accords/{id_or_numero}" }
    cost: { per: request }

  - name: company_list_agreement_themes
    class: read
    description: >-
      List the theme codes of company agreements with their label and how many
      agreements carry each: [{code, libelle, count}]. Read it before filtering
      agreements by theme: the codes cannot be guessed. A count says how often
      the code was applied, not how many agreements cover the topic. In French:
      thèmes des accords d'entreprise, codes thèmes des accords.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: Theme codes
        input: {}
    call: { method: GET, path: /api/fr/accords/themes }
    cost: { per: request }

  - name: company_get_agreement_text
    class: read
    description: >-
      Get the full text of a French company agreement, read from Légifrance on
      demand, with its metadata: {id, titre, nature, siret, raison_sociale,
      date_texte, date_effet, syndicats, texte, texte_chars, offset, tronque,
      next_offset, permalien}. texte may be empty when no full version was
      published. A long text comes in slices: when tronque is true, call again
      with offset set to next_offset (health, provident and final provisions
      often sit at the end). In French: texte d'un accord d'entreprise, lire un
      accord d'entreprise.
    input:
      type: object
      additionalProperties: false
      required: [acco_id]
      properties:
        acco_id: { type: string, pattern: "^ACCOTEXT[0-9]{12}$", description: "DILA id of the agreement (ACCOTEXT followed by 12 digits), not its filing number." }
        offset: { type: integer, minimum: 0, default: 0, description: "Position in the text where the slice starts: next_offset of the previous slice." }
        max_chars: { type: integer, minimum: 1, maximum: 60000, default: 30000, description: "Characters in the slice." }
    examples:
      - title: Text of an agreement
        input: { acco_id: ACCOTEXT000049966020 }
      - title: The rest of a long agreement
        input: { acco_id: ACCOTEXT000049966020, offset: 30000 }
    refusals:
      - { code: agreement_text_not_found, when: "the response carries error not_found",
          message: "Légifrance has no agreement with this DILA id." }
    expect:
      - { kind: non_empty, refusal: agreement_text_not_found, path: permalien }
    call:
      method: GET
      path: "/api/accords/text/{acco_id}"
      query: { offset: offset, max_chars: max_chars }
    timeout_s: 90
    cost: { per: request }

  # --- Companies: the SIRENE stock (INSEE monthly files, every establishment) --
  - name: company_get_stock_info
    class: read
    description: >-
      Get the vintage of the SIRENE stock FOD reads: {millesime, built_at,
      age_days, rows, total_rows, source_url, size_bytes, mtime}. millesime
      is the date of the INSEE monthly file (YYYYMMDD); age_days counts the
      days since FOD built its copy; build_info "absent" means the vintage
      is unknown. The stock functions answer as of that file, not live: a
      company created or closed since is not in it, the live register
      (company_get) is. Quote the vintage with a figure drawn from the stock. In
      French: date du stock sirene, fraîcheur des données sirene.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: Vintage of the stock
        input: {}
    call: { method: GET, path: /api/sirene/info }
    # path is where the stock sits on FOD's machine: nothing for the agent.
    output: { strip: [path] }
    cost: { per: request }

  - name: company_search_establishments
    class: read
    description: >-
      Enumerate French establishments in the SIRENE stock (head offices and
      branches, active or closed) by cumulative filters, ordered by SIRET:
      {items: [{siren, siret, is_siege, etat, date_creation, denomination,
      enseigne_1, naf, tranche_effectifs, code_postal, libelle_commune,
      code_commune, ...}], count, limit, offset}. Use it for exhaustive lists a
      search engine caps: every bakery of a department, every site of a brand,
      head offices of 100 to 499 employees in a department. The company's name
      is not in this stock: denomination is the establishment's usual name,
      empty for most; read the names by listing the legal units of the SIRENs.
      To find a company by its name, use the company search. count equal to
      limit: more may follow, pass offset + limit. A department or a postal code
      narrows the scan to one part of the stock; without one the scan reads all
      of France and may be stopped. In French: liste d'établissements, sites
      d'une enseigne.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [naf] }
        - { required: [code_commune] }
        - { required: [code_postal] }
        - { required: [departement] }
        - { required: [denomination] }
        - { required: [enseigne] }
      properties:
        naf: { type: string, pattern: "^[0-9]{2}\\.?[0-9]{2}[A-Z]$", description: "Main activity code of the establishment (NAF rev. 2), with or without the dot: 47.11F or 4711F." }
        code_commune: { type: string, pattern: "^([0-9]{2}|2A|2B)[0-9]{3}$", description: "INSEE code of the establishment's commune; Paris, Lyon and Marseille by arrondissement (13201, not 13055)." }
        code_postal: { type: string, pattern: "^[0-9]{5}$", description: "Postal code of the establishment." }
        departement: { type: string, pattern: "^([0-9]{2}|97[1-6])$", description: "Start of the establishment's postal code: two digits in mainland France (20 for Corsica, not 2A or 2B), three overseas (971)." }
        denomination: { type: string, minLength: 2, maxLength: 120, description: "Part of the establishment's usual name, case ignored; rarely filled." }
        enseigne: { type: string, minLength: 2, maxLength: 120, description: "Part of one of the establishment's signs (enseigne), case ignored: carrefour express." }
        active_only: { type: boolean, default: true, description: "false also returns closed establishments." }
        sieges_only: { type: boolean, default: false, description: "true keeps head offices only." }
        tranche_effectifs:
          type: array
          minItems: 1
          items: *tranche_effectif
          description: "INSEE headcount bands of the establishment, any of them (00 = none, 01 = 1-2, 11 = 10-19, 21 = 50-99, 22 = 100-199, 31 = 200-249, 32 = 250-499 ... 53 = 10,000 and more)."
        limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        offset: { type: integer, minimum: 0, default: 0, description: "Establishments skipped: the next page is offset + limit." }
    examples:
      - title: Supermarkets of the Bouches-du-Rhône
        input: { naf: 47.11F, departement: "13", limit: 200 }
      - title: Head offices of 100 to 499 employees in Gironde
        input: { departement: "33", sieges_only: true, tranche_effectifs: ["22", "31", "32"] }
    refusals:
      - &stock_scan_timeout { code: stock_scan_too_long, when: 504,
          message: "The scan of the SIRENE stock was stopped after 90 s: narrow it (a department or a postal code, a shorter list) rather than retrying unchanged." }
    call:
      method: POST
      path: /api/sirene/search
      body: { naf: naf, code_commune: code_commune, code_postal: code_postal, departement: departement,
              denomination: denomination, enseigne: enseigne, active_only: active_only,
              sieges_only: sieges_only, tranche_effectifs: tranche_effectifs, limit: limit, offset: offset }
    timeout_s: 150
    cost: { per: request }

  - name: company_list_headquarters_addresses
    class: read
    description: >-
      Get the head office of many French companies at once from the SIRENE
      stock, in one scan, as an address: {siren: {siren, siret,
      is_headquarters, street, postal_code, city, code_commune, status, naf,
      denomination, lambert_x, lambert_y, tranche_effectifs,
      annee_effectifs, caractere_employeur}}. status is active or closed. A
      SIREN without a head office in the stock is absent from the answer.
      Use it to enrich a list of companies (address, activity, size of the
      head office) far faster than one lookup each; the company names come
      from the legal units. In French: adresses des sièges, adresse du siège de
      plusieurs sociétés.
    input:
      type: object
      additionalProperties: false
      required: [sirens]
      properties:
        sirens: &stock_sirens
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, pattern: "^[0-9]{9}$" }
          description: "SIRENs, 9 digits each, 1,000 at most per call."
    examples:
      - title: Head offices of three companies
        input: { sirens: ["552032534", "441639465", "855200887"] }
    refusals:
      - *stock_scan_timeout
    call:
      method: POST
      path: /api/sirene/enrich
      body: { sirens: sirens }
    timeout_s: 150
    cost: { per: request }

  - name: company_list_headquarters
    class: read
    description: >-
      Get the head office record of many French companies at once from the
      SIRENE stock, in one scan, with every column the stock holds: {siren:
      {siren, siret, nic, is_siege, etat, date_creation, date_debut,
      denomination, enseigne_1, naf, tranche_effectifs, annee_effectifs,
      caractere_employeur, numero_voie, type_voie, libelle_voie,
      code_postal, libelle_commune, code_commune, code_cedex, lambert_x,
      lambert_y, date_dernier_traitement, ...}}. etat A is active, F
      closed. A SIREN without a head office in the stock is absent. The
      head office addresses give the same companies in a shorter form. In
      French: sièges de plusieurs entreprises, fiches siège en masse.
    input:
      type: object
      additionalProperties: false
      required: [sirens]
      properties:
        sirens: *stock_sirens
    examples:
      - title: Head office records of two companies
        input: { sirens: ["552032534", "441639465"] }
    refusals:
      - *stock_scan_timeout
    call:
      method: POST
      path: /api/sirene/sieges
      body: { sirens: sirens }
    timeout_s: 150
    cost: { per: request }

  - name: company_list_legal_units
    class: read
    description: >-
      Get the legal unit of many French companies at once from the SIRENE
      stock of legal units, in one scan: {items: {siren: {siren,
      denomination, sigle, nom, nom_usage, etat, date_creation,
      categorie_entreprise, annee_categorie_entreprise, tranche_effectifs,
      categorie_juridique, naf, nic_siege, ess, societe_mission,
      caractere_employeur, statut_diffusion, ...}}, count}. denomination is
      the company name (null for a sole trader, whose name is nom).
      categorie_entreprise (PME, ETI, GE) is computed by INSEE over the
      whole group: a small subsidiary of a large group is GE, which no
      headcount band shows. An unknown SIREN is absent, never an empty
      entry; categorie_entreprise null is a category not given. A unit with
      statut_diffusion P is under partial diffusion: its data must not be
      redistributed whole nor used for prospecting. In French: unités légales en
      masse, plusieurs entreprises par siren.
    input:
      type: object
      additionalProperties: false
      required: [sirens]
      properties:
        sirens: *stock_sirens
    examples:
      - title: Size category of three companies
        input: { sirens: ["552032534", "441639465", "855200887"] }
    refusals:
      - *stock_scan_timeout
      - { code: legal_unit_stock_unavailable, when: 501,
          message: "FOD does not hold the stock of legal units on this instance: no category can be read here, which says nothing of the companies." }
    call:
      method: POST
      path: /api/sirene/unites-legales
      body: { sirens: sirens }
    timeout_s: 150
    cost: { per: request }

  - name: company_list_establishments_by_siret
    class: read
    description: >-
      Get many French establishments at once from the SIRENE stock by their
      SIRET, in one scan, with their headcount: {items: {siret: {siren,
      siret, is_headquarters, street, postal_code, city, code_commune,
      status, naf, denomination, tranche_effectifs, annee_effectifs,
      caractere_employeur, ...}}, erreurs: [{siret, code}], count}.
      tranche_effectifs is the establishment's INSEE headcount band for the
      year annee_effectifs, null when not filled; caractere_employeur O
      (employs staff) or N. Errors are per SIRET, never for the list:
      siret_invalide (not 14 digits), introuvable (not in the stock). A
      SIRET given twice is read once. In French: établissements par siret,
      plusieurs siret à la fois.
    input:
      type: object
      additionalProperties: false
      required: [sirets]
      properties:
        sirets:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, pattern: "^[0-9]{14}$" }
          description: "SIRETs, 14 digits each, 1,000 at most per call."
    examples:
      - title: Headcount of two sites
        input: { sirets: ["55203253400703", "55203253400646"] }
    refusals:
      - *stock_scan_timeout
    call:
      method: POST
      path: /api/sirene/sirets
      body: { sirets: sirets }
    timeout_s: 150
    cost: { per: request }

  - name: company_get_headquarters
    class: read
    description: >-
      Get the head office of one French company from the SIRENE stock, with
      every column the stock holds (same record as the head office records
      of many). The head office whose period is still open is kept. For
      many companies, read them in one call. In French: siège d'une entreprise,
      siège social d'une société.
    input:
      type: object
      additionalProperties: false
      required: [siren]
      properties:
        siren: *siren
    examples:
      - title: Head office of Danone
        input: { siren: "552032534" }
    refusals:
      - *stock_scan_timeout
      - { code: headquarters_not_found, when: "the response is null",
          message: "No head office for this SIREN in the SIRENE stock: an unknown SIREN, or a company created after the stock's vintage." }
    expect:
      - { kind: non_empty, refusal: headquarters_not_found, path: siren }
    call: { method: GET, path: "/api/sirene/siege/{siren}" }
    cost: { per: request }

  - name: company_list_establishments
    class: read
    description: >-
      List every establishment of one French company from the SIRENE stock,
      head office first, then the latest: [{siret, is_siege, etat,
      denomination, enseigne_1, naf, tranche_effectifs, code_postal,
      libelle_commune, code_commune, ...}]. Use it to map the sites,
      branches or shops of a company. Empty list when the SIREN is unknown
      or, with active_only, has no open establishment. In French: établissements
      d'une entreprise, sites d'une société, liste des siret.
    input:
      type: object
      additionalProperties: false
      required: [siren]
      properties:
        siren: *siren
        active_only: { type: boolean, default: true, description: "false also returns closed establishments." }
    examples:
      - title: Open establishments of Danone
        input: { siren: "552032534" }
    refusals:
      - *stock_scan_timeout
    call:
      method: GET
      path: "/api/sirene/etablissements/{siren}"
      query: { active_only: active_only }
    timeout_s: 150
    cost: { per: request }

  - name: company_get_establishment
    class: read
    description: >-
      Get one French establishment from the SIRENE stock by its SIRET, with
      every column the stock holds: activity, headcount band and its year,
      employer status, address, state (etat A active, F closed). The name
      of the company is not in it: read its legal unit. In French: fiche d'un
      établissement, établissement par siret.
    input:
      type: object
      additionalProperties: false
      required: [siret]
      properties:
        siret: { type: string, pattern: "^[0-9]{14}$", description: "SIRET, 14 digits without spaces." }
    examples:
      - title: One establishment
        input: { siret: "55203253400703" }
    refusals:
      - *stock_scan_timeout
      - { code: establishment_not_found, when: "the response is null",
          message: "No establishment with this SIRET in the SIRENE stock: an unknown SIRET, or one created after the stock's vintage." }
    expect:
      - { kind: non_empty, refusal: establishment_not_found, path: siret }
    call: { method: GET, path: "/api/sirene/siret/{siret}" }
    cost: { per: request }

  # --- Property: address, parcel, energy, sales, permits --------------------
  - name: property_geocode_address
    class: read
    description: >-
      Geocode a French address with the national address base (BAN), best
      match first: [{label, score, lon, lat, type, citycode, city, postcode}].
      citycode is the INSEE code of the commune (an arrondissement code in
      Paris, Lyon and Marseille). Use it to normalise the address of a property
      and get the point and commune code that parcel, zoning and risk lookups
      take. A score under about 0.5 is a doubtful match. In French: géocoder une
      adresse, coordonnées d'une adresse.
    input:
      type: object
      additionalProperties: false
      required: [adresse]
      properties:
        adresse: &adresse { type: string, minLength: 3, personal: true, description: "Free-text address, ideally with postal code and town." }
        limit: { type: integer, minimum: 1, maximum: 50, default: 5 }
        postcode: { type: string, pattern: "^[0-9]{5}$", description: "Only results in this postal code." }
        citycode: { type: string, pattern: "^([0-9]{2}|2A|2B)[0-9]{3}$", description: "Only results in this INSEE commune." }
    examples:
      - title: Address of a flat in Bordeaux
        input: { adresse: "15 cours de l'Intendance, 33000 Bordeaux", limit: 1 }
    call:
      method: POST
      path: /api/foncier/ban/search
      body: { adresse: adresse, limit: limit, postcode: postcode, citycode: citycode }
    cost: { per: request }

  - name: property_reverse_geocode
    class: read
    description: >-
      Give the nearest BAN address of a point: {label, score, lon, lat,
      citycode, city, postcode}. In French: adresse d'un point gps, adresse la
      plus proche.
    input:
      type: object
      additionalProperties: false
      required: [lat, lon]
      properties:
        lat: &lat { type: number, minimum: -90, maximum: 90, personal: true, description: "Latitude, WGS 84." }
        lon: &lon { type: number, minimum: -180, maximum: 180, personal: true, description: "Longitude, WGS 84." }
    examples:
      - title: Address at a point in Lyon
        input: { lat: 45.758381, lon: 4.83276 }
    refusals:
      - { code: address_not_found, when: "the response is null", message: "No address near this point in the national address base." }
    expect:
      - { kind: non_empty, refusal: address_not_found, path: label }
    call:
      method: GET
      path: /api/foncier/ban/reverse
      query: { lat: lat, lon: lon }
    cost: { per: request }

  - name: property_get_cadastral_parcel
    class: read
    description: >-
      Get the cadastral parcel that contains a point: {idu, commune,
      code_insee, section, numero, contenance_m2, geometry}. Use it to check
      the cadastral references and area a document gives for a property. A
      geocoded house number often falls on the street, outside any parcel:
      the point must lie inside the plot. In French: parcelle cadastrale,
      référence cadastrale d'un terrain.
    input:
      type: object
      additionalProperties: false
      required: [lat, lon]
      properties:
        lat: *lat
        lon: *lon
    examples:
      - title: Parcel of 12 rue de la Paix, Paris
        input: { lat: 48.869141, lon: 2.331303 }
    refusals:
      - { code: parcel_not_found, when: "the response is null",
          message: "No cadastral parcel contains this point: it may lie on a public road; move it inside the plot." }
    expect:
      - { kind: non_empty, refusal: parcel_not_found, path: idu }
    call:
      method: GET
      path: /api/foncier/cadastre/parcelle
      query: { lat: lat, lon: lon }
    cost: { per: request }

  - name: property_list_energy_ratings
    class: read
    description: >-
      List the energy performance diagnoses (DPE, ADEME) of dwellings around an
      address, nearest first: {adresse_geocodee, code_commune, count, dpe:
      [{etiquette_dpe, etiquette_ges, conso_ep_kwh_m2_an, surface_habitable,
      annee_construction, type_batiment, adresse, date_dpe, distance_m}]}. Use
      it to check the DPE a sale or a lease must carry. In a block of flats a
      building has many DPE: match by address, surface and date, never by
      proximity alone. In French: diagnostics dpe autour d'une adresse,
      étiquette énergie d'un logement.
    input:
      type: object
      additionalProperties: false
      required: [adresse]
      properties:
        adresse: *adresse
        radius_m: { type: integer, minimum: 1, default: 200, description: "Search radius around the geocoded address, in metres." }
        type_batiment: { type: string, enum: [maison, appartement, immeuble] }
        etiquette: { type: string, enum: [A, B, C, D, E, F, G], description: "Only this energy label." }
        surface_min: &surface_min { type: number, minimum: 0, description: "Minimum living area, m²." }
        surface_max: &surface_max { type: number, minimum: 0, description: "Maximum living area, m²." }
        limit: { type: integer, minimum: 1, maximum: 1000, default: 50 }
    examples:
      - title: DPE of a flat place Bellecour
        input: { adresse: "8 place Bellecour, 69002 Lyon", radius_m: 50, type_batiment: appartement }
    refusals:
      - &address_not_geocoded { code: address_not_geocoded, when: "the response carries error geocode_failed",
          message: "The address could not be geocoded: give a full address with postal code and town." }
    expect:
      - { kind: non_empty, refusal: address_not_geocoded, path: adresse_geocodee }
    call:
      method: POST
      path: /api/foncier/dpe/by_address
      body: { adresse: adresse, radius_m: radius_m, type_batiment: type_batiment, etiquette: etiquette,
              surface_min: surface_min, surface_max: surface_max, limit: limit }
    cost: { per: request }

  - name: property_list_comparable_sales
    class: read
    description: >-
      List the property sales recorded in DVF (land registry transfers, from
      2014) around an address, most recent first: {adresse_geocodee,
      code_commune, count, median_prix_m2, mutations: [{date_mutation,
      nature_mutation, valeur_fonciere, type_local, surface_reelle_bati,
      surface_terrain, prix_m2, vefa, id_parcelle, adresse, distance_m}]}. Use
      it to check a price against the local market or to value an estate
      property. Every kind of sale is listed (outbuildings, land, mixed
      premises) unless filtered. DVF does not cover Alsace-Moselle and Mayotte.
      In French: ventes immobilières autour d'une adresse, prix de vente dvf,
      ventes comparables.
    input:
      type: object
      additionalProperties: false
      required: [adresse]
      properties:
        adresse: *adresse
        radius_m: { type: integer, minimum: 1, default: 500, description: "Search radius around the geocoded address, in metres." }
        type_local: &type_local { type: string, enum: [Appartement, Maison], description: "Only single dwellings of this kind." }
        surface_min: *surface_min
        surface_max: *surface_max
        years: &years { type: integer, minimum: 1, default: 3, description: "Depth in years, counted back from the latest year with data." }
        limit: { type: integer, minimum: 1, default: 50 }
    examples:
      - title: Flat sales near a Bordeaux address over two years
        input: { adresse: "15 cours de l'Intendance, 33000 Bordeaux", radius_m: 300, type_local: Appartement, years: 2 }
    refusals:
      - *address_not_geocoded
    expect:
      - { kind: non_empty, refusal: address_not_geocoded, path: adresse_geocodee }
    call:
      method: POST
      path: /api/foncier/dvf/comparables_by_address
      body: { adresse: adresse, radius_m: radius_m, type_local: type_local, surface_min: surface_min,
              surface_max: surface_max, years: years, limit: limit }
    cost: { per: request }

  - name: property_get_price_stats
    class: read
    description: >-
      Get the price per m² statistics of a commune from DVF: {count,
      median_prix_m2, mean_prix_m2, min_prix_m2, max_prix_m2, by_year: {year:
      {count, median_prix_m2}}}. Only single flats and houses are counted, and
      outliers (under 100 or over 50,000 €/m²) are left out. Use it to place a
      price within its commune. In French: prix au mètre carré d'une commune,
      prix immobilier moyen.
    input:
      type: object
      additionalProperties: false
      required: [code_commune]
      properties:
        code_commune: &code_insee { type: string, pattern: "^([0-9]{2}|2A|2B)[0-9]{3}$", description: "INSEE commune code, 5 characters (not the postal code)." }
        type_local: *type_local
        years: *years
    examples:
      - title: House prices in Bordeaux over three years
        input: { code_commune: "33063", type_local: Maison, years: 3 }
    call:
      method: POST
      path: /api/foncier/dvf/stats
      body: { code_commune: code_commune, type_local: type_local, years: years }
    cost: { per: request }

  - name: property_search_building_permits
    class: read
    description: >-
      Search building and development permits (Sitadel, Ministry for Ecological
      Transition) by commune, department, year of filing or applicant company:
      {total, page, page_size, permis: [{type, num_dau, date_depot,
      date_autorisation, etat, demandeur, adresse, parcelles, logements,
      surf_hab_creee_m2, ...}]}. kind chooses the file: logements (permits
      creating dwellings), locaux (non-residential premises), amenager
      (development permits). Use it to check the permits on a property or a
      plot: the parcel is not a filter, so search the commune and read the
      parcelles of each permit. Applicants who are natural persons are not
      published. In French: permis de construire, permis d'aménager,
      autorisations d'urbanisme.
    input:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [logements, locaux, amenager], default: logements }
        communes: { type: string, pattern: "^([0-9]{2}|2A|2B)[0-9]{3}$", description: "INSEE commune code." }
        dept: *departement
        an_min: { type: integer, minimum: 2000, description: "First year of filing, included." }
        an_max: { type: integer, minimum: 2000, description: "Last year of filing, included." }
        siren: { type: string, pattern: "^[0-9]{9}$", description: "SIREN of the applicant; valid without any place." }
        siret: { type: string, pattern: "^[0-9]{14}$", description: "SIRET of the applicant." }
        page: { type: integer, minimum: 1, default: 1 }
        page_size: { enum: [10, 20, 50, 100], default: 50 }
    examples:
      - title: Housing permits filed in Bordeaux in 2024 and 2025
        input: { kind: logements, communes: "33063", an_min: 2024, an_max: 2025 }
      - title: Housing permits filed by Bouygues Immobilier
        input: { kind: logements, siren: "562091546", page_size: 20 }
    call:
      method: POST
      path: /api/foncier/sitadel/search
      body: { kind: kind, communes: communes, dept: dept, an_min: an_min, an_max: an_max,
              siren: siren, siret: siret, page: page, page_size: page_size }
    cost: { per: request }

  # --- Property: what a site carries (buildings, sun, reach) ----------------
  - name: property_get_parcel_buildings
    class: read
    description: >-
      Measure what is already built on a cadastral parcel (IGN BDTOPO):
      {nb_batiments, emprise_batie_m2, contenance_m2, ces_reel,
      hauteur_max_m, dont_constructions_legeres, par_usage: {usage: {nb,
      emprise_m2}}, batiments: [{cleabs, usage, nature, hauteur_m,
      emprise_m2, construction_legere}]}. Pass the parcel's geometry and
      contenance_m2 as the cadastral parcel at a point returns them. A
      building counts for the parcel when its centroid falls inside it.
      ces_reel (built footprint over parcel area) is null without
      contenance_m2; a low ratio in a dense zone flags under-used land. No
      building is an answer, not a failure. In French: bâti d'une parcelle,
      emprise au sol, surface construite.
    input:
      type: object
      additionalProperties: false
      required: [geometry]
      properties:
        geometry:
          type: object
          additionalProperties: false
          required: [type, coordinates]
          description: "GeoJSON geometry of the parcel, WGS 84, as the cadastral parcel returns it."
          properties:
            type: { type: string, enum: [Polygon, MultiPolygon] }
            coordinates: { type: array, minItems: 1, description: "GeoJSON coordinates, [longitude, latitude] pairs." }
        contenance_m2: { type: number, exclusiveMinimum: 0, description: "Cadastral area of the parcel, m²: gives ces_reel." }
    examples:
      - title: Buildings on a parcel in Bordeaux
        input:
          geometry:
            type: Polygon
            coordinates: [[[-0.57521, 44.84172], [-0.57468, 44.84175], [-0.57465, 44.84139], [-0.57519, 44.84136], [-0.57521, 44.84172]]]
          contenance_m2: 1710
    call:
      method: POST
      path: /api/foncier/bdtopo/bati
      body: { geometry: geometry, contenance_m2: contenance_m2 }
    cost: { per: request }

  - name: property_get_solar_yield
    class: read
    description: >-
      Estimate the annual yield of a rooftop photovoltaic system of kwc kWp at
      a point (PVGIS 5.3, European Commission JRC), at the optimal tilt and
      azimuth: {productible_kwh_an, irradiance_kwh_m2_an, pertes_pct,
      optimal_slope_deg, optimal_azimuth_deg, inputs}. Physical data only,
      with 14% system losses assumed: tariffs, self-consumption and savings
      are the caller's assumptions. In French: production solaire d'une toiture,
      rendement photovoltaïque, productible pvgis.
    input:
      type: object
      additionalProperties: false
      required: [lat, lon, kwc]
      properties:
        lat: *lat
        lon: *lon
        kwc: { type: number, minimum: 1, description: "Peak power installed, kWp." }
    examples:
      - title: Yield of 100 kWp on a warehouse roof near Bordeaux
        input: { lat: 44.8417, lon: -0.5753, kwc: 100 }
    refusals:
      - { code: solar_yield_unavailable, when: "the response is null",
          message: "PVGIS gave no yield for this point: it may lie outside its coverage, or PVGIS is unavailable; retry later before concluding." }
    expect:
      - { kind: non_empty, refusal: solar_yield_unavailable, path: productible_kwh_an }
    call:
      method: GET
      path: /api/foncier/pvgis/productible
      query: { lat: lat, lon: lon, kwc: kwc }
    cost: { per: request }

  - name: property_get_isochrone
    class: read
    description: >-
      Get the area reachable from a point, or from which the point is
      reached, within a travel time or a distance, on foot or by car (IGN
      Géoplateforme routing on BD TOPO): {geometry (GeoJSON polygon),
      centroid: {lat, lon}, bbox, profile, direction, minutes, metres}.
      Exactly one of minutes and metres. The primitive of a catchment area:
      to know what lies within ten minutes' walk of a site, test points
      against the polygon. By car, departure and arrival differ (one-way
      streets). In French: zone accessible en voiture, temps de trajet,
      isochrone à pied.
    input:
      type: object
      additionalProperties: false
      required: [lat, lon]
      oneOf:
        - { required: [minutes] }
        - { required: [metres] }
      properties:
        lat: *lat
        lon: *lon
        minutes: { type: number, exclusiveMinimum: 0, description: "Travel time, in minutes." }
        metres: { type: integer, minimum: 1, description: "Travel distance, in metres." }
        profile: { type: string, enum: [pedestrian, car], default: pedestrian }
        direction: { type: string, enum: [departure, arrival], default: departure, description: "departure: reachable from the point; arrival: from where the point is reached." }
    examples:
      - title: Ten minutes' walk around place Bellecour, Lyon
        input: { lat: 45.758381, lon: 4.83276, minutes: 10 }
      - title: Fifteen minutes' drive to a site near Bordeaux
        input: { lat: 44.8417, lon: -0.5753, minutes: 15, profile: car, direction: arrival }
    call:
      method: GET
      path: /api/foncier/ign/isochrone
      query: { lat: lat, lon: lon, minutes: minutes, metres: metres, profile: profile, direction: direction }
    cost: { per: request }

  # --- Property: electricity consumption, distribution and transmission ----
  - name: property_list_electricity_consumption
    class: read
    description: >-
      List the annual electricity consumption of business addresses on the
      distribution grid (Enedis open data), one row per address and NAF
      division as Enedis publishes it: {total, signals: [{ref_key, row_key,
      annee, code_commune, adresse, naf2, secteur, mwh, nombre_de_sites,
      raw}], tronque, lignes_ignorees, mwh_ignores}. An address with several
      divisions has several rows sharing ref_key: thresholding rows misses
      sites whose total alone passes the bar; for sites, sum by address or
      use the site grain. limit cuts in the dataset's order (commune code),
      not by consumption: when tronque is true, raise min_mwh or pass limit
      -1. Sites on the transmission grid, the largest consumers, are not
      here. Rows without an address are counted in lignes_ignorees. In French:
      consommation électrique des entreprises, consommation d'électricité par
      adresse.
    input:
      type: object
      additionalProperties: false
      required: [annee]
      anyOf:
        - { required: [dept] }
        - { required: [code_commune] }
        - { required: [code_epci] }
      properties:
        annee: &enedis_annee { type: string, pattern: "^[0-9]{4}$", description: "Year of consumption, such as 2024; Enedis publishes a year in the following one." }
        dept: *departement
        code_commune: &codes_insee
          type: array
          minItems: 1
          items: { type: string, pattern: "^([0-9]{2}|2A|2B)[0-9]{3}$" }
          description: "INSEE commune codes."
        code_epci: &code_epci { type: string, pattern: "^[0-9]{9}$", description: "SIREN of an intercommunal body (EPCI), such as a metropolis." }
        naf2: &naf2
          type: array
          minItems: 1
          items: { type: string, pattern: "^[0-9]{2}$" }
          description: "NAF divisions, two digits (86 = health, 24 = metallurgy): the only precise sector filter."
        secteur: &enedis_secteur { type: string, enum: [INDUSTRIE, TERTIAIRE, AGRICULTURE], description: "Coarse sector: a hospital and an office tower are both TERTIAIRE." }
        min_mwh: { type: number, minimum: 0, description: "Minimum annual consumption of a row, MWh." }
        max_mwh: { type: number, minimum: 0, description: "Maximum annual consumption of a row, MWh." }
        limit: { type: integer, minimum: -1, not: { const: 0 }, default: 200, description: "Rows read; -1 = all." }
    examples:
      - title: Health sector addresses above 1 GWh in Gironde, 2024
        input: { annee: "2024", dept: "33", naf2: ["86"], min_mwh: 1000, limit: -1 }
    call:
      method: POST
      path: /api/foncier/enedis/conso
      body: { annee: annee, dept: dept, code_commune: code_commune, code_epci: code_epci, naf2: naf2,
              secteur: secteur, min_mwh: min_mwh, max_mwh: max_mwh, limit: limit }
    timeout_s: 120
    cost: { per: request }

  - name: property_list_electricity_sites
    class: read
    description: >-
      List business sites on the distribution grid (Enedis open data) with
      their total annual electricity consumption, the NAF divisions of an
      address summed, largest first: {total, lignes_lues, signals:
      [{site_key, annee, code_commune, adresse, mwh, naf2_principal,
      naf2_detail, multi_naf2, secteurs, code_iris, nombre_de_sites}],
      lignes_ignorees, mwh_ignores}. min_mwh applies after the sum: the
      grain almost every question means. limit caps the rows read before
      the sum, in the dataset's order: with min_mwh, leave limit at -1 or
      read total as a floor. Sites on the transmission grid, the largest
      consumers, are read apart. In French: sites professionnels raccordés, gros
      consommateurs d'électricité.
    input:
      type: object
      additionalProperties: false
      required: [annee]
      anyOf:
        - { required: [dept] }
        - { required: [code_commune] }
        - { required: [code_epci] }
      properties:
        annee: *enedis_annee
        dept: *departement
        code_commune: *codes_insee
        code_epci: *code_epci
        naf2: *naf2
        secteur: *enedis_secteur
        min_mwh: { type: number, minimum: 0, description: "Minimum annual consumption of a site, MWh, after the sum." }
        limit: { type: integer, minimum: -1, not: { const: 0 }, default: -1, description: "Rows read before the sum; -1 = all." }
    examples:
      - title: Sites above 2 GWh in Bordeaux Métropole, 2024
        input: { annee: "2024", code_epci: "243300316", min_mwh: 2000 }
    call:
      method: POST
      path: /api/foncier/enedis/sites
      body: { annee: annee, dept: dept, code_commune: code_commune, code_epci: code_epci, naf2: naf2,
              secteur: secteur, min_mwh: min_mwh, limit: limit }
    timeout_s: 120
    cost: { per: request }

  - name: property_list_transmission_consumption
    class: read
    description: >-
      List the annual electricity consumption of sites on the transmission
      grid (ODRÉ, RTE), by IRIS, largest first: {total, annee, signals:
      [{ref_key, annee, code_iris, code_commune, nom_commune, mwh, pdl,
      maille, site_unique, geo_point, raw}]}. These sites, the largest
      consumers, are absent from the distribution data. maille site: one
      delivery point in the IRIS, the row is one site; iris_agrege: a sum.
      site_unique (true by default) keeps single-site IRIS only and hides
      the aggregates, where the largest consumers often are. The data lags
      a year behind Enedis: an empty answer comes with annees_disponibles,
      and is no proof of absence. No NAF code here. In French: consommation sur
      le réseau rte, gros sites industriels consommateurs.
    input:
      type: object
      additionalProperties: false
      required: [annee]
      properties:
        annee: { type: string, pattern: "^[0-9]{4}$", description: "Year of consumption, such as 2023; read the years available first." }
        dept: *departement
        code_commune: *codes_insee
        min_mwh: { type: number, minimum: 0, description: "Consumption above this, MWh." }
        site_unique: { type: boolean, default: true, description: "Keep only the IRIS with one delivery point; false adds the aggregated IRIS." }
        limit: { type: integer, minimum: -1, not: { const: 0 }, default: -1, description: "Rows read; -1 = all." }
    examples:
      - title: Transmission-grid consumption in Savoie, aggregates included, 2023
        input: { annee: "2023", dept: "73", site_unique: false }
    call:
      method: POST
      path: /api/foncier/odre/conso
      body: { annee: annee, dept: dept, code_commune: code_commune, min_mwh: min_mwh,
              site_unique: site_unique, limit: limit }
    timeout_s: 120
    cost: { per: request }

  - name: property_list_transmission_years
    class: read
    description: >-
      List the years the transmission grid consumption data (ODRÉ) carries,
      newest first: ["2023", ...]. It lags a year behind the distribution
      data: read it before crossing the two. In French: années disponibles rte,
      années de consommation odré.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: Years available
        input: {}
    call: { method: GET, path: /api/foncier/odre/annees }
    cost: { per: request }

  # --- Property: sales and energy ratings of a commune ----------------------
  - name: property_list_commune_sales
    class: read
    description: >-
      List the property sales recorded in DVF (land registry transfers, from
      2014) in a commune, most recent first, raw: {code_commune, type_local,
      years, count, mutations: [{id_mutation, date_mutation,
      nature_mutation, valeur_fonciere, type_bien, type_local,
      surface_reelle_bati, surface_terrain, nombre_locaux, prix_m2, vefa,
      id_parcelle, id_parcelles, adresse, latitude, longitude}]}. Every kind
      of property and transfer (off-plan sale, auction, exchange) unless
      filtered; type_local is set only for a single flat or house. For a
      clean price per m², read the commune's price statistics. DVF does not
      cover Alsace-Moselle and Mayotte. A dense commune (a Paris
      arrondissement) may time out on a first call while the source warms
      up: retry before concluding. In French: ventes immobilières d'une commune,
      transactions dvf d'une commune.
    input:
      type: object
      additionalProperties: false
      required: [code_commune]
      properties:
        code_commune: *code_insee
        type_local: *type_local
        surface_min: { type: number, minimum: 0, description: "Minimum built area, m²." }
        surface_max: { type: number, minimum: 0, description: "Maximum built area, m²." }
        years: { type: integer, minimum: 1, default: 2, description: "Depth in years, counted back from the latest year with data." }
        limit: { type: integer, minimum: 1, default: 50, description: "Most recent sales returned." }
    examples:
      - title: House sales in Pessac over three years
        input: { code_commune: "33318", type_local: Maison, years: 3 }
    call:
      method: POST
      path: /api/foncier/dvf/comparables
      body: { code_commune: code_commune, type_local: type_local, surface_min: surface_min,
              surface_max: surface_max, years: years, limit: limit }
    cost: { per: request }

  - name: property_get_energy_rating_stats
    class: read
    description: >-
      Get the distribution of the energy labels (DPE, A to G, ADEME) of a
      commune's dwellings: {code_commune, type_batiment, total,
      repartition_etiquettes: {A: count, ...}}. Counts diagnoses made since
      July 2021, not dwellings. In French: répartition des dpe d'une commune,
      étiquettes énergie d'une commune.
    input:
      type: object
      additionalProperties: false
      required: [code_commune]
      properties:
        code_commune: *code_insee
        type_batiment: { type: string, enum: [maison, appartement, immeuble] }
    examples:
      - title: Energy labels of flats in Lyon 2e
        input: { code_commune: "69382", type_batiment: appartement }
    call:
      method: POST
      path: /api/foncier/dpe/stats
      body: { code_commune: code_commune, type_batiment: type_batiment }
    cost: { per: request }

  - name: property_list_non_residential_energy_ratings
    class: read
    description: >-
      List the energy performance diagnoses of non-residential buildings
      (tertiary DPE, ADEME, since July 2021): offices, shops, care, schools,
      hotels, largest floor area first: {total, sans_position, diagnostics:
      [{numero_dpe, date_etablissement, date_fin_validite, secteur_activite,
      categorie_erp, etiquette_dpe, etiquette_ges, surface_shon,
      surface_utile, occupants, annee_construction, adresse, code_commune,
      lambert_x, lambert_y, geocode, id_rnb, raw}]}. Says what a building
      is, where consumption data says how much. lambert_x and lambert_y are
      Lambert 93, the projection of the company register's establishments;
      sans_position counts the diagnoses without a position. total counts
      what came back: equal to size, more exist. A missing label is not a G. In
      French: dpe tertiaire, diagnostic énergie des bureaux.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [code_commune] }
        - { required: [departement] }
      properties:
        code_commune: *codes_insee
        departement: *departement
        secteur:
          type: string
          description: "ERP activity sector, the exact label of the source (in French)."
          enum:
            - "M : Magasins de vente, centres commerciaux"
            - "autres tertiaires non ERP"
            - "W : Administrations, banques, bureaux"
            - "locaux d'entreprise (bureaux)"
            - "N : Restaurants et débits de boisson"
            - "J : Structures d’accueil pour personnes âgées ou personnes handicapées"
            - "U : Établissements de soins"
            - "R : Établissements d’éveil, d’enseignement, de formation, centres de vacances, centres de loisirs sans hébergement"
            - "O : Hôtels et pensions de famille"
            - "L : Salles d'auditions, de conférences, de réunions, de spectacles ou à usage multiple"
            - "GHW : Bureaux"
            - "X : Établissements sportifs couverts"
            - "T : Salles d'exposition à vocation commerciale"
            - "P : Salles de danse et salles de jeux"
            - "GHZ : Usage mixte"
            - "V : Établissements de divers cultes"
            - "S : Bibliothèques, centres de documentation"
            - "PA : Établissements de Plein Air"
            - "OA : Hôtels-restaurants d'Altitude"
            - "GA : Gares Accessibles au public (chemins de fer, téléphériques, remonte-pentes...)"
            - "Y : Musées"
            - "PS : Parcs de Stationnement couverts"
            - "GHR : Enseignement"
            - "GHU : Usage sanitaire"
            - "GHO : Hôtel"
            - "GHA : Habitation"
            - "REF : REFuges de montagne"
            - "CTS : Chapiteaux, Tentes et Structures toile"
            - "EF : Établissements flottants (eaux intérieures)"
            - "GHS : Dépôt d'archives"
            - "GHTC : tour de contrôle"
            - "SG : Structures Gonflables"
        etiquette:
          type: array
          minItems: 1
          items: { type: string, enum: [A, B, C, D, E, F, G] }
          description: "Energy labels, any of them."
        surface_min: { type: number, minimum: 0, description: "Minimum gross floor area (SHON), m²." }
        size: { type: integer, minimum: 1, maximum: 10000, default: 100, description: "Diagnoses returned; the source serves 10,000 at most." }
    examples:
      - title: Care facilities rated F or G in Gironde
        input: { departement: "33", secteur: "U : Établissements de soins", etiquette: [F, G] }
    call:
      method: POST
      path: /api/foncier/dpe/tertiaire
      body: { code_commune: code_commune, departement: departement, secteur: secteur, etiquette: etiquette,
              surface_min: surface_min, size: size }
    cost: { per: request }

  # --- Property: declared emissions, owners of buildings --------------------
  - name: property_list_ghg_reports
    class: read
    description: >-
      List the greenhouse gas reports (BEGES, ADEME) organisations published,
      keyed by SIREN, latest reporting year first: {total, bilans: [{siren,
      raison_sociale, naf, annee_reporting, date_publication, obligee,
      tranche_salaries, rapport_url, objectif_2030, contact,
      entites_consolidees, electricite, emissions: {par_categorie, total,
      postes_declares, postes_absents, unite}, raw}]}. A missing post is not
      a zero: totals sum what was declared. electricite is a MWh estimate
      inferred from post 2.1 with the French average factor (certitude
      infere), never metered. contact is the declared officer, null when
      masked at source. The reporting year is not the publication year.
      total counts what came back: equal to size, more exist. In French: bilan
      carbone d'une entreprise, bilan des émissions de gaz à effet de serre.
    input:
      type: object
      additionalProperties: false
      properties:
        siren: *siren
        naf: { type: string, pattern: "^[0-9]{2}(\\.?[0-9]{2}[A-Z])?$", description: "NAF code (86.10Z or 8610Z), or a two-digit division (86) for all its classes." }
        annee: { type: integer, minimum: 2000, description: "Reporting year, not the publication year." }
        departement: *departement
        obligee: { type: boolean, description: "true: only organisations under the legal obligation (over 500 staff, large local authorities, the State)." }
        size: { type: integer, minimum: 1, maximum: 10000, default: 100, description: "Reports returned; the source serves 10,000 at most." }
    examples:
      - title: Every report of one company
        input: { siren: "552032534" }
      - title: Hospital reports in the Nord
        input: { naf: "86", departement: "59", size: 50 }
    call:
      method: POST
      path: /api/foncier/beges
      body: { siren: siren, naf: naf, annee: annee, departement: departement, obligee: obligee, size: size }
    cost: { per: request }

  - name: property_list_building_owners
    class: read
    description: >-
      List buildings with the SIREN of their owner when it is a legal entity
      (BDNB, CSTB, from the land registry: an exact link, not an address
      match): {total, requetes, tronque, couverture_partielle, signaux:
      [{batiment_groupe_id, adresse, code_commune, proprietaire: {siren,
      denomination, nb_locaux}, autres_proprietaires, bati: {emprise_m2,
      hauteur_m, annee_construction, usage}, energie: {conso_pro_elec_kwh,
      conso_pro_gaz_kwh, millesime_conso, classe_dpe_tertiaire,
      classe_dpe}}]}. By siren, every building a company owns; by commune
      with emprise_min, a town's large buildings. Natural persons are
      anonymised at source: a missing building is not one without an owner.
      No offset: rows come by ascending owner SIREN, not by size; tronque
      true means more exist, narrow before concluding on a territory. In French:
      propriétaire d'un bâtiment, bâtiments d'une société.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [code_commune] }
        - { required: [siren] }
        - { required: [batiment_groupe_id] }
        - { required: [departement] }
      properties:
        code_commune: *code_insee
        siren: *siren
        batiment_groupe_id: { type: string, pattern: "^bdnb-bg-[0-9A-Z-]+$", description: "BDNB building group id, bdnb-bg-...." }
        departement: *departement
        emprise_min: { type: number, minimum: 0, description: "Minimum ground footprint, m²." }
        limit: { type: integer, minimum: 1, maximum: 500, default: 50, description: "Buildings returned; the source serves 10 per request, each 10 more is one more request." }
    examples:
      - title: Buildings of 5,000 m² and more in Bordeaux
        input: { code_commune: "33063", emprise_min: 5000 }
      - title: Every building one company owns
        input: { siren: "552032534", limit: 100 }
    call:
      method: POST
      path: /api/foncier/bdnb
      body: { code_commune: code_commune, siren: siren, batiment_groupe_id: batiment_groupe_id,
              departement: departement, emprise_min: emprise_min, limit: limit }
    output:
      strip: [signaux.raw]
      sample:
        total: 1
        signaux:
          - { batiment_groupe_id: bdnb-bg-0000-0000-0000, proprietaire: { siren: "000000000" }, raw: { batiment_groupe_id: bdnb-bg-0000-0000-0000 } }
    timeout_s: 120
    cost: { per: request }

  - name: property_list_pollutant_emitters
    class: read
    description: >-
      List the establishments that declared emissions of a pollutant to the
      IREP registry for a year, largest first, with SIRET and coordinates:
      {annee, total, tronque, sous_seuil, signaux: [{identifiant, nom,
      siret, adresse, code_commune, naf, latitude, longitude, polluant,
      milieu, quantite, unite, sous_seuil}]}. Where a GHG report covers a
      whole organisation, this names the site. Without polluant, fossil CO2
      to air. A quantity declared below the reporting threshold comes back
      as quantite null with sous_seuil true, after the known ones: neither
      zero nor absence. CO2 has three labels (fossil, biomass, total): do
      not read the total as fossil. In French: émetteurs de polluants, rejets
      polluants des usines.
    input:
      type: object
      additionalProperties: false
      properties:
        annee: { type: integer, minimum: 2003, default: 2024, description: "Year of the registry." }
        departement: *departement
        code_commune: *code_insee
        siret: *siret
        polluant: { type: string, maxLength: 200, description: "Exact label of the registry, in French: Dioxyde de carbone (CO2) d'origine non biomasse (the default), Oxydes d'azote (NOx/NO2)...; empty = every pollutant." }
        milieu: { type: string, enum: [Air, "Eau (direct)", "Eau (indirect)", Sol, ""], default: Air, description: "Medium of the emission; empty = every medium." }
        limit: { type: integer, minimum: 1, default: 50, description: "Establishments returned." }
    examples:
      - title: Largest fossil CO2 emitters in the Nord, 2024
        input: { departement: "59", limit: 20 }
      - title: Nitrogen oxides emitted in Dunkerque
        input: { code_commune: "59183", polluant: "Oxydes d'azote (NOx/NO2)" }
    refusals:
      - { code: pollutant_label_unknown, when: 400,
          message: "polluant or milieu is not an exact label of that year's IREP registry: labels are in French, accents and case kept, such as Dioxyde de carbone (CO2) d'origine non biomasse." }
      - { code: registry_year_unpublished, when: 404, message: "The IREP registry of this year is not published: try an earlier year." }
    call:
      method: POST
      path: /api/foncier/irep
      body: { annee: annee, departement: departement, code_commune: code_commune, siret: siret,
              polluant: polluant, milieu: milieu, limit: limit }
    cost: { per: request }

  # --- Property: OpenStreetMap points of interest ---------------------------
  - name: property_list_points_of_interest
    class: read
    description: >-
      List the OpenStreetMap objects carrying a tag over a commune, a
      department or a box, in one call (Overpass): {selector, count, pois:
      [{osm_type, osm_id, name, lat, lon, postcode, tags}]}. selector is an
      OSM tag, key=value (amenity=parking, shop=laundry) or a bare key
      (shop). count equal to limit: more exist. Infrastructure (parking,
      schools, transport, public facilities) is well mapped; shops and
      businesses less so: a count of shops is a floor. In French: points
      d'intérêt d'une commune, commerces d'une zone.
    input:
      type: object
      additionalProperties: false
      required: [selector]
      oneOf:
        - { required: [commune] }
        - { required: [departement] }
        - { required: [bbox] }
      properties:
        selector: { type: string, pattern: "^[A-Za-z0-9_:-]+(=[^\"\\\\]+)?$", description: "OSM tag, key=value or a bare key: amenity=parking, shop=laundry, amenity." }
        commune: *code_insee
        departement: *departement
        bbox: { type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?(,-?[0-9]+(\\.[0-9]+)?){3}$", description: "Box south,west,north,east, decimal degrees WGS 84: 44.83,-0.59,44.85,-0.56." }
        limit: { type: integer, minimum: 1, maximum: 5000, default: 500, description: "Objects returned." }
    examples:
      - title: Car parks in Marseille
        input: { selector: amenity=parking, commune: "13055" }
      - title: Laundries in a box of central Bordeaux
        input: { selector: shop=laundry, bbox: "44.83,-0.59,44.85,-0.56" }
    refusals:
      - { code: osm_unavailable, when: 500,
          message: "The public OpenStreetMap query service (Overpass) refused or did not answer, often when busy: retry in a few minutes, or narrow the area." }
    call:
      method: GET
      path: /api/osm/pois
      query: { selector: selector, commune: commune, departement: departement, bbox: bbox, limit: limit }
    timeout_s: 180
    cost: { per: request }

  # --- Town planning and risks ---------------------------------------------
  - name: urban_get_zoning
    class: read
    description: >-
      Get the town-planning zoning that applies at a point, from the national
      town-planning portal (GPU): {zone: {libelle, libelle_long, type_zone,
      idurba, reglement_url}, zones_superposees, prescriptions, informations,
      servitudes_utilite_publique, document, documents_couvrants,
      avertissements}. Use it for the planning information of a property: zone of
      the local plan (PLU, PLUi), easements of public interest, pre-emption
      perimeters. zone.idurba and zone.libelle lead to the written regulation
      of the zone. zone and document are null when the commune has no
      digitised plan (national planning rules apply, or the plan is not
      published). In French: zonage plu, zone du plu à une adresse, zone urbaine
      ou agricole.
    input:
      type: object
      additionalProperties: false
      required: [lon, lat]
      properties:
        lon: *lon
        lat: *lat
    examples:
      - title: Zoning place Bellecour, Lyon
        input: { lon: 4.83276, lat: 45.758381 }
    call:
      method: GET
      path: /api/urba/gpu/zonage
      query: { lon: lon, lat: lat }
    cost: { per: request }

  - name: urban_get_zoning_regulation
    class: read
    description: >-
      Read the written regulation (règlement écrit) of a local plan (PLU, PLUi,
      PSMV): height, footprint, setbacks, prohibited uses, parking. idurba and
      zone come from the zoning at the point (zone.idurba, zone.libelle). With
      zone alone, the zone's chapter in extraits[0], cut at max_chars (tronque);
      a sector without its own chapter gets its parent zone's. With query too,
      the passages of that chapter holding it, case and accents ignored, in
      French (hauteur, emprise au sol, recul). With query alone, passages of the
      whole document. Returns {idurba, cached, titre, section, nb_occurrences,
      extraits, note}; section is null when no chapter of the zone is found.
      Quote the raw extracts, never a figure they do not hold: rules drawn on a
      graphic document are not in the text. cached false comes with a statut:
      start the ingestion, then read its state until pret. scanne_probable true
      means a scanned PDF, unreadable without OCR. In French: règlement du plu,
      règles d'urbanisme d'une zone.
    input:
      type: object
      additionalProperties: false
      required: [idurba]
      anyOf:
        - { required: [zone] }
        - { required: [query] }
      properties:
        idurba: &idurba
          type: string
          pattern: "^[0-9A-Za-z]{5,9}_(PLU|PLUI|PLUi|POS|CC|PSMV)_[0-9]{8}(_[0-9A-Za-z]{1,5})?$"
          description: "Identifier of the planning document, as zone.idurba of the zoning: 80021_PLU_20251211."
        zone: { type: string, minLength: 1, maxLength: 30, description: "Zone code as zone.libelle of the zoning, case kept: UA, UCe1b, 1AUb." }
        query: { type: string, minLength: 2, maxLength: 100, description: "Words to find in the French text: hauteur, emprise au sol, recul." }
        max_extraits: { type: integer, minimum: 1, maximum: 50, default: 8, description: "Most passages returned." }
        context_lignes: { type: integer, minimum: 1, maximum: 200, default: 30, description: "Lines kept after each match in a passage." }
        max_chars: { type: integer, minimum: 1000, maximum: 200000, default: 40000, description: "Cut the zone's chapter at this length (zone without query)." }
    examples:
      - title: Chapter of sector UAa, Amiens local plan
        input: { idurba: 80021_PLU_20251211, zone: UAa }
      - title: Height rules of zone UCe1b, Lyon metropolitan plan
        input: { idurba: 200046977_PLUI_20260326, zone: UCe1b, query: hauteur, max_extraits: 5 }
    call:
      method: GET
      path: /api/reglement
      query: { idurba: idurba, zone: zone, query: query, max_extraits: max_extraits,
               context_lignes: context_lignes, max_chars: max_chars }
    cost: { per: request }

  - name: urban_start_regulation_ingestion
    class: read
    description: >-
      Ask FOD to fetch and index the written regulation of a local plan it does
      not hold yet, from the national town-planning portal (GPU). The work runs
      in the background, from 20 seconds to a few minutes; the answer comes at
      once with the state {idurba, statut, message, ...}: en_cours (started, or
      already running), pret or scanne (already held, nothing restarted), echec
      (a recent failure, erreur gives the cause; no new attempt before
      relance_possible_apres). Calling it again never starts a second
      ingestion. Then read the ingestion state every 20 to 30 seconds until
      pret, scanne or echec. FOD ingests one regulation at a time: a busy
      answer asks to retry in a minute. A document replaced on the portal is
      not swapped for its successor; the refusal names the documents published
      for the same territory. In French: charger le règlement d'un plu, indexer
      un règlement d'urbanisme.
    input:
      type: object
      additionalProperties: false
      required: [idurba]
      properties:
        idurba: *idurba
    examples:
      - title: Regulation of the Amiens local plan
        input: { idurba: 80021_PLU_20251211 }
    refusals:
      - { code: regulation_not_published, when: 404,
          message: "The national town-planning portal does not publish this document or its written regulation (a municipal map, carte communale, has none); autres_documents names the documents published for the same territory." }
    call:
      method: POST
      path: "/api/reglements/{idurba}/ingestion"
    cost: { per: request }
    # The state that comes back at once names the plan, idurba, which also reads the ingestion state.
    async: { collect: urban_get_regulation_ingestion, job_id: { from: idurba, to: idurba } }

  - name: urban_get_regulation_ingestion
    class: read
    description: >-
      Read the state of the ingestion of a local plan's written regulation in
      FOD: {idurba, statut, message, ...}. statut is absent (never asked),
      en_cours (with depuis), pret (readable; titre, doc_type, text_chars, and
      sources, the PDF addresses on the portal), scanne (a scanned PDF,
      unreadable without OCR: say so and give the source) or echec (erreur
      gives the cause, relance_possible_apres when a new attempt is allowed). In
      French: état du chargement d'un plu, avancement de l'indexation du
      règlement.
    input:
      type: object
      additionalProperties: false
      required: [idurba]
      properties:
        idurba: *idurba
    examples:
      - title: State of the Lyon metropolitan plan's regulation
        input: { idurba: 200046977_PLUI_20260326 }
    call:
      method: GET
      path: "/api/reglements/{idurba}/ingestion"
    cost: { per: request }

  - name: urban_list_commune_risks
    class: read
    description: >-
      List the natural and technological risks recorded for a commune
      (Géorisques, GASPAR): {code_insee, risques: [labels]}, such as flood,
      ground movement, clay shrink-swell, earthquake, radon, industrial risk.
      Use it to prepare the risk and pollution statement (ERP) annexed to a
      sale or lease. Takes the commune code: in Paris, Lyon and Marseille the
      whole city (75056, 69123, 13055), not an arrondissement, whose list comes
      back empty. In French: risques naturels d'une commune, risque inondation,
      risques technologiques.
    input:
      type: object
      additionalProperties: false
      required: [code_insee]
      properties:
        code_insee: *code_insee
    examples:
      - title: Risks recorded in Bordeaux
        input: { code_insee: "33063" }
    call: { method: GET, path: "/api/urba/georisques/risques/{code_insee}" }
    cost: { per: request }

  - name: urban_get_clay_exposure
    class: read
    description: >-
      Get the clay shrink-swell exposure at a point (Géorisques):
      {code_exposition, exposition}, from no exposure to strong. In a medium or
      strong zone, the sale of building land requires a soil study. In French:
      retrait gonflement des argiles, risque argile d'un terrain.
    input:
      type: object
      additionalProperties: false
      required: [lon, lat]
      properties:
        lon: *lon
        lat: *lat
    examples:
      - title: Clay exposure at a point in Bordeaux
        input: { lon: -0.5753, lat: 44.8417 }
    call:
      method: GET
      path: /api/urba/georisques/argiles
      query: { lon: lon, lat: lat }
    cost: { per: request }

  - name: urban_list_classified_facilities
    class: read
    description: >-
      List the classified facilities for environmental protection (ICPE,
      Géorisques) of a commune or of one establishment: {results, page,
      total_pages, data: [{raisonSociale, adresse1, codeInsee, commune,
      regime, statutSeveso, etatActivite, longitude, latitude, inspections,
      ...}]}, 20 per page. Use it to spot an industrial site on or near a
      property, or to check a company's environmental obligations. A SIRET or
      a commune code is required. In French: installations classées, sites icpe
      d'une commune.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [siret] }
        - { required: [code_insee] }
      properties:
        siret: { type: string, pattern: "^[0-9]{14}$", description: "SIRET of the establishment, exact match." }
        code_insee: *code_insee
        page: { type: integer, minimum: 1, default: 1 }
    examples:
      - title: Classified facilities in Bordeaux
        input: { code_insee: "33063" }
    call:
      method: GET
      path: /api/urba/georisques/icpe
      query: { siret: siret, code_insee: code_insee, page: page }
    cost: { per: request }

  - name: urban_list_public_services
    class: read
    description: >-
      List public services from the official directory of the administration
      (Service-Public): town halls, prefectures, tax offices, departmental
      directorates, public bodies, with phone, email, website, address and
      named head of service. Returns {total, rendus, tronque, signaux: [{nom,
      type_service, siren, siret, code_commune, telephone, courriel,
      site_internet, adresse, affectation_personne, ...}]}. Use it to find the
      town hall for a pre-emption notice (DIA) or a planning certificate, or
      the land registration office. A SIREN or a commune code is required. In
      French: mairie d'une commune, services publics proches, centre des impôts.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [siren] }
        - { required: [code_commune] }
      properties:
        siren: { type: string, pattern: "^[0-9]{9}$", description: "SIREN of the public body, such as a commune." }
        code_commune: *code_insee
        type_service: { type: string, pattern: "^[a-z0-9_]+$", description: "Directory service type, such as mairie, prefecture or dd_fip." }
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
    examples:
      - title: Town hall of Bordeaux
        input: { code_commune: "33063", type_service: mairie }
    call:
      method: GET
      path: /api/urba/annuaire
      query: { siren: siren, code_commune: code_commune, type_service: type_service, limit: limit }
    cost: { per: request }

  # --- Town planning: plans FOD holds ---------------------------------------
  - name: urban_list_cached_regulations
    class: read
    description: >-
      List the written regulations of local plans FOD already holds, readable
      at once without an ingestion: {count, reglements: [{idurba, titre,
      doc_type, partition, text_chars, taille, scanne, genere_le}]}. The
      cache is shared by every FOD consumer and filled on demand: a plan
      absent from it is not missing from the national town-planning portal;
      start its ingestion. scanne true means a scanned PDF, unreadable
      without OCR. No filter: the whole list comes back. In French: règlements
      plu disponibles, plu déjà chargés.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: Regulations FOD holds
        input: {}
    call: { method: GET, path: /api/reglements }
    output:
      strip: [reglements.zones]
      sample:
        count: 1
        reglements:
          - { idurba: 00000_PLU_20000101, text_chars: 1000, zones: [], scanne: false }
    cost: { per: request }

  - name: urban_get_regulation_text
    class: read
    description: >-
      Get the whole written regulation of a local plan FOD holds, as a text
      file of yours kept 24 hours: the answer gives its file id. It is the
      text extracted from the PDF, often several hundred thousand
      characters. Use it to read the regulation from end to end, or search
      it yourself, when the chapter of a zone or the passages of a query do
      not answer: a zone whose chapter is not found, general provisions,
      definitions, a table of contents. The plan must be held: read the
      ingestion state, or start the ingestion, first. A scanned PDF holds
      no text: no file comes back. In French: texte complet du règlement plu,
      télécharger le règlement d'urbanisme.
    input:
      type: object
      additionalProperties: false
      required: [idurba]
      properties:
        idurba: *idurba
    examples:
      - title: Whole regulation of the Amiens local plan
        input: { idurba: 80021_PLU_20251211 }
    refusals:
      - { code: regulation_not_held, when: 404,
          message: "FOD does not hold this regulation: start its ingestion, then read its state until pret." }
    call: { method: GET, path: "/api/reglements/{idurba}/raw" }
    # The body of the answer is the plain text; FOD cuts it only when max_chars is passed, which this file never does.
    output:
      file:
        from: body
        types: { txt: [text/plain] }
        name: { template: "regulation-{idurba}.txt" }
    cost: { per: request }

  # --- Town planning: priority districts, land agency -----------------------
  - name: urban_list_priority_districts
    class: read
    description: >-
      List the priority districts of urban policy (QPV, national dataset) of
      a commune: {code_insee, nb_qpv, qpv_dans_la_commune, qpv: [{code_qp,
      nom_qp, commune_qp, code_insee, nom_epci}]}. nb_qpv counts them all;
      qpv lists 20 at most. Being in a QPV, or within 300 m of one, is the
      geographic condition of several incentives, such as the reduced 5.5%
      VAT on a new home purchase; never the whole eligibility, price and
      buyer income caps also apply. For one address, list the districts
      near its point. In French: quartiers prioritaires d'une commune, quartiers
      qpv.
    input:
      type: object
      additionalProperties: false
      required: [code_insee]
      properties:
        code_insee: *code_insee
    examples:
      - title: Priority districts of Roubaix
        input: { code_insee: "59512" }
    call: { method: GET, path: "/api/urba/qpv/{code_insee}" }
    cost: { per: request }

  - name: urban_list_priority_districts_near_point
    class: read
    description: >-
      List the priority districts of urban policy (QPV) within radius_m
      metres of a point: {point: [lon, lat], radius_m, nb_qpv, eligible_geo,
      qpv: [{code_qp, nom_qp, commune_qp, code_insee, nom_epci}]}, 20 listed
      at most. eligible_geo is true when at least one district lies within
      the radius; 300 m, the default, is the perimeter of the reduced 5.5%
      VAT on a new home purchase. It is the geographic condition only: the
      price and buyer income caps are the caller's to check. Geocode the
      address first. In French: quartiers prioritaires autour d'un point, qpv à
      proximité.
    input:
      type: object
      additionalProperties: false
      required: [lon, lat]
      properties:
        lon: *lon
        lat: *lat
        radius_m: { type: integer, minimum: 1, maximum: 10000, default: 300, description: "Radius around the point, metres." }
    examples:
      - title: Districts within 300 m of a point in Roubaix
        input: { lon: 3.1746, lat: 50.6942 }
    call:
      method: GET
      path: /api/urba/qpv/near
      query: { lon: lon, lat: lat, radius_m: radius_m }
    cost: { per: request }

  - name: urban_get_land_agency_intervention
    class: read
    description: >-
      Get whether the public land agency of Île-de-France (EPFIF) intervenes
      in a commune: {secteur_epfif, nom, niveau_max, interventions: [{type,
      partenaire, date, kmlid}], source, stale, note}. type is veille (land
      watch), maitrise (land acquisition) or orcodin (ORCOD-IN, degraded
      condominiums); niveau_max is the strongest. An intervening commune
      means land under pressure, pre-emption often delegated to the agency:
      a public operator to reckon with, not neutral land. secteur_epfif
      false: no known intervention, or a commune outside Île-de-France. Read
      from the agency's map page, refreshed weekly; stale true means the
      last refresh failed and the previous copy is served. In French:
      intervention de l'epfif, établissement public foncier d'île-de-france.
    input:
      type: object
      additionalProperties: false
      required: [code_insee]
      properties:
        code_insee: *code_insee
    examples:
      - title: EPFIF interventions in Clichy-sous-Bois
        input: { code_insee: "93014" }
    refusals:
      - { code: land_agency_source_unavailable, when: "the response carries secteur_epfif null",
          message: "The EPFIF map page could not be read and FOD holds no copy of it: retry later before concluding." }
    expect:
      - { kind: non_empty, refusal: land_agency_source_unavailable, path: secteur_epfif }
    call: { method: GET, path: "/api/urba/epfif/{code_insee}" }
    cost: { per: request }

  # --- Town planning: population, households, income, housing --------------
  - name: urban_get_commune_statistics
    class: read
    description: >-
      Get one block of a commune's statistics from INSEE (Mélodi: census and
      Filosofi). population: {year: municipal population} for each census
      vintage INSEE publishes, about three over eleven years (the trend).
      familles: {total_familles, effectifs, parts_pct,
      part_monoparentales_pct} by family type. personnes_seules: a number,
      the one-person households, null without data. revenus: {millesime,
      revenu_median_uc_eur, taux_pauvrete_pct}. logement: {millesime,
      residences_principales, logements_vacants, logements_secondaires,
      taux_vacance_pct, statut_occupation: {effectifs, parts_pct,
      part_social_pct}}. A missing figure is null, never zero. Paris, Lyon
      and Marseille answer for the whole city or an arrondissement (75112,
      13201). Inside a commune, the IRIS census gives the districts. In French:
      population d'une commune, statistiques insee d'une commune, revenus des
      habitants.
    input:
      type: object
      additionalProperties: false
      required: [code_insee, block]
      properties:
        code_insee: *code_insee
        block: { type: string, enum: [population, familles, personnes_seules, revenus, logement], description: "The block to read; one call per block." }
    examples:
      - title: Population of Bordeaux over the census vintages
        input: { code_insee: "33063", block: population }
      - title: Housing of Marseille 1er
        input: { code_insee: "13201", block: logement }
    call: { method: GET, path: "/api/urba/insee/{code_insee}/{block}" }
    cost: { per: request }

  - name: urban_get_iris_census
    class: read
    description: >-
      Get the census figures of one IRIS, INSEE's district mesh of about
      2,000 inhabitants (census 2021, a copy held by FOD): {iris, com,
      typ_iris, lab_iris, pop, pop_0_19, pop_20_64, pop_65p, logements,
      res_principales, res_secondaires, logements_vacants, maisons,
      appartements, rp_en_appartement}. typ_iris: H housing, A business, D
      other, Z a commune not split into IRIS. lab_iris is INSEE's label,
      often a number, not a district name. One census year: no trend here;
      the commune statistics give it. In French: recensement d'un quartier iris,
      population d'un iris.
    input:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: "^([0-9]{2}|2A|2B)[0-9]{7}$", description: "IRIS code, 9 characters: the commune code and 4 digits." }
    examples:
      - title: One IRIS of Marseille 1er
        input: { code: "132010101" }
    refusals:
      - { code: iris_not_found, when: "the response is null",
          message: "No IRIS with this code: list the IRIS of its commune to find the codes." }
    expect:
      - { kind: non_empty, refusal: iris_not_found, path: iris }
    call: { method: GET, path: "/api/urba/iris/by_iris/{code}" }
    cost: { per: request }

  - name: urban_list_commune_iris_census
    class: read
    description: >-
      List the census figures of every IRIS of a commune (census 2021), with
      the commune's totals: {com, nb_iris, totaux: {pop, logements,
      res_principales, res_secondaires, logements_vacants, maisons,
      appartements, rp_en_appartement}, iris: [{iris, typ_iris, lab_iris,
      pop, pop_0_19, pop_20_64, pop_65p, ...}]}, 200 IRIS at most. A commune
      not split into IRIS has one row, typ_iris Z. Paris, Lyon and Marseille
      are read by arrondissement. In French: recensement par quartier, iris
      d'une commune.
    input:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: "^([0-9]{2}|2A|2B)[0-9]{3}$", description: "INSEE commune code; for Paris, Lyon and Marseille an arrondissement (75112, 69383, 13201)." }
    examples:
      - title: IRIS of Paris 12e
        input: { code: "75112" }
    refusals:
      - { code: commune_without_iris, when: "the response carries an empty iris list",
          message: "No IRIS under this code: an unknown commune, or the whole-city code of Paris, Lyon or Marseille, read by arrondissement (75101 to 75120, 69381 to 69389, 13201 to 13216)." }
    expect:
      - { kind: non_empty, refusal: commune_without_iris, path: iris }
    call: { method: GET, path: "/api/urba/iris/by_commune/{code}" }
    cost: { per: request }

  # --- Town planning: elected officials --------------------------------------
  - name: urban_list_mayors
    class: read
    description: >-
      List mayors from the national register of elected officials (Ministry
      of the Interior, data.gouv.fr): {fonction, total, tronque, signaux:
      [{nom, prenom, fonction, code_commune, commune, code_departement,
      debut_mandat, debut_fonction}]}. On a public body the decision-maker
      is an elected official, not a company director. Match on the commune
      code, never on its name: Sainte-Marie exists dozens of times.
      debut_fonction tells whether the mayor changed since a past contact.
      total counts the rows returned; tronque true means more matched than
      limit. Birth date and sex, in the source, are not returned. A commune
      code or a department is required. In French: maire d'une commune, liste
      des maires.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [code_commune] }
        - { required: [departement] }
      properties:
        code_commune: *code_insee
        departement: *departement
        limit: &elus_limit { type: integer, minimum: 1, maximum: 1000, default: 100, description: "Most officials returned." }
    examples:
      - title: Mayor of Bordeaux
        input: { code_commune: "33063" }
      - title: Mayors of Corse-du-Sud
        input: { departement: 2A, limit: 200 }
    call:
      method: GET
      path: /api/urba/elus/maires
      query: { code_commune: code_commune, departement: departement, limit: limit }
    cost: { per: request }

  - name: urban_list_epci_presidents
    class: read
    description: >-
      List presidents of intercommunal bodies (EPCI: metropolis, urban or
      community of communes) from the national register of elected
      officials: {fonction, total, tronque, signaux: [{nom, prenom,
      fonction, siren_epci, epci, code_commune, commune, code_departement,
      debut_mandat, debut_fonction}]}. Presidents only, not the thousands of
      community councillors. An EPCI has a SIREN, no commune code:
      code_commune is the commune the register attaches the president to.
      total counts the rows returned; tronque true means more matched than
      limit. Birth date and sex are not returned. Without siren or
      departement, every president up to limit. In French: président d'une
      intercommunalité, président de la communauté de communes.
    input:
      type: object
      additionalProperties: false
      properties:
        siren: *code_epci
        departement: *departement
        limit: *elus_limit
    examples:
      - title: President of Bordeaux Métropole
        input: { siren: "243300316" }
    call:
      method: GET
      path: /api/urba/elus/presidents-epci
      query: { siren: siren, departement: departement, limit: limit }
    cost: { per: request }

  # --- Law: consolidated codes and case law ---------------------------------
  - name: law_list_codes
    class: read
    description: >-
      List the consolidated French codes covered, with the short alias the
      law functions take: {codes: [{alias, legitext, libelle}]}, such as CC
      (Code civil), CGI (Code général des impôts), CU (Code de l'urbanisme),
      CCH (Code de la construction et de l'habitation). In French: liste des
      codes juridiques, codes de loi disponibles.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: Codes covered
        input: {}
    call: { method: GET, path: /api/loi/codes }
    cost: { per: request }

  - name: law_get_article
    class: read
    description: >-
      Get one article of a consolidated French code in the version in force at
      a date (today by default): {id, titre_texte, num, etat, date_debut,
      date_fin, texte, nota, source_url}. Use it to quote the exact text that
      applied on a given day, such as the day a contract was signed. source_url points to
      that version on Légifrance. In French: article du code civil, article de loi en
      vigueur, lire un article de code.
    input:
      type: object
      additionalProperties: false
      required: [code, num]
      properties:
        code: &code { type: string, pattern: "^([A-Za-z]{2,6}|LEGITEXT[0-9]{12})$", description: "Short alias of the code (CC, CGI, CU, CCH...) or its LEGITEXT id." }
        num: &num { type: string, minLength: 1, maxLength: 30, description: "Article number as the code writes it: 757, 1128, L213-2, 790 G." }
        date: *date
    examples:
      - title: Code civil article 757, in force today
        input: { code: CC, num: "757" }
      - title: Code général des impôts article 790 G at a death in 2019
        input: { code: CGI, num: "790 G", date: "2019-06-15" }
    refusals:
      - { code: article_not_found, when: "the response carries error not_found",
          message: "No version of this article in force at this date in this code: check the code alias, the number as the code writes it, and the date." }
    expect:
      - { kind: non_empty, refusal: article_not_found, path: id }
    call:
      method: GET
      path: /api/loi/article
      query: { code: code, num: num, date: date }
    cost: { per: request }

  - name: law_search_articles
    class: read
    description: >-
      Full-text search in the articles of the consolidated French codes:
      {count, articles: [{id, num, etat, date_debut, date_fin, titre_texte,
      extrait, source_url}]}. The query takes web-search syntax: "quoted
      phrase", OR, -excluded. By default only the versions in force today are
      searched. Use it to find the article that governs a question when its
      number is unknown. In French: chercher dans les codes, rechercher un
      article de loi.
    input:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: &fts { type: string, minLength: 2, description: "Search words, web-search syntax: \"phrase\", OR, -word." }
        code: *code
        en_vigueur: { type: boolean, default: true, description: "false also searches past and future versions." }
        limit: &law_limit { type: integer, minimum: 1, maximum: 50, default: 20 }
    examples:
      - title: Reserved portion in the Code civil
        input: { query: "\"réserve héréditaire\"", code: CC, limit: 10 }
    call:
      method: GET
      path: /api/loi/search
      query: { query: query, code: code, en_vigueur: en_vigueur, limit: limit }
    cost: { per: request }

  - name: law_list_article_versions
    class: read
    description: >-
      List every version of one code article, oldest first: {count, versions:
      [{id, etat, date_debut, date_fin, apercu, source_url}]}. Use it to see
      when an article changed, before reading the version in force at a given
      date. Empty when the article is unknown. In French: versions d'un article
      de loi, historique d'un article de code.
    input:
      type: object
      additionalProperties: false
      required: [code, num]
      properties:
        code: *code
        num: *num
    examples:
      - title: History of Code civil article 757
        input: { code: CC, num: "757" }
    call:
      method: GET
      path: /api/loi/versions
      query: { code: code, num: num }
    cost: { per: request }

  - name: law_search_case_law
    class: read
    description: >-
      Search French and European case law, ranked by relevance weighted by the
      authority of the court: {count, decisions: [{id, fond, titre,
      juridiction, numero, date_dec, solution, formation, ecli, autorite,
      extrait}]}. fond picks one collection: cass (Cour de cassation,
      published), inca (Cour de cassation, unpublished), capp (courts of
      appeal), jade (administrative courts), constit (Conseil
      constitutionnel), cnil, cedh (European Court of Human Rights), cjue
      (Court of Justice of the EU), jade_live (recent administrative
      decisions), judilibre (recent judicial decisions). Use it to find the
      case law on a question of succession, property or contract law. In French:
      chercher une jurisprudence, décisions de justice, arrêts de la cour de
      cassation.
    input:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: *fts
        fond: { type: string, enum: [cass, inca, capp, jade, constit, cnil, cedh, cjue, jade_live, judilibre] }
        juridiction: { type: string, minLength: 2, description: "Court name contains this text, such as cassation or appel de Paris." }
        date_min: *date
        date_max: *date
        limit: *law_limit
        expand: { type: boolean, default: false, description: "Widen the query with synonyms from the legal thesaurus." }
    examples:
      - title: Cour de cassation on gifts to report to an estate
        input: { query: "rapport succession donation", fond: cass, limit: 10 }
      - title: Recent appeal decisions on hidden defects in a house sale
        input: { query: "\"vice caché\" vente maison", fond: capp, date_min: "2022-01-01" }
    call:
      method: GET
      path: /api/juris/search
      query: { query: query, fond: fond, juridiction: juridiction, date_min: date_min,
               date_max: date_max, limit: limit, expand: expand }
    cost: { per: request }

  - name: law_get_decision
    class: read
    description: >-
      Get the full text of one court decision by its id, as case-law search
      returns it: {id, fond, titre, juridiction, numero, date_dec, solution,
      formation, ecli, texte, texte_chars, source_url}. The text is cut at
      max_chars (tronque true); source_url leads to the whole decision. In
      French: texte d'une décision de justice, lire un arrêt.
    input:
      type: object
      additionalProperties: false
      required: [decision_id]
      properties:
        decision_id: { type: string, pattern: "^[A-Za-z0-9_.:-]+$", not: { enum: [".", ".."] }, description: "Decision id, such as JURITEXT000036635309 or 001-230875." }
        max_chars: { type: integer, minimum: 0, default: 30000, description: "Cut the text at this length; 0 returns it whole." }
    examples:
      - title: Cass. 1re civ., 24 January 2018, 17-13.017
        input: { decision_id: JURITEXT000036635309 }
    refusals:
      - { code: decision_not_found, when: "the response carries error not_found",
          message: "No decision with this id: take the id from a case-law search result." }
    expect:
      - { kind: non_empty, refusal: decision_not_found, path: fond }
    call:
      method: GET
      path: "/api/juris/decision/{decision_id}"
      query: { max_chars: max_chars }
    cost: { per: request }

  # --- Law: collective agreements of a branch (KALI) -------------------------
  - name: law_list_collective_agreements
    class: read
    description: >-
      List French collective agreements of a branch (conventions
      collectives, KALI, DILA) by exact IDCC or by words of their title:
      {count, conventions: [{id, idcc, titre, etat, date_publi}]}, those in
      force first. etat: VIGUEUR_ETEN (extended, binds every employer of the
      branch), VIGUEUR_NON_ETEN (binds the signatories' members only),
      ABROGE... idcc null: a professional agreement outside a branch. Use it
      to resolve which agreement an IDCC is (from a payslip or a company
      record) before searching its articles. These are the sector's law; an
      agreement signed by one company is a company agreement, read apart. In
      French: conventions collectives, convention collective par idcc.
    input:
      type: object
      additionalProperties: false
      properties:
        idcc: &idcc { type: string, pattern: "^[0-9]{4}$", description: "IDCC of the agreement, 4 digits: 1486, 3090." }
        query: { type: string, minLength: 2, maxLength: 100, description: "Words found in the title, as written, case ignored: spectacle vivant, bureaux d'études. Not a full-text search." }
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
    examples:
      - title: Agreement with IDCC 1486
        input: { idcc: "1486" }
      - title: Agreements of the live performance sector
        input: { query: spectacle vivant }
    call:
      method: GET
      path: /api/ccn/conventions
      query: { idcc: idcc, query: query, limit: limit }
    cost: { per: request }

  - name: law_search_collective_agreement_articles
    class: read
    description: >-
      Full-text search in the articles of French collective agreements
      (KALI): articles, amendments (avenants), salary scales, extension
      orders: {count, articles: [{id, num, etat, date_debut, date_fin,
      date_signature, texte_titre, texte_nature, idcc, convention, extrait,
      permalien, lien_construit}]}. The query takes web-search syntax
      ("quoted phrase", OR, -excluded), French stemming applied. idcc
      restricts it to one agreement. Only versions in force by default.
      sort recent puts the latest effective date first: for a salary scale
      the latest amendment prevails, not the densest match. permalien is a
      verifiable FOD link; lien_construit a Légifrance address built by
      pattern, not guaranteed. Read an article whole by its id. In French:
      chercher dans une convention collective, grille de salaires
      conventionnelle.
    input:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: *fts
        idcc: *idcc
        en_vigueur: { type: boolean, default: true, description: "false also searches past versions: salary scales exist in many." }
        limit: *law_limit
        sort: { type: string, enum: [relevance, recent], default: relevance }
    examples:
      - title: Paid leave in the engineering consultancy agreement
        input: { query: "\"congés payés\"", idcc: "1486" }
      - title: Latest salary scale of private live performance
        input: { query: salaires minima, idcc: "3090", sort: recent, limit: 5 }
    call:
      method: GET
      path: /api/ccn/search
      query: { query: query, idcc: idcc, en_vigueur: en_vigueur, limit: limit, sort: sort }
    cost: { per: request }

  - name: law_get_collective_agreement_article
    class: read
    description: >-
      Get the full text of one collective-agreement article by its id, as
      the search returns it: {id, num, etat, date_debut, date_fin,
      date_signature, texte_id, texte_titre, texte_nature, texte,
      texte_chars, conteneur_id, idcc, convention, convention_etat,
      permalien, lien_construit, source_archive_url, source_archive_date}.
      texte_titre is the amendment or agreement that carries it, convention
      and idcc the agreement it belongs to: quote them with the article.
      The text is cut at max_chars (tronque true); texte_chars gives its
      whole length, permalien the whole article. In French: article de
      convention collective, texte d'un avenant.
    input:
      type: object
      additionalProperties: false
      required: [kali_id]
      properties:
        kali_id: { type: string, pattern: "^KALIARTI[0-9]{12}$", description: "Article id, as the search returns it: KALIARTI000005849443." }
        max_chars: { type: integer, minimum: 0, default: 30000, description: "Cut the text at this length; 0 returns it whole." }
    examples:
      - title: One article of a collective agreement
        input: { kali_id: KALIARTI000005849443 }
    refusals:
      - { code: collective_agreement_article_not_found, when: "the response carries error not_found",
          message: "No collective-agreement article with this id: take the id from a search result." }
    expect:
      - { kind: non_empty, refusal: collective_agreement_article_not_found, path: texte_chars }
    call:
      method: GET
      path: "/api/ccn/article/{kali_id}"
      query: { max_chars: max_chars }
    cost: { per: request }

  # --- Tax doctrine: BOFiP-Impôts -------------------------------------------
  - name: tax_search_bofip
    class: read
    description: >-
      Search the French tax administration's official doctrine (BOFiP-Impôts,
      DGFiP), commentaries in force only: {total_count, publications:
      [{identifiant_juridique, titre, serie, type, debut_de_validite,
      permalien, extrait}], source}. A commentary matches when it holds every
      word of query: 2 to 5 French keywords (droits de mutation, plus-values,
      IFI, pacte Dutreil, TVA immobilière); no result means fewer or other
      words. extrait is 400 characters around the first word found;
      total_count counts every match, beyond limit. Use it to find how the
      administration reads a tax rule, then read the commentary by its
      identifiant_juridique. Doctrine is the administration's reading of the
      law, not the law itself. In French: doctrine fiscale bofip, chercher dans
      le bofip, règle fiscale.
    input:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 3, maxLength: 120, description: "2 to 5 French keywords, all required: donation usufruit parts sociales." }
        limit: { type: integer, minimum: 1, maximum: 20, default: 6 }
    examples:
      - title: Doctrine on gifts of usufruct
        input: { query: donation usufruit, limit: 5 }
      - title: Doctrine on the Dutreil pact
        input: { query: pacte Dutreil transmission }
    call:
      method: GET
      path: /api/doctrine/bofip
      query: { query: query, limit: limit }
    cost: { per: request }

  - name: tax_get_bofip_document
    class: read
    description: >-
      Read one BOFiP-Impôts commentary or news item in force by its reference
      (identifiant_juridique of a search result): {identifiant_juridique,
      titre, serie, type, debut_de_validite, permalien, contenu,
      contenu_chars, tronque, source}. The text is cut at max_chars (tronque
      true, contenu_chars gives its whole length); permalien is the official
      page on bofip.impots.gouv.fr. The version suffix of a permalink
      (-20240319) is accepted and dropped. In French: lire un commentaire bofip,
      document bofip.
    input:
      type: object
      additionalProperties: false
      required: [identifiant]
      properties:
        identifiant: { type: string, pattern: "^(BOI|ACTU)-[A-Z0-9-]+$", description: "BOFiP reference: BOI-ENR-DMTG-20-30-20-20, or ACTU-... for a news item." }
        max_chars: { type: integer, minimum: 0, default: 12000, description: "Cut the text at this length; 0 returns it whole." }
    examples:
      - title: Allowances on gifts (BOI-ENR-DMTG-20-30-20-20)
        input: { identifiant: BOI-ENR-DMTG-20-30-20-20, max_chars: 20000 }
    refusals:
      - { code: bofip_document_not_found, when: "the response is null",
          message: "No BOFiP publication in force with this reference: take it from a doctrine search result." }
    expect:
      - { kind: non_empty, refusal: bofip_document_not_found, path: identifiant_juridique }
    call:
      method: GET
      path: "/api/doctrine/bofip/{identifiant}"
      query: { max_chars: max_chars }
    cost: { per: request }

  # --- Compliance: asset freezes ---------------------------------------------
  - name: compliance_screen_asset_freeze
    class: read
    description: >-
      Screen a name against the French national register of asset freezes
      (DG Trésor): persons, entities and ships under a freeze in force in
      France (UN, EU and national measures). Use it to screen a client, a
      supplier or a contract party. An entry matches when its name or an alias holds
      every word of nom, accents, case and punctuation ignored. prenom only
      orders the matches, never drops one: each carries sur, nom_et_prenom
      (one of its first names contains prenom) or nom_seul. Returns
      {publication, inscrits, total, nom_et_prenom, nom_seul, correspondances:
      [{sur, nature, nom, prenoms, naissance, fondement}], source}; limit
      bounds the list, never the counts: total above the list length means
      more matches to read. A match on a common name is not a confirmed
      freeze: compare first names and date of birth. The name travels in the
      request body and FOD does not keep it. In French: gel des avoirs, liste des
      sanctions, personne sous sanctions.
    input:
      type: object
      additionalProperties: false
      required: [nom]
      properties:
        nom: { type: string, minLength: 2, maxLength: 120, personal: true, description: "Surname, or name of the legal person: Martin, SCI Les Hortillons." }
        prenom: { type: string, minLength: 2, maxLength: 120, personal: true, description: "First name: puts the entries that carry it first, drops none." }
        limit: { type: integer, minimum: 1, maximum: 50, default: 10, description: "Most matches listed; the counts stay whole." }
    examples:
      - title: A natural person, surname and first name
        input: { nom: Martin, prenom: Jean }
      - title: A company party to a sale
        input: { nom: SCI Les Hortillons, limit: 20 }
    refusals:
      - { code: register_inconclusive, when: 503,
          message: "The asset-freeze register cannot be relied on right now (not loaded, truncated or out of date). This is not an absence of match: do not conclude that the name is not listed; retry later." }
      - { code: name_without_letters, when: 400,
          message: "The name holds no letter or digit: give a surname or the name of a legal person." }
    call:
      method: POST
      path: /api/vigilance/gels-avoirs/controle
      body: { nom: nom, prenom: prenom, limit: limit }
    cost: { per: request }

  # --- Compliance: mutual termination before filing ---------------------------
  - name: compliance_check_mutual_termination
    class: read
    description: >-
      Check a French mutual termination (rupture conventionnelle) BEFORE
      filing the request for approval, by fixed rules: reference salary (12 or
      3 months, bonuses pro rata, months marked neutralise left out), length
      of service, legal minimum, collective-agreement minimum, withdrawal,
      filing and earliest termination dates. Returns {verdict: conforme,
      non_conforme or incomplet, controles: [{controle, statut, valeur,
      detail, source}], telerc}. statut non_couvert means the agreement
      minimum of that IDCC is not coded: never present it as compliant, it is
      to check by hand. telerc holds the fields of the online request on
      TéléRC (mandatory since April 2022), to copy as given; a null field is
      to fill in by hand. Read every figure from the payslips, never estimate
      one. Mark a month neutralise WITHOUT its reason (it would be health
      data), and send enough earlier months that 12 not neutralised remain.
      The amounts travel in the request body and FOD keeps nothing. In French:
      départ négocié, fin de cdi.
    input:
      type: object
      additionalProperties: false
      required: [date_entree, date_signature, date_rupture_envisagee, indemnite_convenue, mois]
      properties:
        date_entree: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", personal: true, description: "Date the employee joined, YYYY-MM-DD." }
        date_signature: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Date the agreement is signed, YYYY-MM-DD; date_entree <= date_signature <= date_rupture_envisagee." }
        date_rupture_envisagee: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Termination date planned in the agreement, YYYY-MM-DD." }
        indemnite_convenue: { type: number, minimum: 0, personal: true, description: "Specific termination indemnity agreed, gross, in euros." }
        idcc:
          type: string
          pattern: "^[0-9]{1,4}$"
          description: "IDCC of the collective agreement that applies to the employee. Absent: no agreement, the agreement minimum is not checked."
        mois:
          type: array
          minItems: 1
          maxItems: 120
          description: >-
            Gross pay month by month, read from the payslips: at least the 12
            months before the month of signature, plus one earlier month for
            each month marked neutralise. Each month once.
          items:
            type: object
            additionalProperties: false
            required: [mois, brut]
            properties:
              mois: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", description: "YYYY-MM." }
              brut: { type: number, minimum: 0, personal: true, description: "Gross pay of the month, bonuses included, in euros." }
              primes_exceptionnelles: { type: number, minimum: 0, default: 0, personal: true, description: "Part of brut paid as an annual or exceptional bonus (13th month, year-end bonus): counted pro rata in the 3-month formula. Never above brut." }
              neutralise: { type: boolean, default: false, personal: true, description: "Leave this month out (sick leave, maternity or birth leave, any suspension that lowered the pay). No reason is asked: never give one." }
        jours_non_comptes_anciennete: { type: integer, minimum: 0, maximum: 36500, default: 0, personal: true, description: "Days of suspension that the law or the agreement excludes from length of service (e.g. half of a parental leave)." }
        date_depot: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Planned filing date, YYYY-MM-DD. Absent: the earliest possible." }
        alsace_moselle: { type: boolean, default: false, description: "The employee works in Alsace-Moselle: Good Friday and 26 December are public holidays." }
        categorie: { type: string, enum: [cadre, non_cadre], description: "Category of the employee, from the contract or payroll: needed for the agreement minimum of some IDCCs (e.g. 2264); absent there, that check comes back non_couvert." }
        anciennete_cadre_mois: { type: integer, minimum: 0, maximum: 1200, personal: true, description: "Months of service as a cadre: needed for the agreement minimum of some IDCCs (e.g. 2264); only a whole career as cadre is computed, otherwise that check comes back non_couvert." }
    examples:
      - title: Seven years of service, a 13th month, one month of sick leave left out
        input:
          date_entree: "2019-03-04"
          date_signature: "2026-11-10"
          date_rupture_envisagee: "2026-12-31"
          indemnite_convenue: 7000
          idcc: "1486"
          mois:
            - { mois: "2025-10", brut: 3200 }
            - { mois: "2025-11", brut: 3200 }
            - { mois: "2025-12", brut: 6400, primes_exceptionnelles: 3200 }
            - { mois: "2026-01", brut: 3200 }
            - { mois: "2026-02", brut: 3200 }
            - { mois: "2026-03", brut: 3200 }
            - { mois: "2026-04", brut: 3200 }
            - { mois: "2026-05", brut: 3200 }
            - { mois: "2026-06", brut: 1850, neutralise: true }
            - { mois: "2026-07", brut: 3200 }
            - { mois: "2026-08", brut: 3200 }
            - { mois: "2026-09", brut: 3200 }
            - { mois: "2026-10", brut: 3200 }
      - title: No collective agreement, a planned filing date
        input:
          date_entree: "2023-09-01"
          date_signature: "2026-11-16"
          date_rupture_envisagee: "2026-12-15"
          indemnite_convenue: 2400
          date_depot: "2026-12-02"
          mois:
            - { mois: "2025-11", brut: 2600 }
            - { mois: "2025-12", brut: 2600 }
            - { mois: "2026-01", brut: 2600 }
            - { mois: "2026-02", brut: 2600 }
            - { mois: "2026-03", brut: 2600 }
            - { mois: "2026-04", brut: 2600 }
            - { mois: "2026-05", brut: 2600 }
            - { mois: "2026-06", brut: 2600 }
            - { mois: "2026-07", brut: 2600 }
            - { mois: "2026-08", brut: 2600 }
            - { mois: "2026-09", brut: 2600 }
            - { mois: "2026-10", brut: 2600 }
    call:
      method: POST
      path: /api/rupture-conventionnelle/controle
      body:
        date_entree: date_entree
        date_signature: date_signature
        date_rupture_envisagee: date_rupture_envisagee
        indemnite_convenue: indemnite_convenue
        idcc: idcc
        mois: mois
        jours_non_comptes_anciennete: jours_non_comptes_anciennete
        date_depot: date_depot
        alsace_moselle: alsace_moselle
        categorie: categorie
        anciennete_cadre_mois: anciennete_cadre_mois
    cost: { per: request }

  # --- Health: medicines (BDPM) ----------------------------------------------
  - name: health_search_medicines
    class: read
    description: >-
      Search the French public medicines database (BDPM: ANSM, HAS and
      Assurance maladie) for medicines whose name or an active substance holds
      every word of q, accents and case ignored. Returns {total, medicaments:
      [{cis, denomination, forme, voies, substances, titulaires, statut_amm,
      commercialisation, alerte, lien}], source}; total counts every match,
      beyond limit. alerte is the database's warning on the medicine, if any.
      Pass cis to health_get_medicine for its full record and safety
      information. source.mise_a_jour is the date of the database, which its
      licence asks to quote. The first call after a restart of the service
      takes about 10 s. In French: chercher un médicament, base des médicaments,
      substance active.
    input:
      type: object
      additionalProperties: false
      required: [q]
      properties:
        q: { type: string, minLength: 3, maxLength: 120, description: "Name or active substance, such as ibuprofène or doliprane; every word must match." }
        commercialises: { type: boolean, default: false, description: "true keeps only the medicines on the market." }
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
    examples:
      - title: Ibuprofen medicines on the market
        input: { q: ibuprofène, commercialises: true, limit: 10 }
    call:
      method: GET
      path: /api/sante/medicaments
      query: { q: q, commercialises: commercialises, limit: limit }
    cost: { per: request }

  - name: health_get_medicine
    class: read
    description: >-
      Get the full record of one medicine of the French public medicines
      database by its CIS code: composition, presentations (CIP13, price,
      reimbursement rate), HAS opinions on medical benefit (smr) and its
      improvement (asmr) with the link to each opinion, prescription and
      dispensing conditions, generic groups, and the securite block: ANSM
      important safety information (text, dates, link), supply shortages and
      tensions (disponibilite), and whether it is a medicine of major
      therapeutic interest (interet_therapeutique_majeur, with its ATC code).
      Also date_amm, procedure_amm, surveillance_renforcee and source (with
      mise_a_jour, the date of the database). In French: fiche d'un médicament,
      prix et remboursement d'un médicament.
    input:
      type: object
      additionalProperties: false
      required: [cis]
      properties:
        cis: { type: string, pattern: "^[0-9]{8}$", description: "CIS code, 8 digits, from a medicines search." }
    examples:
      - title: Record of one medicine by its CIS code
        input: { cis: "60234100" }
    refusals:
      - { code: medicine_not_found, when: "the response is null",
          message: "No medicine with this CIS code in the public medicines database: take the code from a medicines search." }
    expect:
      - { kind: non_empty, refusal: medicine_not_found, path: cis }
    call: { method: GET, path: "/api/sante/medicaments/{cis}" }
    cost: { per: request }

  # --- Health: establishments (FINESS) and their quality evaluations (HAS) ----
  - name: health_search_establishments
    class: read
    description: >-
      Search the national directory of health and social-care
      establishments (FINESS, about 100,000: hospitals, care homes,
      pharmacies, laboratories, health centres, home-care services) by name
      or FINESS code: {count, results: [{finess_et, finess_ej, rs,
      rs_longue, adresse, cp_commune, commune_code, departement_code,
      departement, tel, categorie_code, categorie, categorie_agregee, siret,
      ape}]}. finess_et is the establishment, finess_ej the legal entity
      that runs it; siret links to the company register. count is the
      number returned, never the total: count equal to limit means more
      match, narrow by department or category. The first call after a
      restart of the service loads the file, up to a minute. In French:
      établissements de santé, chercher un hôpital, annuaire finess.
    input:
      type: object
      additionalProperties: false
      required: [q]
      properties:
        q: { type: string, minLength: 2, maxLength: 120, description: "Words of the name (every word must appear, with the postal code and town, accents and case ignored), or the start of a FINESS code, digits only." }
        departement: { type: string, pattern: "^([0-9]{2}|2[AB]|9[A-FJ])$", description: "FINESS department code: 75, 2A; overseas 9A (Guadeloupe) to 9F and 9J, not 971." }
        categorie: { type: string, minLength: 2, maxLength: 120, description: "Part of the category label, accents and case ignored: centre hospitalier, personnes âgées dépendantes (care homes; the label holds no acronym such as EHPAD), pharmacie." }
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
    examples:
      - title: Hospitals in Bordeaux
        input: { q: bordeaux, departement: "33", categorie: centre hospitalier }
      - title: Establishments whose FINESS code starts with 330781
        input: { q: "330781" }
    call:
      method: GET
      path: /api/sante/finess/search
      query: { q: q, departement: departement, categorie: categorie, limit: limit }
    timeout_s: 150
    cost: { per: request }

  - name: health_get_establishment
    class: read
    description: >-
      Get one establishment of the FINESS directory by its exact code, as an
      establishment (finess_et) or as the legal entity that runs it
      (finess_ej, the first of its establishments then): same fields as a
      search result. In French: fiche finess, détail d'un établissement de
      santé.
    input:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9][0-9AB][0-9]{7}$", description: "FINESS code, 9 characters (2A and 2B for Corsica): 330781196." }
    examples:
      - title: The legal entity of the Bordeaux university hospital
        input: { code: "330781196" }
    refusals:
      - { code: finess_not_found, when: "the response is null",
          message: "No establishment or legal entity with this FINESS code: search by name to find the code." }
    expect:
      - { kind: non_empty, refusal: finess_not_found, path: finess_et }
    call: { method: GET, path: "/api/sante/finess/{code}" }
    timeout_s: 150
    cost: { per: request }

  - name: health_search_quality_evaluations
    class: read
    description: >-
      Search the quality evaluations of social and medico-social
      establishments and services (ESSMS: care homes, disability services,
      child protection...) published by the HAS, one row per establishment
      and evaluation: {total, returned, results: [{finess_geo,
      raison_sociale, region_libelle, departement_code,
      essms_categ_finess_libelle, essms_secteur, essms_type_structure,
      essms_statut_juridique, eval_date_debut, indice_qualite}]}. total
      counts every match, beyond limit. finess_geo is the FINESS code of
      the establishment. Labels match exactly: read the values first
      (regions are upper case without accents, ILE DE FRANCE). Without a
      filter, every evaluation. In French: évaluation qualité d'un ehpad,
      évaluations des établissements médico-sociaux.
    input:
      type: object
      additionalProperties: false
      properties:
        region_libelle: { type: string, minLength: 2, maxLength: 80, description: "Region exactly as the values list it: ILE DE FRANCE." }
        departement_code: { type: string, pattern: "^[0-9AB]{2,3}$", description: "Department code: 33, 2A, 974." }
        secteur: { type: string, enum: [Social, Médico-social] }
        type_structure: { type: string, enum: [Etablissement, Service] }
        statut_juridique: { type: string, minLength: 2, maxLength: 120, description: "Legal status exactly as the values list it." }
        annee_min: { type: integer, minimum: 2000, maximum: 2100, description: "Earliest year the evaluation began." }
        annee_max: { type: integer, minimum: 2000, maximum: 2100, description: "Latest year the evaluation began." }
        limit: { type: integer, minimum: 1, maximum: 500, default: 50 }
    examples:
      - title: Medico-social establishments evaluated in Gironde since 2024
        input: { departement_code: "33", secteur: Médico-social, type_structure: Etablissement, annee_min: 2024 }
    call:
      method: POST
      path: /api/sante/essms/search
      body: { region_libelle: region_libelle, departement_code: departement_code, secteur: secteur,
              type_structure: type_structure, statut_juridique: statut_juridique, annee_min: annee_min,
              annee_max: annee_max, limit: limit }
    timeout_s: 120
    cost: { per: request }

  - name: health_list_quality_evaluation_values
    class: read
    description: >-
      List the values the quality evaluations of ESSMS can be filtered by,
      each with its number of rows: {region_libelle, essms_secteur,
      essms_type_structure, essms_statut_juridique,
      essms_categ_finess_libelle, annees}, each a list of [value, count],
      largest first (annees by year). Read it before a search: the filters
      take these labels exactly. In French: filtres des évaluations essms,
      valeurs des évaluations qualité.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: Filter values of the ESSMS evaluations
        input: {}
    call: { method: GET, path: /api/sante/essms/dimensions }
    timeout_s: 120
    cost: { per: request }

  # --- Health: clinical trials --------------------------------------------------
  - name: health_search_clinical_trials
    class: read
    description: >-
      Search the ClinicalTrials.gov registry (U.S. National Library of
      Medicine, worldwide) for trials matching every criterion given; at least
      one of condition, intervention, promoteur, terme. pays keeps trials with
      at least one site in that country (France by default, English name as
      the registry writes it). Returns {total, essais: [{nct, titre, acronyme,
      statut, type, phases, effectif, promoteur, collaborateurs, conditions,
      interventions, dates, a_des_resultats, nb_sites_pays, villes_pays,
      lien}], page_suivante, source}; a date carries estimee true when it is
      planned. Site contacts are never returned. In French: essais cliniques,
      chercher un essai clinique.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [condition] }
        - { required: [intervention] }
        - { required: [promoteur] }
        - { required: [terme] }
      properties:
        condition: { type: string, minLength: 1, maxLength: 200, description: "Condition or disease, in English: glioblastoma." }
        intervention: { type: string, minLength: 1, maxLength: 200, description: "Drug, device or procedure." }
        promoteur: { type: string, minLength: 1, maxLength: 200, description: "Lead sponsor or collaborator." }
        terme: { type: string, minLength: 1, maxLength: 200, description: "Free text, searched everywhere." }
        pays: { type: string, pattern: "^([A-Za-z][A-Za-z .'-]{1,59})?$", default: France, description: "Country of a site, English name: France, Germany, United States; an empty string searches worldwide." }
        statut:
          type: array
          minItems: 1
          items: { type: string, enum: [ACTIVE_NOT_RECRUITING, COMPLETED, ENROLLING_BY_INVITATION, NOT_YET_RECRUITING, RECRUITING, SUSPENDED, TERMINATED, WITHDRAWN, AVAILABLE, NO_LONGER_AVAILABLE, TEMPORARILY_NOT_AVAILABLE, APPROVED_FOR_MARKETING, WITHHELD, UNKNOWN] }
          description: "Overall status of the trial, any of these."
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
        page_token: { type: string, minLength: 1, maxLength: 200, description: "page_suivante of the previous page." }
    examples:
      - title: Glioblastoma trials recruiting in France
        input: { condition: glioblastoma, statut: [RECRUITING, NOT_YET_RECRUITING] }
      - title: Trials of one sponsor in Germany
        input: { promoteur: Institut Curie, pays: Germany, limit: 10 }
    pagination: { kind: cursor, request_param: page_token, next: page_suivante, total: total, max_pages: 5 }
    call:
      method: GET
      path: /api/sante/essais/clinicaltrials
      query: { condition: condition, intervention: intervention, promoteur: promoteur, terme: terme,
               pays: pays, statut: statut, limit: limit, page_token: page_token }
    cost: { per: page }

  - name: health_get_clinical_trial
    class: read
    description: >-
      Get one trial of the ClinicalTrials.gov registry by its NCT id: the
      fields of a search result, plus its brief summary (resume) and each site
      in the country asked (sites_pays: [{etablissement, ville, code_postal,
      statut}], France by default). Site contacts are never returned. In French:
      détail d'un essai clinique, essai par numéro nct.
    input:
      type: object
      additionalProperties: false
      required: [nct]
      properties:
        nct: { type: string, pattern: "^[Nn][Cc][Tt][0-9]{8}$", description: "NCT id: NCT followed by 8 digits." }
        pays: { type: string, minLength: 1, maxLength: 60, default: France, description: "Country whose sites are listed, English name." }
    examples:
      - title: One trial and its French sites
        input: { nct: NCT03958240 }
    refusals:
      - { code: trial_not_found, when: "the response is null",
          message: "No trial with this NCT id in ClinicalTrials.gov." }
    expect:
      - { kind: non_empty, refusal: trial_not_found, path: nct }
    call:
      method: GET
      path: "/api/sante/essais/clinicaltrials/{nct}"
      query: { pays: pays }
    cost: { per: request }

  - name: health_search_eu_clinical_trials
    class: read
    description: >-
      Search the EU clinical trials register (CTIS, public portal of the
      European Medicines Agency) for trials matching every criterion given;
      at least one of texte, condition, promoteur, produit. Latest decision
      first. Returns {total, page, pages, essais: [{numero, titre,
      titre_court, statut, statut_code, phase, conditions,
      domaines_therapeutiques, produits, promoteur, type_promoteur, pays,
      effectif_prevu, date_decision, date_debut_ue, date_fin_ue, lien}],
      source}. Next page: page + 1 while page is below pages. The portal API is
      not documented by the EMA: an answer out of shape is refused, never read
      as an empty list. In French: essais cliniques européens, registre européen
      des essais.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [texte] }
        - { required: [condition] }
        - { required: [promoteur] }
        - { required: [produit] }
      properties:
        texte: { type: string, minLength: 1, maxLength: 200, description: "Every one of these words, anywhere." }
        condition: { type: string, minLength: 1, maxLength: 200, description: "Medical condition." }
        promoteur: { type: string, minLength: 1, maxLength: 200, description: "Sponsor." }
        produit: { type: string, minLength: 1, maxLength: 200, description: "Product name." }
        pays:
          type: array
          minItems: 1
          items: { type: string, enum: [AT, BE, BG, HR, CY, CZ, DK, EE, FI, FR, DE, GR, HU, IS, IE, IT, LV, LI, LT, LU, MT, NL, "NO", PL, PT, RO, SK, SI, ES, SE] }
          default: [FR]
          description: "Member states concerned, ISO alpha-2 (FR when absent)."
        statut:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1, maximum: 12 }
          description: "Portal status codes: 1 under evaluation, 2 authorised recruitment pending, 3 authorised recruiting, 4 ongoing recruiting, 5 recruitment ended, 6 temporarily halted, 7 suspended, 8 ended, 9 expired, 10 revoked, 11 not authorised, 12 cancelled."
        page: { type: integer, minimum: 1, default: 1 }
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
    examples:
      - title: Recruiting glioblastoma trials in France
        input: { condition: glioblastoma, statut: [3, 4] }
      - title: Trials of one product in France and Belgium
        input: { produit: pembrolizumab, pays: [FR, BE], limit: 10 }
    refusals:
      - &upstream_unreadable { code: upstream_answer_unreadable, when: 502, body: { path: detail, contains: ["réponse amont inexploitable"] },
          message: "The public source answered in a shape FOD cannot read: retrying unchanged fails the same way." }
    call:
      method: GET
      path: /api/sante/essais/ctis
      query: { texte: texte, condition: condition, promoteur: promoteur, produit: produit,
               pays: pays, statut: statut, page: page, limit: limit }
    cost: { per: request }

  - name: health_get_eu_clinical_trial
    class: read
    description: >-
      Get one trial of the EU register (CTIS) by its EU CT number: title,
      phase, overall status, plus its products (produits_detail: name,
      substance, form), its status in the country asked (statut_pays:
      statut, date_decision, recrutement_commence, effectif_prevu) and the
      sites there (sites_pays: [{etablissement, service, ville,
      code_postal}]), France by default. Site contacts are never returned. In
      French: détail d'un essai européen, essai ctis.
    input:
      type: object
      additionalProperties: false
      required: [numero]
      properties:
        numero: { type: string, pattern: "^[0-9]{4}-[0-9]{6}-[0-9]{2}-[0-9]{2}$", description: "EU CT number: 2024-520051-24-00." }
        pays: { type: string, enum: [AT, BE, BG, HR, CY, CZ, DK, EE, FI, FR, DE, GR, HU, IS, IE, IT, LV, LI, LT, LU, MT, NL, "NO", PL, PT, RO, SK, SI, ES, SE], default: FR, description: "Member state whose sites are listed, ISO alpha-2." }
    examples:
      - title: One EU trial and its French sites
        input: { numero: "2024-520051-24-00" }
    refusals:
      - { code: trial_not_found, when: "the response is null",
          message: "No trial with this EU CT number in CTIS." }
      - *upstream_unreadable
    expect:
      - { kind: non_empty, refusal: trial_not_found, path: numero }
    call:
      method: GET
      path: "/api/sante/essais/ctis/{numero}"
      query: { pays: pays }
    cost: { per: request }

  # --- Health: biomedical literature ----------------------------------------
  - name: health_search_pubmed
    class: read
    description: >-
      Search PubMed (U.S. National Library of Medicine) in PubMed syntax
      (glioblastoma AND france[ad], [mh], [dp], [au]...), newest first, or by
      relevance. Returns {total, offset, traduction, articles: [{pmid, doi,
      pmcid, titre, revue, date, volume, numero, pages, types, langues,
      auteurs, lien}], source}; traduction is the query as PubMed understood
      it. No abstract here: health_get_europepmc_article with pmid gives it.
      Next page: offset + limit. In French: chercher sur pubmed, articles
      scientifiques, publications médicales.
    input:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 2, maxLength: 500, description: "PubMed query: glioblastoma AND france[ad]." }
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
        offset: { type: integer, minimum: 0, maximum: 9999, default: 0, description: "Results skipped: offset + limit of the previous page." }
        tri: { type: string, enum: [date, pertinence], default: date, description: "date (newest first) or pertinence (relevance)." }
    examples:
      - title: Glioblastoma papers with a French affiliation
        input: { query: "glioblastoma AND france[ad]", limit: 10 }
    refusals:
      - { code: query_not_processed, when: 502, body: { path: detail, contains: ["n'a pas traité la requête"] },
          message: "PubMed could not process this query: check its syntax (fields in brackets, AND, OR, NOT)." }
      - *upstream_unreadable
    call:
      method: GET
      path: /api/sante/publications/pubmed
      query: { query: query, limit: limit, offset: offset, tri: tri }
    cost: { per: request }

  - name: health_get_pubmed_article
    class: read
    description: >-
      Get one PubMed record by its PMID: {pmid, doi, pmcid, titre, revue,
      revue_abregee, date, volume, numero, pages, types, langues, auteurs,
      lien, source}. No abstract: health_get_europepmc_article with the same
      pmid gives it. In French: article pubmed, résumé d'une publication
      médicale.
    input:
      type: object
      additionalProperties: false
      required: [pmid]
      properties:
        pmid: &pmid { type: string, pattern: "^[0-9]{1,9}$", description: "PubMed id, 1 to 9 digits." }
    examples:
      - title: One PubMed record
        input: { pmid: "32182409" }
    refusals:
      - { code: article_not_found, when: "the response is null",
          message: "No PubMed record with this PMID." }
    expect:
      - { kind: non_empty, refusal: article_not_found, path: pmid }
    call: { method: GET, path: "/api/sante/publications/pubmed/{pmid}" }
    cost: { per: request }

  - name: health_search_europepmc
    class: read
    description: >-
      Search Europe PMC (EMBL-EBI: PubMed, PubMed Central, preprints...) in
      Europe PMC syntax (glioblastoma AND AFF:"France", AUTH:, PUB_YEAR:...).
      Returns {total, articles: [{id, base, pmid, pmcid, doi, titre, auteurs,
      revue, annee, date_publication, acces_libre, citations, lien}],
      curseur_suivant, source}. A malformed query returns zero results, like a
      query without match. In French: chercher sur europe pmc, littérature
      scientifique européenne.
    input:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 2, maxLength: 500, description: "Europe PMC query: glioblastoma AND AFF:\"France\"." }
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
        curseur: { type: string, minLength: 1, maxLength: 200, description: "curseur_suivant of the previous page." }
    examples:
      - title: Glioblastoma papers with a French affiliation since 2024
        input: { query: "glioblastoma AND AFF:\"France\" AND PUB_YEAR:[2024 TO 2026]", limit: 10 }
    pagination: { kind: cursor, request_param: curseur, next: curseur_suivant, total: total, max_pages: 5 }
    call:
      method: GET
      path: /api/sante/publications/europepmc
      query: { query: query, limit: limit, curseur: curseur }
    cost: { per: page }

  - name: health_get_europepmc_article
    class: read
    description: >-
      Get one full Europe PMC record by pmid or by doi (exactly one): the
      fields of a search result plus resume (the abstract), affiliation,
      langue, types, mots_cles and textes_integraux: [{acces, format, site,
      url}], each full-text link saying whether it is open access or needs a
      subscription. In French: article europe pmc, résumé d'un article
      scientifique.
    input:
      type: object
      additionalProperties: false
      oneOf:
        - { required: [pmid] }
        - { required: [doi] }
      properties:
        pmid: *pmid
        doi: { type: string, pattern: "^10\\.[0-9]{4,9}/[^\\s\"]+$", maxLength: 300, description: "DOI: 10.1056/NEJMoa2001017." }
    examples:
      - title: Abstract of a PubMed record
        input: { pmid: "32182409" }
      - title: A paper by its DOI
        input: { doi: "10.1056/NEJMoa2001017" }
    refusals:
      - { code: article_not_found, when: "the response is null",
          message: "No Europe PMC record with this PMID or DOI." }
    expect:
      - { kind: non_empty, refusal: article_not_found, path: id }
    call:
      method: GET
      path: /api/sante/publications/europepmc/article
      query: { pmid: pmid, doi: doi }
    cost: { per: request }

  # --- Health: declared links of interest (Transparence Santé) ----------------
  - name: health_list_interest_declarations
    class: read
    description: >-
      List the links of interest declared by health-sector companies to their
      beneficiaries (Transparence Santé), newest first: {total, declarations:
      [{type, identifiant, montant, date, periode, motif, convention_liee,
      entreprise: {raison_sociale, siren}, beneficiaire: {nom, prenom,
      categorie, identifiant, profession, structure, ville, departement}}],
      source}; never the postal address. montant null is a missing amount,
      not 0. Do not add amounts of different types: a payment or benefit can
      execute an agreement (convention_liee), the same money then appears
      twice. Personal data under licence CC BY-NC-SA 4.0, reuse restricted to
      transparency of links of interest (no strictly commercial use); credit
      required: "Source : base Transparence - Santé (Direction Générale de la
      Santé), transparence.sante.gouv.fr, licence CC BY-NC-SA 4.0." (source.attribution).
      In French: liens d'intérêt, transparence santé, avantages versés aux médecins.
    input:
      type: object
      additionalProperties: false
      anyOf: &transparence_criteria
        - { required: [entreprise] }
        - { required: [siren] }
        - { required: [beneficiaire] }
        - { required: [rpps] }
        - { required: [ville] }
        - { required: [departement] }
      properties:
        entreprise: &tr_entreprise { type: string, minLength: 2, maxLength: 120, description: "Words of the declaring company's name." }
        siren: &tr_siren { type: string, pattern: "^[0-9]{9}$", description: "SIREN of the declaring company." }
        beneficiaire: &tr_beneficiaire { type: string, minLength: 2, maxLength: 120, personal: true, description: "Surname (and first name) of the beneficiary." }
        rpps: &tr_rpps { type: string, pattern: "^[0-9]{11}$", personal: true, description: "RPPS id of the health professional, 11 digits." }
        ville: &tr_ville { type: string, minLength: 2, maxLength: 80, description: "Words of the beneficiary's town." }
        departement: &tr_departement { type: string, pattern: "^([0-9]{2,3}|2[AaBb])$", description: "Department of the beneficiary: 75, 2A, 974." }
        types: &tr_types
          type: array
          minItems: 1
          items: { type: string, enum: [avantage, convention, remuneration] }
          description: "Kinds of link: avantage (benefit), convention (agreement), remuneration (payment)."
        date_min: *date
        date_max: *date
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
        offset: { type: integer, minimum: 0, maximum: 9999, default: 0, description: "Declarations skipped; offset + limit at most 10,000: narrow the filters beyond." }
    examples:
      - title: Declarations of one company in 2025
        input: { siren: "552032534", date_min: "2025-01-01", date_max: "2025-12-31", limit: 50 }
      - title: Payments to one health professional
        input: { rpps: "10001234567", types: [remuneration] }
    call:
      method: GET
      path: /api/sante/transparence/declarations
      query: { entreprise: entreprise, siren: siren, beneficiaire: beneficiaire, rpps: rpps,
               ville: ville, departement: departement, types: types, date_min: date_min,
               date_max: date_max, limit: limit, offset: offset }
    cost: { per: request }

  - name: health_sum_interests_by_company
    class: read
    description: >-
      The declared links of interest (Transparence Santé) that match the
      filters, grouped by company and by type: {groupes: [{entreprise:
      {raison_sociale, siren}, type, montant_total, declarations, premiere,
      derniere}], suite, source}, largest total first; suite true means more
      groups after this page (no total is given). Do not add totals of
      different types: a payment or benefit can execute an agreement
      (convention_liee), the same money is then counted in both. Personal
      data under licence CC BY-NC-SA 4.0, reuse restricted to transparency of
      links of interest (no strictly commercial use); credit required:
      "Source : base Transparence - Santé (Direction Générale de la Santé),
      transparence.sante.gouv.fr, licence CC BY-NC-SA 4.0."
      (source.attribution). In French: montants des liens d'intérêt par
      laboratoire, total transparence santé.
    input:
      type: object
      additionalProperties: false
      anyOf: *transparence_criteria
      properties:
        entreprise: *tr_entreprise
        siren: *tr_siren
        beneficiaire: *tr_beneficiaire
        rpps: *tr_rpps
        ville: *tr_ville
        departement: *tr_departement
        types: *tr_types
        date_min: *date
        date_max: *date
        limit: { type: integer, minimum: 1, maximum: 99, default: 50 }
        offset: { type: integer, minimum: 0, maximum: 9998, default: 0, description: "Groups skipped; offset + limit at most 9,999: narrow the filters beyond." }
    examples:
      - title: Companies with links to one health professional
        input: { rpps: "10001234567" }
      - title: Agreements and payments declared in Gironde in 2025
        input: { departement: "33", types: [convention, remuneration], date_min: "2025-01-01" }
    call:
      method: GET
      path: /api/sante/transparence/par-entreprise
      query: { entreprise: entreprise, siren: siren, beneficiaire: beneficiaire, rpps: rpps,
               ville: ville, departement: departement, types: types, date_min: date_min,
               date_max: date_max, limit: limit, offset: offset }
    cost: { per: request }

  # --- Public procurement: tender notices (BOAMP), awarded contracts (DECP) --
  - name: procurement_search_notices
    class: read
    description: >-
      Search French public tender notices (BOAMP, index kept by FOD and
      refreshed daily), newest first: {results: [{idweb, objet, organisme,
      date_publication, date_limite_reponse, dep_publication, nature_marche,
      type_procedure, type_avis_famille, statut, descripteurs, synthese,
      url}], total_count}. A notice says a need and a deadline, not who wins:
      the outcome is in the awarded contracts. Without any filter, the latest
      notices of all France come back. In French: appels d'offres, marchés
      publics ouverts, avis boamp.
    input:
      type: object
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1, maxLength: 200, description: "Text in the subject of the notice." }
        descripteur: { type: string, minLength: 1, maxLength: 200, description: "Text in the BOAMP descriptors: nettoyage, travaux de couverture..." }
        departement: *departement
        date_from: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Earliest publication date, YYYY-MM-DD." }
        date_to: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Latest publication date, YYYY-MM-DD." }
        type_marche: { type: string, enum: [TRAVAUX, FOURNITURES, SERVICES], description: "Works, supplies or services." }
        limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
        offset: { type: integer, minimum: 0, default: 0, description: "Notices skipped: page n is offset (n-1) x limit; total_count gives the volume." }
    examples:
      - title: Cleaning services tenders in Gironde
        input: { query: nettoyage, departement: "33", type_marche: SERVICES, limit: 20 }
      - title: Works notices published since November
        input: { type_marche: TRAVAUX, date_from: "2026-11-01" }
    call:
      method: POST
      path: /api/fr/tenders/search
      body: { query: query, descripteur: descripteur, departement: departement, date_from: date_from,
              date_to: date_to, type_marche: type_marche, limit: limit, offset: offset }
    output: { projection: [results, total_count] }
    cost: { per: request }

  - name: procurement_get_notice
    class: read
    description: >-
      Get one French public tender notice (BOAMP) by its id: buyer
      (organisme), subject, publication date, response deadline
      (date_limite_reponse), procedure, descriptors, summary (synthese) and
      the address of the full notice (url). In French: détail d'un appel
      d'offres, avis de marché boamp.
    input:
      type: object
      additionalProperties: false
      required: [idweb]
      properties:
        idweb: { type: string, pattern: "^[0-9]{2}-[0-9]{1,7}$", description: "BOAMP notice id: two-digit year, dash, number (26-113208)." }
    examples:
      - title: One cleaning tender
        input: { idweb: "26-113208" }
    refusals:
      - { code: notice_not_found, when: "the response is null", message: "No BOAMP notice with this id in FOD's index." }
    expect:
      - { kind: non_empty, refusal: notice_not_found, path: idweb }
    call: { method: GET, path: "/api/fr/tenders/{idweb}" }
    cost: { per: request }

  - name: procurement_search_awarded_contracts
    class: read
    description: >-
      Search French public contracts awarded (DECP, essential data of public
      procurement), latest notification first: {total, rendus, tronque,
      signaux: [{ref_key, arrete, objet, nature, procedure, code_cpv,
      date_notification, duree_mois, montant, acheteur: {siret, nom},
      lieu_execution: {code, type_code, nom}, titulaires: [{rang,
      identifiant, type_identifiant, denomination}]}]}. Says who won, for how
      much and for how long: the real competition of a territory. Since 2024
      the source publishes no name (buyer, place, winners), and before 2024
      never the main winner's: a null name is the source's shape, resolve it
      by SIRET. At least one of mot_cle, titulaire_siret, acheteur_siret,
      lieu. tronque true: more contracts match than were returned. In French:
      marchés publics attribués, titulaires de marchés publics.
    input:
      type: object
      additionalProperties: false
      anyOf:
        - { required: [mot_cle] }
        - { required: [titulaire_siret] }
        - { required: [acheteur_siret] }
        - { required: [lieu] }
      properties:
        mot_cle: { type: string, minLength: 1, maxLength: 200, description: "Text in the subject of the contract." }
        titulaire_siret: { type: string, pattern: "^[0-9]{14}$", description: "Every contract won by this establishment, alone or in a consortium." }
        acheteur_siret: { type: string, pattern: "^[0-9]{14}$", description: "Every contract passed by this buyer." }
        lieu: { type: string, pattern: "^[0-9AB]{2,5}$", description: "Start of the place-of-performance code: a department (59) or a postal code; the kind of code varies per contract." }
        depuis: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Earliest notification date, YYYY-MM-DD." }
        limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
    examples:
      - title: Photovoltaic contracts awarded in the Nord since 2025
        input: { mot_cle: photovoltaïque, lieu: "59", depuis: "2025-01-01" }
      - title: Contracts won by one establishment
        input: { titulaire_siret: "55203253400703", limit: 20 }
    call:
      method: GET
      path: /api/fr/tenders/awarded
      query: { mot_cle: mot_cle, titulaire_siret: titulaire_siret, acheteur_siret: acheteur_siret,
               lieu: lieu, depuis: depuis, limit: limit }
    cost: { per: request }

  # --- Public funding for companies (aides-entreprises.fr) ------------------
  - name: funding_search_schemes
    class: read
    description: >-
      Shortlist French public funding schemes for a company or a project
      (grants, loans, guarantees, calls for projects; State reference base of
      about 2,400 active schemes, refreshed daily): {funnel, count, items:
      [{id, nom, objet, montant, natures, financeurs, niveau, date_fin,
      effectif_codes, source_url}]}. The filter is deterministic (place, by
      the hierarchy commune, department, region, France, EU; headcount;
      nature; deadline; words) and funnel counts what each step kept. Sector
      relevance cannot come from the base, whose tagging covers almost every
      sector: rank the shortlist by reading it, then get each kept scheme by
      its id and quote it, never from memory. The first call after a restart
      of the service is slow. In French: aides publiques, subventions pour une
      entreprise, financements publics.
    input:
      type: object
      additionalProperties: false
      properties:
        insee: { type: string, pattern: "^([0-9]{2}|2A|2B)[0-9]{3}$", description: "INSEE code of the commune (preferred over the postal code)." }
        code_postal: { type: string, pattern: "^[0-9]{5}$", description: "Postal code, when the INSEE code is unknown." }
        effectif: { type: integer, minimum: 0, description: "Number of employees; schemes without a headcount condition stay." }
        nature: { type: string, minLength: 1, maxLength: 60, description: "Part of the kind of aid, in French: subvention, prêt, garantie, avance, exonération, prestation." }
        echeance_avant: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Only schemes closing before this date, YYYY-MM-DD (calls for projects; permanent schemes drop out)." }
        q: { type: string, minLength: 3, maxLength: 200, description: "Words that must all appear in the name, purpose, conditions or beneficiaries: a coarse filter, not a ranking." }
        limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
        offset: { type: integer, minimum: 0, default: 0, description: "Schemes skipped: page n is offset (n-1) x limit; count gives the volume." }
    examples:
      - title: Grants for a 12-employee company in Toulouse
        input: { insee: "31555", effectif: 12, nature: subvention }
      - title: Calls for projects closing before March in Bordeaux
        input: { insee: "33063", echeance_avant: "2027-03-01", limit: 20 }
    call:
      method: POST
      path: /api/fr/aides/search
      body: { insee: insee, code_postal: code_postal, effectif: effectif, nature: nature,
              echeance_avant: echeance_avant, q: q, limit: limit, offset: offset }
    output: { projection: [funnel, count, items] }
    cost: { per: request }

  - name: funding_get_scheme
    class: read
    description: >-
      Get the full record of one French public funding scheme by its id: name,
      purpose, amount, conditions and beneficiaries (aid_nom, aid_objet,
      aid_montant, aid_conditions, aid_benef, decoded text), date_fin, niveau,
      natures, funders, territories, contacts, official sources and forms.
      The source of truth to quote a scheme kept from a search. In French:
      détail d'une aide publique, conditions d'une subvention.
    input:
      type: object
      additionalProperties: false
      required: [id_aid]
      properties:
        id_aid: { type: string, pattern: "^[0-9]{1,10}$", description: "Scheme id, the id of a search result." }
    examples:
      - title: One scheme
        input: { id_aid: "4316" }
    refusals:
      - { code: scheme_not_found, when: "the response is null", message: "No active funding scheme with this id: expired schemes leave the base." }
    expect:
      - { kind: non_empty, refusal: scheme_not_found, path: id_aid }
    call: { method: GET, path: "/api/fr/aides/{id_aid}" }
    cost: { per: request }

  # --- Start-up ecosystem: the French Tech Aix-Marseille site ----------------
  - name: ecosystem_search_directory
    class: read
    description: >-
      Search the directory of the French Tech Aix-Marseille ecosystem (about
      700 start-ups, support structures and service providers of the
      region), read live from the capital's site: {total, results: [{slug,
      nom, type, secteurs, pitch, dirigeant, email, telephone, website,
      ville, code_postal, adresse, date_creation, effectif, ca, fonds_leves,
      recrute, recherche_fonds, besoins, link}]}. Only this capital, not
      every French Tech. dirigeant, email and telephone are the persons the
      companies declared, personal data published for the ecosystem: reuse
      them within the GDPR. ca and the other figures are declared once by
      the company and not kept up to date. Without all_results, the first
      page only (per_page entries), and ville filters that page; total
      counts what is returned. secteur and type_annuaire take a term exactly
      as the results name it in secteurs and type. In French: annuaire french
      tech, startups de la région, structures d'accompagnement.
    input:
      type: object
      additionalProperties: false
      properties:
        query: { type: string, minLength: 2, maxLength: 120, description: "Words searched in the name and the text of each entry." }
        secteur: { type: string, minLength: 2, maxLength: 120, description: "One sector, exactly as an entry's secteurs names it, case ignored." }
        type_annuaire: { type: string, minLength: 2, maxLength: 120, description: "One kind of entry, exactly as an entry's type names it, case ignored: une start-up, une structure d’accompagnement, Partenaire écosystème, Services aux start-up, une personnalité qualifiée." }
        ville: { type: string, minLength: 2, maxLength: 80, description: "Town, exact match, case ignored: Marseille." }
        all_results: { type: boolean, default: false, description: "true reads every page of the directory before filtering by town: several requests to the site." }
        per_page: { type: integer, minimum: 1, maximum: 100, default: 100 }
    examples:
      - title: Start-ups speaking of artificial intelligence in Marseille
        input: { query: intelligence artificielle, ville: Marseille, all_results: true }
    refusals:
      - { code: unknown_directory_term, when: 500,
          message: "secteur or type_annuaire names no term of the directory: take the term from the secteurs or type of a result, or search without it." }
    call:
      method: POST
      path: /api/frenchtech/annuaire/search
      body: { query: query, secteur: secteur, type_annuaire: type_annuaire, ville: ville,
              all_results: all_results, per_page: per_page }
    timeout_s: 120
    cost: { per: request }

  - name: ecosystem_get_directory_entry
    class: read
    description: >-
      Get one entry of the French Tech Aix-Marseille directory by its slug,
      the slug of a search result: same fields as a result (pitch, director,
      contact, sectors, figures declared by the company, needs). In French:
      fiche d'une startup, fiche de l'annuaire french tech.
    input:
      type: object
      additionalProperties: false
      required: [slug]
      properties:
        slug: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 200, description: "Slug of a directory entry, as a search result gives it." }
    examples:
      - title: One directory entry
        input: { slug: hsti-france-2 }
    refusals:
      - { code: directory_entry_not_found, when: "the response is null",
          message: "No directory entry with this slug: take it from a directory search." }
    expect:
      - { kind: non_empty, refusal: directory_entry_not_found, path: slug }
    call: { method: GET, path: "/api/frenchtech/annuaire/{slug}" }
    cost: { per: request }

  - name: ecosystem_list_members
    class: read
    description: >-
      List the member pages of the French Tech Aix-Marseille community,
      named persons: {total, results: [{slug, titre, date, resume, link,
      localisation}]}. titre is the person's name, resume the start of the
      page. Personal data published by the site: reuse within the GDPR.
      Without all_results, the latest 100; total counts what is returned. In
      French: membres de la communauté french tech, membres french tech.
    input:
      type: object
      additionalProperties: false
      properties:
        query: { type: string, minLength: 2, maxLength: 120, personal: true, description: "Words searched in the member pages, such as a name." }
        all_results: &ecosystem_all { type: boolean, default: false, description: "true reads every page of the site: several requests." }
    examples:
      - title: Latest member pages
        input: {}
    call:
      method: GET
      path: /api/frenchtech/membres
      query: { query: query, all_results: all_results }
    timeout_s: 120
    cost: { per: request }

  - name: ecosystem_list_events
    class: read
    description: >-
      List the events of the French Tech Aix-Marseille agenda (meetups,
      conferences), newest publication first: {total, results: [{slug,
      titre, date, resume, link, localisation}]}. date is when the page was
      published, not when the event takes place: read it in resume or on
      the page. Without all_results, the latest 50. In French: événements french
      tech, agenda french tech.
    input:
      type: object
      additionalProperties: false
      properties:
        query: &ecosystem_query { type: string, minLength: 2, maxLength: 120, description: "Words searched in the title and text." }
        all_results: *ecosystem_all
    examples:
      - title: Events about fundraising
        input: { query: levée de fonds }
    call:
      method: GET
      path: /api/frenchtech/evenements
      query: { query: query, all_results: all_results }
    timeout_s: 120
    cost: { per: request }

  - name: ecosystem_list_calls
    class: read
    description: >-
      List the calls for applications relayed by French Tech Aix-Marseille
      (calls for projects, competitions, calls for expressions of interest),
      newest publication first: {total, results: [{slug, titre, date,
      resume, link, localisation}]}. The deadline is in the text, not in a
      field: read resume or the page before saying a call is open. Without
      all_results, the latest 50. In French: appels à projets, appels à
      candidatures french tech.
    input:
      type: object
      additionalProperties: false
      properties:
        query: *ecosystem_query
        all_results: *ecosystem_all
    examples:
      - title: Calls about health
        input: { query: santé }
    call:
      method: GET
      path: /api/frenchtech/appels
      query: { query: query, all_results: all_results }
    timeout_s: 120
    cost: { per: request }

  - name: ecosystem_list_funding
    class: read
    description: >-
      List the funding schemes French Tech Aix-Marseille presents to
      start-ups: {total, results: [{slug, titre, date, resume, link,
      type_financement, montant_maximum, critere_elegibilite, stade,
      localisation}]}, the last five lists of labels. A selection by the
      site, not the State reference base of public funding schemes, which
      the funding search covers. Without all_results, the latest 100. In French:
      financements pour startups, aides french tech.
    input:
      type: object
      additionalProperties: false
      properties:
        query: *ecosystem_query
        all_results: *ecosystem_all
    examples:
      - title: Funding for innovation
        input: { query: innovation }
    call:
      method: GET
      path: /api/frenchtech/financements
      query: { query: query, all_results: all_results }
    timeout_s: 120
    cost: { per: request }

  - name: ecosystem_list_central_services
    class: read
    description: >-
      List the appointments French Tech Central Aix-Marseille offers with
      State correspondents and partners (research tax credit and JEI
      status, public procurement, export, European and national funding,
      business and labour law...), read live from its booking page: {company, scenarios:
      [{name, duration, price}]}. Gives who a start-up can meet, not the
      free slots: booking is done on the page. In French: rendez-vous french tech
      central, correspondants de l'état.
    input:
      type: object
      additionalProperties: false
      properties: {}
    examples:
      - title: Appointments offered
        input: {}
    refusals:
      - { code: central_services_unavailable, when: 500,
          message: "The booking page of French Tech Central answered without its list of appointments: retry later." }
    call: { method: GET, path: /api/frenchtech/ftc_scenarios }
    cost: { per: request }
