# Common cases of the Custom API profile (docs/conception/custom-api.md): the definitions it accepts, those it refuses
# with their codes, OpenAPI documents with the candidates they give, and definitions of oto 1 with their takeover.
#
# Synthetic: made-up tools, addresses in domains reserved for tests. tests/test_custom_api_cases.py plays them against
# the Python package (`oto.connectors.custom_api`); the TypeScript module of the host package plays the same cases.
#
# - valid: a definition the profile accepts (`validate` finds nothing), by name;
# - refused: a valid definition (`base`) changed by `changes`, each a dotted path (a list index as a number) and either
#   `value` (set) or `remove: true`; `codes` is the set of the codes found, `rules` the set of the rules of the format
#   named by `custom_api_rule_broken`, when it has a code;
# - openapi: a document (a text, JSON or YAML), the names of the candidates with their problem codes, the operations
#   skipped by method, path and code, and the problem codes of the connector proposed; or `refused`, the code of a
#   document that is none;
# - oto1: an application of oto 1, the status of its takeover and its blocking codes; `expected` gives parts of the
#   document built: the connector's keys it names, and the functions, whole.

valid:
  - name: acme_planning
    document:
      connector:
        name: custom_acme_planning
        label: Acme Planning
        description: Shifts of the teams of an organisation, read and planned.
        logo_domain: acme-planning.test
        namespace: custom_acme_planning
        version: 1.0.3
        api_version: v2
        base_url: https://api.acme-planning.test/v2
        auth:
          kind: oauth2_user
          authorize_url: https://auth.acme-planning.test/oauth/authorize
          token_url: https://auth.acme-planning.test/oauth/token
          client_auth: body
          scopes: [shifts.read, shifts.write, openid, email]
          pkce: S256
          refresh: refresh_token
          rotates: true
          expires_in_default: 3600
          identity: { url: https://auth.acme-planning.test/userinfo, path: email, scopes: [openid, email] }
        modes: [byo_user]
        headers: { Acme-Api-Version: "2026-06" }
        errors:
          - { status: 401, code: authorization_expired, retryable: false, marks_account: credential_rejected,
              message: "Acme Planning no longer accepts this authorization: the person must connect again." }
          - { status: 404, code: not_found, retryable: false, message: "Acme Planning object not found." }
          - { status: 429, code: rate_limited, retryable: true, message: "Acme Planning rate limit reached: retry later." }
      functions:
        - name: list_shifts
          class: read
          description: Shifts of one team between two dates, each with its employee, start, end and note.
          input:
            type: object
            additionalProperties: false
            required: [team_id, from]
            properties:
              team_id: { type: string, minLength: 1 }
              from: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
              to: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
              cursor: { type: string }
          examples:
            - { title: A team's week, input: { team_id: tm_42, from: "2026-11-16", to: "2026-11-22" } }
          call:
            method: GET
            path: /teams/{team_id}/shifts
            query: { start_date: from, end_date: to, cursor: cursor }
          pagination: { kind: cursor, request_param: cursor, next: meta.next_cursor, max_pages: 5 }
          output: { items: data, strip: [internal_notes] }
        - name: create_shift
          class: write
          description: Create a shift for an employee of a team. Refused when it overlaps another shift of that employee.
          input:
            type: object
            additionalProperties: false
            required: [team_id, employee_id, starts_at, ends_at]
            properties:
              team_id: { type: string, minLength: 1 }
              employee_id: { type: string, minLength: 1, personal: true }
              starts_at: { type: string }
              ends_at: { type: string }
              note: { type: string, maxLength: 500 }
          examples:
            - { title: A morning shift, input: { team_id: tm_42, employee_id: em_7,
                starts_at: "2026-11-20T08:00:00Z", ends_at: "2026-11-20T12:00:00Z" } }
          refusals:
            - { code: shift_overlaps, when: 200, body: { path: error.code, equals: [OVERLAP] },
                message: "The shift overlaps another shift of this employee: nothing was created." }
          call:
            method: POST
            path: /teams/{team_id}/shifts
            body: { employee: { id: employee_id }, start: starts_at, end: ends_at, note: note }
            constants: { body: { source: oto } }

  - name: acme_tickets
    document:
      connector:
        name: custom_acme_tickets
        label: Acme Tickets
        namespace: custom_acme_tickets
        version: 1.0.0
        api_version: unspecified
        base_url: https://tickets.example.com/api
        auth: { kind: bearer, token: token }
        credential:
          - { name: token, label: API key, secret: true }
        modes: [byo_user, byo_org]
        probe: { function: whoami }
        errors:
          - { status: 401, code: unauthorized, retryable: false, marks_account: credential_rejected,
              message: "Acme Tickets refuses the credential of this account: it must be set again." }
      functions:
        - name: whoami
          class: read
          description: The account the key belongs to.
          input: { type: object, additionalProperties: false, properties: {} }
          examples: [{ title: Without arguments, input: {} }]
          call: { method: GET, path: /me }
        - name: delete_ticket
          class: sensitive
          effect: destroy
          description: Delete a ticket for good.
          input:
            type: object
            additionalProperties: false
            required: [ticket_id]
            properties: { ticket_id: { type: string, minLength: 1 } }
          examples: [{ title: One ticket, input: { ticket_id: t_1 } }]
          confirm: { summary: "DELETE /tickets/{ticket_id}: irreversible." }
          call: { method: DELETE, path: "/tickets/{ticket_id}", constants: { query: { hard: true } } }

