    codes: [custom_api_key_not_allowed]
  - name: class_missing
    base: acme_tickets
    changes: [{ path: functions.0.class, remove: true }]
    codes: [custom_api_schema_invalid]
  - name: body_key_twice
    base: acme_planning
    changes: [{ path: functions.1.call.constants.body, value: { start: "2026-01-01T00:00:00Z" } }]
    codes: [custom_api_rule_broken]
    rules: [body_key_twice]
  - name: strip_overlaps
    base: acme_planning
    changes: [{ path: functions.0.output.strip, value: [internal_notes, internal_notes.author] }]
    codes: [custom_api_rule_broken]
    rules: [strip_path_overlaps]
  - name: argument_goes_nowhere
    base: acme_tickets
    changes: [{ path: functions.0.input.properties.verbose, value: { type: boolean } }]
    codes: [custom_api_rule_broken]
  - name: several_problems_at_once
    base: acme_tickets
    changes:
      - { path: connector.base_url, value: "http://localhost/api" }
      - { path: connector.headers, value: { Cookie: "a=b" } }
      - { path: functions.1.examples, remove: true }
    codes: [custom_api_base_url_not_https, custom_api_example_missing, custom_api_header_authenticates]

openapi:
  - name: openapi_3_yaml
    document: |
      openapi: 3.0.3
      info: { title: Acme Planning, version: "2" }
      servers: [{ url: "https://api.acme-planning.test/v2/" }]
      security: [{ key: [] }]
      components:
        securitySchemes:
          key: { type: apiKey, in: header, name: X-Api-Token }
        schemas:
          Shift:
            type: object
            required: [employeeId]
            properties:
              employeeId: { type: string, example: em_7 }
              note: { type: string, nullable: true }
          Loop: { $ref: "#/components/schemas/Loop2" }
          Loop2: { $ref: "#/components/schemas/Loop" }
      paths:
        /teams/{teamId}/shifts:
          parameters:
            - { name: teamId, in: path, required: true, schema: { type: string }, example: tm_42 }
          get:
            operationId: listShifts
            summary: Shifts of a team
            parameters:
              - { name: from, in: query, schema: { type: string } }
              - { name: X-Trace, in: header, schema: { type: string } }
              - { name: sid, in: cookie, schema: { type: string } }
          post:
            operationId: createShift
            requestBody:
              required: true
              content: { application/json: { schema: { $ref: "#/components/schemas/Shift" } } }
          delete:
            operationId: listShifts
          head: {}
        /reports/{reportId}:
          get:
            parameters:
              - { name: reportId, in: path, required: true, schema: { type: string } }
        /upload:
          post:
            requestBody: { content: { multipart/form-data: { schema: { type: object } } } }
        /batch:
          post:
            requestBody: { content: { application/json: { schema: { type: array, items: { type: string } } } } }
        /loop:
          post:
            requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Loop" } } } }
        /external:
          get:
            parameters: [{ $ref: "other.yaml#/components/parameters/p" }]
        /session:
          get:
            parameters: [{ name: sid, in: cookie, required: true, schema: { type: string } }]
    candidates:
      - { name: list_shifts, problems: [] }
      - { name: create_shift, problems: [] }
      - { name: list_shifts_2, problems: [openapi_name_collision] }
      - { name: get_reports, problems: [custom_api_example_missing] }
    skipped:
      - { method: HEAD, path: "/teams/{teamId}/shifts", code: openapi_method_not_supported }
      - { method: POST, path: /upload, code: openapi_body_not_json }
      - { method: POST, path: /batch, code: openapi_body_not_object }
      - { method: POST, path: /loop, code: openapi_ref_too_deep }
      - { method: GET, path: /external, code: openapi_ref_external }
      - { method: GET, path: /session, code: openapi_cookie_parameter }
    connector_problems: []

  - name: swagger_2_json
    document: |
      {"swagger": "2.0", "info": {"title": "Acme Stock", "version": "1"},
       "host": "stock.example.com", "basePath": "/v1", "schemes": ["https"],
       "securityDefinitions": {"basic": {"type": "basic"}},
       "paths": {
         "/items": {
           "get": {"operationId": "listItems", "parameters": [{"name": "limit", "in": "query", "type": "integer"}]},
           "post": {"operationId": "createItem", "parameters": [{"name": "body", "in": "body", "required": true,
                    "schema": {"type": "object", "required": ["sku"], "properties": {"sku": {"type": "string"}},
                               "example": {"sku": "A-1"}}}]}},
         "/items/import": {
           "post": {"operationId": "importItems", "parameters": [{"name": "file", "in": "formData", "type": "file"}]}}}}
    candidates:
      - { name: list_items, problems: [] }
      - { name: create_item, problems: [] }
    skipped:
      - { method: POST, path: /items/import, code: openapi_body_not_json }
    connector_problems: []

  - name: server_variables_and_openid
    document: |
      openapi: 3.1.0
      info: { title: Acme Desk, version: "1" }
      servers: [{ url: "https://{tenant}.desk.example.com", variables: { tenant: { default: demo } } }]
      components:
        securitySchemes:
          oidc: { type: openIdConnect, openIdConnectUrl: "https://auth.desk.example.com/.well-known/openid-configuration" }
      paths:
        /me: { get: { operationId: me } }
    candidates:
      - { name: me, problems: [] }
    skipped: []
    connector_problems: [openapi_openid_connect, openapi_server_variables]

  - name: oauth2_flows
    document: |
      openapi: 3.0.0
      info: { title: Acme Mail, version: "1" }
      servers: [{ url: "https://mail.example.com/api" }]
      components:
        securitySchemes:
          consent:
            type: oauth2
            flows:
              authorizationCode:
                authorizationUrl: https://mail.example.com/oauth/authorize
                tokenUrl: https://mail.example.com/oauth/token
                scopes: { mail.read: Read mail }
      paths:
        /messages: { get: { operationId: listMessages } }
    candidates:
      - { name: list_messages, problems: [] }
    skipped: []
    connector_problems: [custom_api_schema_invalid]

  - name: not_a_document
    document: |
      {"title": "not an API description"}
    refused: openapi_not_a_document

oto1:
  - name: key_in_header_with_variables
    application:
      account: Acme Payroll
      connection: { base_url: "https://api.acme-payroll.test/v1/", auth_mode: header, header_name: X-Acme-Key,
                    doc_path: /openapi.json }
      definition:
        label: Acme Payroll
        description: Payroll of the org.
        headers: { Acme-Version: "2" }
        variables:
          organizationId: { value: org_1, description: The org at the payroll tool. }
          pageSize: { value: "50", description: Page size. }
        operations:
          - name: list_collaborators
            description: The collaborators of the organization.
            method: GET
            path: /organizations/{organizationId}/collaborators
            input:
              type: object
              properties: { organizationId: { type: string }, pageSize: { type: integer }, fullName: { type: string } }
              required: [organizationId]
            output: { items: data }
          - name: search_payslips
            description: Search payslips.
            method: POST
            path: /payslips/search
            class: read
            input: { type: object, properties: { employeeId: { type: string } }, required: [employeeId] }
            refusals:
              - { code: unknown_employee, when: 200, body: { path: error, equals: [UNKNOWN] }, message: Unknown employee.,
                  retryable: true }
    status: blocked
    blocking: [custom_api_example_missing]

  - name: converted_whole
    application:
      account: Acme Payroll
      connection: { base_url: "https://api.acme-payroll.test/v1", auth_mode: header, header_name: X-Acme-Key }
      definition:
        description: " Payroll of the org. "
        logo_domain: acme-payroll.test
        variables: { organizationId: { value: org_1, description: "" } }
        operations:
          - name: list_collaborators
            description: The collaborators of the organization.
            method: GET
            path: /organizations/{organizationId}/collaborators
            input:
              type: object
              properties: { organizationId: { type: string }, fullName: { type: string } }
              required: [organizationId]
          - name: clear_drafts
            description: Remove every draft payslip.
            method: DELETE
            path: /organizations/{organizationId}/drafts
            input: { type: object, properties: { organizationId: { type: string }, olderThan: { type: string } },
                     required: [organizationId] }
    status: converted
    blocking: []
    expected:
      connector:
        name: custom_acme_payroll
        description: Payroll of the org.
        logo_domain: acme-payroll.test
        base_url: https://api.acme-payroll.test/v1
        auth: { kind: api_key, in: header, name: X-Acme-Key, key: token }
        credential: [{ name: token, label: API key, secret: true }]
        modes: [byo_user, byo_org]
      functions:
        - name: list_collaborators
          class: read
          description: The collaborators of the organization.
          input: { type: object, additionalProperties: false, properties: { full_name: { type: string } } }
          examples: [{ title: Without arguments, input: {} }]
          call: { method: GET, path: /organizations/org_1/collaborators, query: { fullName: full_name } }
        - name: clear_drafts
          class: sensitive
          effect: destroy
          confirm: { summary: "DELETE /organizations/org_1/drafts: irreversible." }
          description: Remove every draft payslip.
          input: { type: object, additionalProperties: false, properties: { older_than: { type: string } } }
          examples: [{ title: Without arguments, input: {} }]
          call: { method: DELETE, path: /organizations/org_1/drafts, query: { olderThan: older_than } }

  - name: oauth2_client_credentials
    application:
      account: acme_ledger
      connection: { base_url: "https://ledger.example.com/api", auth_mode: oauth2,
                    token_url: "https://ledger.example.com/oauth/token", scope: ledger.read }
      definition:
        operations:
          - { name: list_entries, description: Ledger entries., method: GET, path: /entries }
    status: converted
    blocking: []
    expected:
      connector:
        auth: { kind: oauth2_client_credentials, token_url: "https://ledger.example.com/oauth/token",
                token_request: form, client_auth: body, client_id: client_id, client_secret: client_secret,
                scope: ledger.read }
        credential: [{ name: client_id, label: Client ID, secret: false },
                     { name: client_secret, label: Client secret, secret: true }]

  - name: basic_and_query
    application:
      account: acme_basic
      connection: { base_url: "https://basic.example.com", auth_mode: basic }
      definition: { operations: [{ name: ping, description: Ping., method: GET, path: /ping }] }
    status: converted
    blocking: []
    expected:
      connector:
        auth: { kind: basic, username: username, password: password }

  - name: session_mode
    application:
      account: acme_portal
      connection: { base_url: "https://portal.example.com", auth_mode: session, session: "{\"login\": {\"path\": \"/login\"}}" }
      definition: { operations: [{ name: ping, description: Ping., method: GET, path: /ping }] }
    status: blocked
    blocking: [custom_api_auth_not_supported]

  - name: visitor_mode
    application:
      account: acme_public
      connection: { base_url: "https://public.example.com", auth_mode: visitor }
      definition: { operations: [{ name: ping, description: Ping., method: GET, path: /ping }] }
    status: blocked
    blocking: [custom_api_auth_not_supported]

  - name: base_url_in_http
    application:
      account: acme_old
      connection: { base_url: "http://old.example.com/api", auth_mode: none }
      definition: { operations: [{ name: ping, description: Ping., method: GET, path: /ping }] }
    status: blocked
    blocking: [custom_api_base_url_not_https]

  - name: base_url_internal
    application:
      account: acme_lan
      connection: { base_url: "https://192.168.1.10/api", auth_mode: bearer }
      definition: { operations: [{ name: ping, description: Ping., method: GET, path: /ping }] }
    status: blocked
    blocking: [custom_api_base_url_internal]

  - name: argument_name_collision
