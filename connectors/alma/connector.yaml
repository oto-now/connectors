# yaml-language-server: $schema=../connector.schema.json
# Alma API v1 (reference https://docs.almapay.com/reference/v10, pages "Authentification", "Format des données",
# "Erreurs", "Payment", "Récupérer une liste de Payments", "Récupérer un Paiement", "Récupérer une liste de Balance
# Transactions", "Order", "Refund", read on 2026-11-20). No Python client: this description is the only source.
#
# Read only. Three functions: the payments of a merchant account, one payment with its installment plan, and the
# balance transactions (what each payment, refund, fee and payout moved on the merchant balance). Not described, on
# purpose: every route that creates, changes, cancels or captures a payment, creates a refund, sends a payment link
# by SMS or email, or writes an order or an address. Alma's API keys carry no scope (none is documented): the same key
# can move money, so this connector never declares a write, and an act side does not exist.
#
# No customer data reaches the agent. A payment carries its customer (name, email, phone, business id), a shipping
# and a billing address, the seller who took it (a person of the merchant: name, display name, email), the address of
# its Alma page (a summary of the payment once paid) and, on each order, the customer's tracking page; custom_data and
# cart are free-form data of the merchant, which often hold the customer's name or email. All are stripped
# (output.strip). The order or invoice reference stays readable in orders.merchant_reference. The customer_email
# filter of the payments list is not described, for the same reason: no function looks a person up.
#
# Account: the merchant's API key, in the header "Authorization: Alma-Auth <key>". Live keys are made in the Alma
# dashboard, Settings, API configuration; the sandbox (api.sandbox.getalma.eu) has its own keys and its own data, and
# is not reachable here: base_url is production. A parent merchant account reaches its child accounts with
# merchant=all on the balance transactions; the payments list documents no such filter.
#
# Lists answer {data, has_more}, newest first. The next page is asked with starting_after = the id of the last item
# of the page: the format does not describe a cursor taken from an item, so the agent passes it itself (the argument
# says how). limit: 20 by default, 100 at most. Dates are POSIX timestamps in seconds; amounts are integers in euro
# cents.
#
# The state filter of the payments list takes the values its reference names (not_started, scored_no, scored_yes,
# scored_maybe, paid); the payment object describes processing_status instead, with other values. Not checked on a
# real call (no key at hand): the state values accepted, the error bodies, the rate limit (none is published; a 429 is).
#
# Probe: list_payments, a read without argument.
connector:
  name: alma
  label: Alma
  description: >-
    Alma, buy now pay later (split, deferred and credit payments) for merchants: read the payments of a merchant
    account with their installment plans, fees and refunds, and the balance transactions that settle them into
    payouts. Read only; customer identity and addresses never reach the agent.
  logo_domain: almapay.com
  namespace: alma
  version: 1.0.1
  api_version: v1
  base_url: https://api.getalma.eu/v1
  auth: { kind: api_key, in: header, name: Authorization, key: api_key, prefix: "Alma-Auth " }
  credential:
    - { name: api_key, label: API key, secret: true }
  # A merchant's key, made in its Alma dashboard. No platform key.
  modes: [byo_org]
  timeout_s: 60
  probe: { function: list_payments }
  errors:
    - { status: 400, code: invalid_request, retryable: false,
        message: "Alma rejected the request: a parameter is missing or invalid (a date, limit, starting_after or a filter value)." }
    - { status: 401, code: key_refused, retryable: false, marks_account: credential_rejected,
        message: "Alma rejected the API key: invalid or revoked. A key is made in the Alma dashboard, Settings, API configuration." }
    - { status: 404, code: not_found, retryable: false,
        message: "Not found in Alma: wrong id, or an object of another merchant account than the key's." }
    - { status: 429, code: rate_limited, retryable: true,
        message: "Alma rate limit reached: wait a moment, then retry." }
    - { status: [500, 502, 503, 504], code: upstream_unavailable, retryable: true,
        message: "Alma is temporarily unavailable: try again later." }

functions:
  - name: list_payments
    class: read
    description: >-
      List the payments of the merchant account, newest first: id, merchant_name, state, created, updated,
      purchase_amount (cents, without Alma fees), kind (P1X, P3X, P4X, P10X, P1X_D+30…), payment_plan (each
      installment: due_date, date_paid, state, amounts), orders (merchant_reference), origin, deferred_months,
      deferred_days, refunds. Filters: created_after, created_before (POSIX seconds, inclusive), state. Up to limit
      payments per page (100 at most); when has_more is true, pass the id of the last payment as starting_after.
      Customer identity, addresses, the seller and the merchant's free-form data are never given. In French: lister
      les paiements alma, paiements en plusieurs fois, paiements fractionnés des clients.
    input:
      type: object
      additionalProperties: false
      properties:
        created_after: &created_after { type: integer, minimum: 0, description: "Payments created at or after this POSIX timestamp, in seconds." }
        created_before: &created_before { type: integer, minimum: 0, description: "Payments created at or before this POSIX timestamp, in seconds." }
        state: { type: string, enum: [not_started, scored_no, scored_yes, scored_maybe, paid], description: "Payment state." }
        limit: &limit { type: integer, minimum: 1, maximum: 100, description: "Page size, 20 by default, at most 100." }
        starting_after: { type: string, pattern: "^payment_[A-Za-z0-9]+$", description: "Next page: the id of the last payment of the previous page." }
    examples:
      - { title: The latest payments, input: {} }
      - { title: Paid payments of October 2026, input: { created_after: 1790805600, created_before: 1793487599, state: paid, limit: 100 } }
      - { title: The next page, input: { limit: 100, starting_after: payment_11aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa } }
    call:
      method: GET
      path: /payments
      query:
        created_after: created_after
        created_before: created_before
        state: state
        limit: limit
        starting_after: starting_after
    output:
      items: data
      strip: &payment_strip [customer, shipping_address, billing_address, url, seller, custom_data, cart, orders.customer_url]
      sample:
        data:
          - id: payment_0
            purchase_amount: 120000
            kind: P3X
            customer: { id: customer_0, first_name: Jane, last_name: Doe, email: jane@example.test, phone: "+33000000000" }
            shipping_address: { line1: 1 rue de Test }
            billing_address: { line1: 1 rue de Test }
            url: "https://pay.example.test/payment_0"
            seller: { id: user_0, name: Seller, email: seller@example.test }
            custom_data: { invoice: inv-0 }
            cart: { items: [] }
            orders: [{ id: order_0, merchant_reference: inv-0, customer_url: "https://shop.example.test/o/0" }]
        has_more: false
    cost: &request { per: request }

  - name: get_payment
    class: read
    description: >-
      One payment of the merchant account: amounts (purchase_amount, fees.merchant, customer_fee, customer_interest,
      annual_interest_rate, cents), kind and installments_count, processing_status and cancelation_reason, created,
      expired_at, the installment plan (payment_plan: due_date, date_paid, state pending, paid or covered, amounts),
      deferred capture, orders (merchant_reference), refunds (amount_already_refunded, is_completely_refunded),
      payout. Customer identity, addresses, the seller, the merchant's free-form data (custom_data, cart) and the
      payment page address are never given. In French: détail d'un paiement alma, échéancier d'un paiement,
      échéances d'un paiement en plusieurs fois.
    input:
      type: object
      additionalProperties: false
      required: [payment_id]
      properties:
        payment_id: { type: string, pattern: "^payment_[A-Za-z0-9]+$", description: "A payment id (payment_…), from list_payments." }
    examples:
      - { title: A payment, input: { payment_id: payment_11aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa } }
    call:
      method: GET
      path: "/payments/{payment_id}"
    output:
      strip: *payment_strip
      sample:
        id: payment_0
        purchase_amount: 120000
        customer: { id: customer_0, first_name: Jane, last_name: Doe, email: jane@example.test, phone: "+33000000000" }
        shipping_address: { line1: 1 rue de Test }
        billing_address: { line1: 1 rue de Test }
        url: "https://pay.example.test/payment_0"
        seller: { id: user_0, name: Seller, email: seller@example.test }
        custom_data: { invoice: inv-0 }
        cart: { items: [] }
        orders: [{ id: order_0, merchant_reference: inv-0, customer_url: "https://shop.example.test/o/0" }]
    cost: *request

  - name: list_balance_transactions
    class: read
    description: >-
      List the balance transactions of the merchant account, newest first: what a payment, a refund, an adjustment,
      a fee waiver or a payout moved on the balance. Each has amount, net_amount, merchant_fee (cents), kind,
      payment_id, refund_id, payout_id, included_in_payout_id (the payout that settled it), available_on, created.
      merchant: a merchant id, or all to include the child accounts the key reaches (the key's own account by
      default). kind filters by type. Up to limit per page (100 at most); when has_more is true, pass the id of the
      last transaction as starting_after. In French: mouvements du solde alma, virements alma reçus, frais alma
      prélevés, transactions du solde marchand.
    input:
      type: object
      additionalProperties: false
      properties:
        merchant: { type: string, pattern: "^(all|merchant_[A-Za-z0-9]+)$", description: "A merchant id (merchant_…), or all for the child accounts too." }
        kind:
          type: string
          enum: [from_transaction, from_adjustment, from_payout, from_refund, from_fee_waiver, from_merchant_default_coverage]
          description: "Type of balance transaction."
        limit: *limit
        starting_after: { type: string, pattern: "^balance_txn_[A-Za-z0-9]+$", description: "Next page: the id of the last transaction of the previous page." }
    examples:
      - { title: The latest balance transactions, input: {} }
      - { title: Payouts of every child account, input: { merchant: all, kind: from_payout, limit: 100 } }
    call:
      method: GET
      path: /balance-transactions
      query:
        merchant: merchant
        kind: kind
        limit: limit
        starting_after: starting_after
    output: { items: data }
    cost: *request
